$(\\text{DPV} + \\text{關稅} + \\text{貨物稅} + \\text{營業稅}) \\times 10\\%$（門檻如小客車完稅＋稅費 ≧ 300 萬元）\n\n### 2. 欠稅保全門檻\n- 納稅義務人欠繳應繳關稅、滯納金或罰鍰達一定金額（個人 **50 萬元**以上／營利事業依關 §48 規定門檻，實務保全限制出境個人 100 萬、營利事業 200 萬；假扣押／禁止財產處分得依關 §48 辦理）。\n\n---\n\n## 五、進口貨物原產地認定標準與三角貿易【115 申論二、Q22、Q23、Q25！】\n\n### 1. 一般貨物與農產品原產地認定（115 Q23 必考！）\n- **完全生產（§6）**：在該國完全取得或生產（採收、飼養、開採等）。\n- **實質轉型（§7）**（涉及二個以上國家加工時）：符合下列之一即發生實質轉型：\n  1. **稅則號別改變**：加工後貨品與原材料之 **HS 前 6 碼**相異。\n  2. **附加價值率 \u003e 35%**：$(\\text{出口 FOB} - \\text{直間接進口原料 CIF}) \\div \\text{出口 FOB} \u003e 35\\%$。\n  3. **特定貨品重要製程**：經經濟部與財政部會同公告之重要製程。\n- **⚠️ 簡單加工不生實質轉型**：乾燥、冷藏、簡單混合、分裝、貼標等均不認定為實質轉型。\n- **🔥 九大敏感農產品「排除實質轉型（一律以採收地為原產地）」清單（115 Q23 正解！）**：\n  \u003e **大蒜、茶葉、香菇、竹筍、稻米、花生、梅、李、金針**（口訣：「**蒜茶菇筍米，花梅李金針**」——⚠️ **不含紅豆**！）  \n  \u003e 📌 **115 Q23 實例**：中國大陸採收之香菇、竹筍、梅、李、金針，即使運到韓國乾燥、再運到日本調製加工至 **HS 前 6 碼改變且附加價值超過 35%**，依《進口貨物原產地認定標準》§7 特別排除條款，**其原產地仍認定為「中國大陸」**！\n- **瓷磚**：僅限**稅則前 6 碼改變**認定實質轉型（不適用附加價值率 35%）。\n\n### 2. 低度開發國家（LDC）原產貨物認定與直接運輸規定【🔥 115 申論第 2 題，20 分！】\n\u003e **115 申論第 2 題標準高分架構（《進口貨物原產地認定標準》§9、§10）**：\n\n- **(一) 認定為低度開發國家原產貨物之規定（10 分）**：\n  1. **完全取得或完全生產**於該低度開發國家之貨物；或\n  2. 雖非完全生產，但於該低度開發國家加工製造，其**原產地附加價值率（或原料及加工成本）達 50% 以上**（即非原產材料價值不超過離岸價格 50%），並完成最終實質製程者。\n  3. （附記：簡單包裝、分裝、組合、貼標、乾燥保存等非實質加工不予計入。）\n- **(二) 申請優惠關稅之「運輸規定」（直接運輸原則，10 分）**：\n  - 進口時應檢具該國官方或授權機構簽發之有效**原產地證明書**（報單填 `PT`），並符合下列運輸規定之一：\n    1. **直接運輸**：自該低度開發國家**直接運至我國**，未經過第三國（地區）。\n    2. **經第三國轉運之例外容許條件**：因地理因素或運輸需要經過第三國（地區）轉運者，須同時符合：\n       - 貨物在第三國**僅進行卸貨、重裝或維持貨物良好狀態所必要之處理**（不得進行加工或商業交易進入該國市場）；\n       - 貨物在第三國停留期間**始終處於該第三國海關監管之下**；\n       - 進口時檢附**聯運提單**（全程提單）或**第三國海關核發之未再加工證明文件**（或海關認可之證明文件）。\n\n### 3. ECFA 早收產證必背數字\n- 每份 ECFA 原產地證明書限載 **≦ 20 項**貨品；**一份產證對應一份進口報單**；若進口時未及檢附，應於**貨物放行後 4 個月內**補送；經第三地轉運停留不得逾 **60 天**。\n\n### 4. 三角貿易通關作業規定（115 Q22、Q25 必考！）\n- **報單申報**：以 `G1`（納稅辦法 `90`）＋ `G3`（統計方式 `90`）同時申報，或使用進出口合一報單 **`TA`**。\n- **放行先後順序（115 Q25 正解！）**：**先經進口單位辦理「進口放行」後，再由出口單位辦理「出口放行」**！\n- **簽審規定（115 Q22 正解！）**：三角貿易因貨物僅暫存未進入國內市場，**無論是否列屬限制輸出／入貨品，原則上均免繳驗出、進口許可證**；⚠️ **但屬「戰略性高科技貨品（SHTC）」或菸品等特定法令管制者，仍應取得輸出許可證！**\n\n---\n\n## 六、考前極速自檢清單\n- [ ] 能秒答報單代碼：**`D7`**（倉轉倉／倉去廠）vs **`B2`**（廠對廠／廠進倉）、**`T1`**（轉運國內他關區／科學園區）、**`TA`**（三角貿易合一報單）？\n- [ ] 能秒答補單天數：**C1 / C3X 免補單通知補送＝3 日內**；**C2 / C3M＝翌日辦公時間終了前**？\n- [ ] 能背出九大「採收地原則」農產品（**蒜茶菇筍米、花梅李金針**，不含紅豆）及 **LDC 50%＋直接運輸 3 要件**？\n- [ ] 能背出報單填報關鍵碼：舊品 **`Used`**、FTA/LDC **`PT`（第 2 欄）**、確實不諳避罰 **`8`**、三角貿易順序「**先進口放行、後出口放行**」？\n"},{"id":"03_通關實務概要_04_海運快遞貨物通關辦法","cat":"通關實務概要","title":"海運快遞貨物通關辦法","md":"# 海運快遞貨物通關辦法【完整精讀版】\n\n\u003e **整合來源**：劉兆富講師《115 海空運快遞講義》＋《海運快遞貨物通關辦法》（**民國 115 年 2 月 23 日最新修正全文**）＋113–115 年歷屆試題  \n\u003e **考試權重**：海／空運快遞近年幾乎是**每年必出 1 題申論（20 分）＋ 8–10 題選擇**！**115 年申論第 3 題**直接考海快 §12（20 分），**115 年選擇 Q32–Q36** 連出 5 題海快！\n\n---\n\n## 一、不得於海運快遞專區通關之貨物與專區設立（§3–§9）\n\n### 1. 不得在海運快遞專區辦理通關之 3 大類（§3Ⅱ）\n1. 屬關稅法規定**不得進口之物品**、**管制品**、**侵害智慧財產權物品**、**進口生鮮農漁畜產品**、**活動植物**、**保育類野生動植物及其產製品**。\n   \u003e ⚠️ **海快 vs. 空快微妙字眼差異**：海快 §3 寫「**進口**生鮮農漁畜產品」，空快 §6 寫「生鮮農漁畜產品」（含進出口）。\n2. **每件（袋）毛重逾 70 公斤**之貨物。\n3. **以非密閉式貨櫃**裝運進口之貨物（⚠️ 海快專屬條款！必須為**密閉式貨櫃**）。\n- **全面 X 光儀檢（§3Ⅲ）**：進出口海運快遞貨物**均應通過 X 光儀器檢查**（性質不適照射 X 光經海關核准者除外）。\n\n### 2. 海運快遞專區設立、總量公告與拆櫃時限（§4、§7、§8、§8-1、§13）\n| 項目 | 現行法規規定（含 113–115 年修法重點） | 必考數字 |\n|---|---|---|\n| **設置地點（§4）** | 國際通商港口之管制區內，封閉型場所（設圍牆等實體隔離＋警衛哨所＋10 大分區含緝毒犬／檢疫犬勤務區） | 須設於國際商港管制區內 |\n| **總量管制公告（§7Ⅰ，113 修法！）** | 專區所在地海關應於**每年 10 月底前**公告次年度得受理申請設立或擴增貨物通關線之港區、線數、申請條件及申請期間 | **每年 10 月底前**公告 |\n| **資本淨額（§7Ⅱ）** | 專區業者資本淨額應在 **新臺幣 5,000 萬元以上**（不足者應提供擔保） | **5,000 萬元** |\n| **審查與建置期限（§7Ⅴ、§8）** | 審查小組審查：**60 日內**（得延長 **30 日**）；審查通過後建置期限：通知送達翌日起 **6 個月內**（得展延 **3 個月**） | 審 60+30 日；建 **6 個月＋展延 3 個月** |\n| **拆櫃進倉期限（§8-1）** | 裝運海運快遞貨物之貨櫃，應於進儲貨櫃暫存區翌日起 **3 個工作日內**拆櫃進倉 | **3 個工作日** |\n| **報關時限（§17Ⅰ、115 Q35）** | 運輸業傳輸進口艙單後始得傳輸進口報單，**至遲應於「拆櫃完畢之翌日起算 1 日內」完成報單申報**！ | **1 日內**（115 Q35 正解！） |\n| **辦公時間（§13）** | 專區所在地海關**辦公時間內**辦理（不同於空運快遞原則 24 小時！） | 海快＝**辦公時間內** |\n\n---\n\n## 二、快遞貨物 7 大分類與應以「一般報單」通關 10 款（§11、§12）\n\n```mermaid\n%% diagram:prac-express\nflowchart TD\n    G1[\"第一關：能進快遞專區嗎？(§3/§6)\u003cbr/\u003e禁運品/生鮮/智財/保育 / 毛重\u003e70kg / 海運非密閉櫃\"] --\u003e|任一符合| NO1[\"❌ 不得於專區通關！\"]\n    G1 --\u003e|全未觸犯| G2[\"第二關：能用簡易申報單嗎？(§12 十款)\u003cbr/\u003e逾5萬 / 涉輸出入規定 / 沖退保稅 / 復運 / 減免稅(非個人貨樣≤3000除外)\u003cbr/\u003e非G1G5F5 / 貨物奢稅 / 反傾銷 / 救濟防衛 / 配額\"]\n    G2 --\u003e|任一符合| GEN[\"📋 須改用「一般進出口報單」(G1/G5/F5)\"]\n    G2 --\u003e|皆未觸犯| SIM[\"⚡ 可用「簡易申報單」(X1-X3 / X6-X7)\"]\n```\n\n### 1. 海運快遞貨物 7 大分類與報單代碼（§11Ⅱ）\n| 類別 | 金額標準 | 報單類型 |\n|---|---|---|\n| **進口快遞文件（`X1`）** | 無商業價值文件 | 簡易申報單（**可併袋**） |\n| **進口低價免稅（`X2`）** | **完稅價格（CIF）NT$2,000 以下** | 簡易申報單（**不可併袋**） |\n| **進口低價應稅（`X3`）** | **完稅價格 NT$2,001 ～ NT$50,000** | 簡易申報單（**不可併袋**） |\n| **進口高價（`X4`）** | **完稅價格超過 NT$50,000** | **一般進口報單（`G1` 等）**（115 Q33：查驗實到超過 5 萬元改一般報單！） |\n| **出口快遞文件（`X6`）** | 文件類 | 簡易申報單（**可併袋**） |\n| **出口低價（`X7`）** | **離岸價格（FOB）NT$50,000 以下** | 簡易申報單（**不可併袋**） |\n| **出口高價（`X8`）** | **離岸價格超過 NT$50,000** | **一般出口報單（`G5` 等）** |\n\n### 2. 應以「一般進出口報單」辦理通關之 10 款情形（§12Ⅰ）【🔥 115 申論第 3 題，20 分！】\n\u003e **記憶口訣：「高、簽、退、復、減、非G1G5F5、貨奢、平反報、救防、配額」**（共 **10 款**，與空運快遞 §12 幾乎完全一致！）\n\n1. **高價快遞貨物**：進口完稅價格超過 NT$50,000（`X4`）或出口離岸價格超過 NT$50,000（`X8`）。\n2. **涉及輸出入規定**：但有特殊情形經海關公告者，得以簡易申報單辦理。（📌 115 Q40：網路購買醫療器材 2.5 萬元涉輸入規定 → 須用 **`G1`** 一般報單！）\n3. **需申請沖退稅或保稅用報單副本**。\n4. **復運進出口案件需調閱原出、進口報單**。\n5. **依關稅法、相關法規及稅則增註規定減免稅貨物**：\n   - ⚠️ **必考但書**：以**非個人名義**進口屬關稅法 §49Ⅰ⑨ **免稅貨樣**，整份報單完稅價格在 **新臺幣 3,000 元以下**者，**得以簡易申報單辦理通關**！（注意是 3,000 元，非 2,000 元！）\n6. **適用進口 `G1`、出口 `G5` 或 `F5`（自由港區出口）以外之報單類別貨物**。\n7. **依貨物稅條例或特種貨物及勞務稅（奢侈稅）條例規定應課稅貨物**。\n8. **財政部公告應課徵平衡稅、反傾銷稅或報復關稅貨物**。\n9. **經濟部依貿易法採取進口救濟或屬財政部公告實施特別防衛措施（SSG）貨物**。\n10. **屬關稅配額貨物**。\n\n---\n\n## 三、併單／併袋限制、嚴禁拆分、實名委任與無法委任退運（§14–§20）\n\n### 1. 合併申報 vs. 併袋通關（§14、115 Q32 必考！）\n- **合併申報（同報單號）**：辦理文件類或低價貨物簡易申報時，**得**將不同納稅義務人／輸出人之**同一主號且同類別**貨物，以同一簡易申報單號碼合併申報（海關將各收貨人列為納稅義務人核發稅單；填報實名認證行動門號者，免報身分證／居留證／護照號碼）。\n- **併袋通關（實體裝同一袋）**：**海運快遞除文件類（`X1` 及 `X6`）外，一律「不得併袋通關」**！（115 Q32 正解：**僅 `X1` 及 `X6` 可併袋**！）\n\n### 2. 「三同」同批貨物嚴禁分開申報（§15、§30、115 Q36 必考！）\n- **同批貨物定義（三同）**：**同一發貨人**、以**同一航次運輸工具**、發送給**同一收貨人**之快遞貨物。\n- **海運快遞鐵律（§15）**：**無但書！一律嚴禁分開申報！**（⚠️ 對照空快 §14：空快有「合計未逾 2,000 元或主動申報繳稅」之但書，**海快沒有！**）\n- **違反效果（§30、115 Q36 正解！）**：除處罰鍰（6,000–30,000 元）外，海關應**合併計算完稅價格**課徵進口稅；如涉申報不實須依緝私條例處罰者，**應以合併計算之漏稅額或貨價為基準裁處罰鍰**！\n\n### 3. 報關委任三方式、115/03/01 新制與無法委任退運（§18、§18-1、115 Q34）\n- **委任 3 方式（§18Ⅰ）**：\n  1. **書面個案或長期委任**：採書面「個案」委任者，應由報關業者於連線申報時先予「**具結**」報關，後依海關要求配合提示委任書（115 Q34 正解！放行前得以簽認影本先行代替原本）。\n  2. 經由**關港貿單一窗口**辦理線上個案或長期委任。\n  3. 經由通關網路業者建置之**實名認證平臺（EZ WAY 易利委）**辦理線上個案委任。\n- **🔥 115 年 2 月 23 日修正（115 年 3 月 1 日施行）§18Ⅱ**：未依前項各款方式之一完成報關委任，並於海關通關資訊系統記錄有案者，**海關得不受理報關**！\n- **報關業兜底違章責任（§18Ⅳ）**：涉虛報或違反緝私條例，如報關業者無法證明受委任、亦無法證明確有實際貨主者，**由報關業者負違章責任**。\n- **無法委任更正退運（§18-1）**：進口簡易申報貨物未放行出倉前，確認無法完成委任，且無違反緝私條例（或得免罰）及無移送他機關裁罰情事者 → 得於貨物**進倉或報關之翌日起 7 個工作日內**，由海運快遞業者申請更正為納稅義務人後退運出口。\n\n---\n\n## 四、罰則體系與 112 年重大修法「累進停業／廢照條款」（§24–§31-2）\n\n| 處罰層級 | 法條依據 | 處罰內容與關鍵門檻 |\n|---|---|---|\n| **一般違規罰則** | §24–§31（依關稅法 §87） | 警告或處 **NT$6,000 ～ NT$30,000** 罰鍰，並命限期改正；屆期未改正**按次處罰**；處罰 **3 次**仍未改正或情節重大 → 停業 6 個月以下或廢止登記 |\n| **同一年度累計停業** | **§31-1Ⅰ（112 年修法！）** | 同一年度內裁處罰鍰金額**合計達 NT$20 萬元** → 屬違規情節重大，**應停止 6 個月以下**海運快遞通關業務 |\n| **同一年度累計廢照** | **§31-1Ⅰ（112 年修法！）** | 同一年度內裁處罰鍰金額**合計達 NT$50 萬元** → **應廢止其登記** |\n| **廢止登記後禁業期** | **§31-2（112 年修法！）** | 自廢止之日起 **5 年內**不得以同一名義再行申請登記（**同一名義包含所屬同一公司及其分公司之名稱**！） |\n\n---\n\n## 五、考前極速自檢清單\n- [ ] 背出 §12 應以一般報單通關 **10 款**（含第 5 款但書：**非個人免稅貨樣 ≦ 3,000 元**可簡易）？\n- [ ] 背出海快關鍵數字：**毛重 70 kg、密閉櫃、資本淨額 5,000 萬、10 月底前公告、建置 6+3 月、拆櫃 3 工作日、申報 1 日內、無法委任 7 工作日退運**？\n- [ ] 牢記：**僅 `X1`、`X6` 可併袋**；**三同嚴禁拆分（海快無但書）**；書面個案委任採**先具結後提示**？\n- [ ] 背熟 112 年罰則：**6 千～3 萬、年累 20 萬停業 6 月以下、50 萬廢照、5 年禁重申（含分公司）**？\n"},{"id":"03_通關實務概要_05_空運快遞貨物通關辦法","cat":"通關實務概要","title":"空運快遞貨物通關辦法","md":"# 空運快遞貨物通關辦法【完整精讀版】\n\n\u003e **整合來源**：劉兆富講師《115 海空運快遞講義》＋《空運快遞貨物通關辦法》（**民國 115 年 2 月 23 日最新修正全文**）＋113–115 年歷屆試題  \n\u003e **考試關鍵**：空運與海運快遞條文高度相似，但考官**最愛考兩者的微妙差異**（例如：115 Q38–Q40 連考 3 題，其中 Q39 專門拿「專倉廢止 1 年 vs 廢止登記 5 年」設局！）。本篇直接整理**空運獨有規定＋海空快遞終極比較表**！\n\n---\n\n## 一、113–115 年最新修法重點與空運獨有制度\n\n### 1. 重大修法動態（刷 112 年以前舊題務必避雷！）\n- **🔥 113 年 8 月 8 日修正**：\n  - **全面刪除「空運快遞專差（快遞專差）」制度**（原 §7、§8、§13、§24、§27 均刪除！）。若刷舊題看到「專差攜帶 60 件／32 公斤／2 萬美元」皆為**已刪除舊制**，現行法已無快遞專差！\n  - 新增 **§3-1、§3-2**：明定空運快遞專區／航空貨物轉運中心設立與變更審查（**30 日＋延長 30 日**，建置 **6 個月＋展延 3 個月**）。\n- **🔥 115 年 2 月 23 日修正（115 年 3 月 1 日施行）**：\n  - 修正 **§17Ⅱ**：未完成報關委任並於海關通關資訊系統記錄有案者，**海關得不受理報關**（與海快 §18Ⅱ 同步）。\n\n### 2. 空運獨有「專倉通關資格」與廢止禁業期（§8-1、§8-2）【🔥 115 Q39 大陷阱！】\n| 項目 | 法條規定（§8-1、§8-2） | 超級對照陷阱（115 Q39！） |\n|---|---|---|\n| **專倉通關 3 要件（§8-1）** | 快遞業者與專區貨棧業者檢具管理計畫書聯名申請，須同時符合：\u003cbr\u003e1. 同時具備**航空運輸業或專用機隊**、**承攬業**及**報關業**三種資格。\u003cbr\u003e2. 登記滿 **3 年**以上，且最近 3 年內無私運紀錄，亦未經海關依本辦法裁處罰鍰合計達 **NT$30 萬元**。\u003cbr\u003e3. 承攬之貨物未依 §12-1Ⅱ 但書申請併袋通關。 | 如 DHL / FedEx / UPS 等自有機隊大型整合商 |\n| **廢止「專倉通關資格」禁申期（§8-2）** | 自廢止之日起 **「1 年內」**不得以同一名義（含公司及分公司）再行申請專倉通關 | ⚠️ **115 Q39 故意把 1 年寫成 5 年、把廢止登記 5 年寫成 1 年**，兩個互換設局！ |\n| **廢止「空運快遞業者登記」禁申期（§28-2）** | 自廢止之日起 **「5 年內」**不得以同一名義（含公司及分公司）再行申請登記 | 廢專倉＝**1 年**；廢業者登記＝**5 年**！ |\n\n---\n\n## 二、空運快遞通關實務重點（§6、§9–§28-2）\n\n### 1. 不得於空運專區／轉運中心通關之貨物（§6、115 Q38）\n1. 屬關稅法規定不得進口之物品、管制品、侵害智慧財產權物品、**生鮮農漁畜產品**（115 Q38 正解！）、活動植物、保育類野生動植物及其產製品。\n2. 每件（袋）**毛重逾 70 公斤**之貨物（換言之，毛重 60 公斤**可以**通關！）。\n\u003e ⚠️ **115 Q38 常見混淆**：**「需課徵反傾銷稅的中國大陸製毛巾」**只是**不得使用簡易申報單**（須改用一般報單 `G1`），**但仍可**在空運快遞專區辦理通關！（切勿把「§6 不得在專區通關」與「§12 不得用簡易申報單」搞混！）\n\n### 2. 發票黏貼、整盤進倉、併袋與拆袋（§10、§11Ⅲ、§12-1、§12-2）\n- **免貼發票特例（§10Ⅱ）**：空運快遞業者於現場備有**發票儲存系統設備**供海關查詢或列印者，**得免黏貼發票於貨物上**（海快無此免貼條款）。\n- **整盤（櫃）進倉（§11Ⅲ）**：同一貨主之出口快遞貨物得整盤（櫃）進倉；但應驗／抽驗貨物仍須拆盤（櫃）供查驗。\n- **合併申報與併袋通關（§12-1、§12-2）**：\n  - **合併申報**：得將不同納稅人／輸出人之同一主號且同類別貨物，以同一簡易申報單號碼合併申報（115 Q39 正解！）。\n  - **併袋限制（111/04/01 起收緊）**：除**進口文件類（`X1`）及出口貨物（`X6`、`X7`）**外，**進口貨物原則不得併袋通關**（僅情況特殊經海關公告者例外，例如經核准之特定電商／少件例外）。\n  - **拆袋（§12-2）**：合法併袋貨物因部分無法通過收單檢核，得申請海關核准後**派員監視拆袋**。\n\n### 3. 「三同」分開申報之但書（§14）與罰則特例（§23、§26–§28-2）\n- **三同定義（§14Ⅱ）**：同一發貨人、同一航（班）次、發送給同一收貨人。\n- **空快獨有但書（§14Ⅰ）**：原則不得分開申報；**但完稅價格合計未超過免稅限額（NT$2,000），或雖超過限額而主動申報繳納進口稅費者，不在此限**（海快 §15 無此但書！）。\n- **報關業兜底責任（§17Ⅳ、115 Q37）**：代理空運快遞報關涉虛報或違反緝私條例，無法證明受委任亦無法證明確有實際貨主 → 由 **報關業者** 負違章責任（115 Q37 正解！）。\n- **罰鍰細節注意（§23 vs §23-1～§28）**：\n  - **專區或轉運中心經營業者**違規（§23）：警告或處 **NT$20,000 ～ NT$30,000** 罰鍰！（下限是 2 萬元，非 6 千元！）\n  - **空運快遞業者**違規（§23-1、§25、§26、§28）：處 **NT$6,000 ～ NT$30,000**（⚠️ 注意 §26Ⅰ 非文件誤報文件類、§28Ⅰ 違反禁分開申報，**無「警告」選項，直接罰鍰**！）。\n  - **同一年度累進處分（§28-1、§28-2）**：年累計達 **20 萬元** → 停業 6 個月以下；年累計達 **50 萬元** → 廢止登記（**5 年內**不得以同一名義〔含分公司〕再申請登記）。\n\n---\n\n## 三、海運快遞 vs. 空運快遞「必考差異」終極對照表\n\n| 比較項目 | **海運快遞貨物通關辦法** | **空運快遞貨物通關辦法** |\n|---|---|---|\n| **通關場所** | 海運快遞貨物專區（國際商港管制區內） | 空運快遞貨物專區、航空貨物轉運中心 |\n| **海關辦公時間** | 所在地海關**辦公時間內**（§13） | **24 小時**（夜間禁航機場配合調整，§9） |\n| **專區資本額／總量** | 資本淨額 **5,000 萬元以上**；**每年 10 月底前**公告次年度線數（§7） | 無明定 5,000 萬資本額與每年 10 月底總量公告 |\n| **設立審查／建置** | 審查 **60 日（+30 日）**；建置 **6 月（+3 月）** | 審查 **30 日（+30 日）**；建置 **6 月（+3 月）** |\n| **專倉通關制度** | 無 | 有（§8-1：機隊＋承攬＋報關、3 年無私運＆罰鍰 \u003c 30 萬；廢專倉 **1 年**禁申） |\n| **禁運專區條件** | 禁運品（寫「進口」生鮮）＋毛重 \u003e 70 kg ＋ **非密閉式貨櫃** | 禁運品（含進出口生鮮）＋毛重 \u003e 70 kg（無密閉櫃條款） |\n| **發票黏貼** | 須黏貼發票或價值聲明（無免貼系統條款） | 現場備有**發票儲存系統設備**者得免黏貼（§10Ⅱ） |\n| **報關／拆櫃期限** | 進儲貨櫃暫存區翌日起 **3 工作日**拆櫃；拆櫃完畢翌日起 **1 日內**完成報關 | 得於進口前預先申報（無 3 工作日拆櫃／1 日報關條文） |\n| **應以一般報單（§12）** | 10 款完全對稱（非個人免稅貨樣 **≦ 3,000 元**可簡易） | 10 款完全對稱（非個人免稅貨樣 **≦ 3,000 元**可簡易） |\n| **併袋通關許可** | 僅 **文件類（`X1`、`X6`）** 可併袋，其餘均不可（§14Ⅴ） | **進口文件類（`X1`）及出口貨物（`X6`、`X7`）** 可併袋；進口貨物原則不可（海關公告例外，§12-1Ⅱ） |\n| **三同分開申報** | **嚴禁拆分（無但書！）**（§15） | 原則禁止，**但合計未逾 2,000 元免稅額或主動申報繳稅者除外**（§14） |\n| **無法委任退運** | 進倉或報關翌日起 **7 個工作日內**更正納稅人退運（§18-1） | 進倉或報關翌日起 **7 個工作日內**更正納稅人退運（§17-1） |\n| **專區業者罰鍰下限** | NT$6,000 ～ NT$30,000 | **NT$20,000 ～ NT$30,000**（§23！） |\n| **年度累計停業／廢照** | **20 萬停業 ≦ 6 月／50 萬廢照／5 年禁重申（含分公司）** | **20 萬停業 ≦ 6 月／50 萬廢照／5 年禁重申（含分公司）** |\n\n---\n\n## 四、考前極速自檢清單\n- [ ] 絕不再混淆「**不得於專區通關（§6：生鮮蔬果、\u003e70kg）**」與「**不得簡易申報（§12：醫療器材涉輸入規定、反傾銷稅、\u003e5 萬）**」？\n- [ ] 牢記空快 **1 年 vs 5 年**：廢止**專倉通關資格＝1 年內**禁重申；廢止**快遞業者登記＝5 年內**禁重申？\n- [ ] 牢記海空快 **5 大差異**：辦公時間（辦公 vs 24h）、審查期（60 vs 30 日）、併袋（X1/X6 vs X1/出口）、三同但書（海無 vs 空有）、專區業者罰鍰下限（6 千 vs 2 萬）？\n"},{"id":"03_通關實務概要_06_運輸工具旅客規費與保稅區實務","cat":"通關實務概要","title":"運輸工具旅客規費與保稅區實務","md":"# 運輸工具、旅客免稅、海關規費與保稅五區實務【完整精讀版】\n\n\u003e **整合來源**：任冠儀講師《115 通關實務講 01（運輸工具與轉運）、講 03（旅客行李與洗錢防制）、講 04（海關徵收規費規則）、講 06（保稅區實務）》＋113–115 年最新修法（含 **113/07 旅客免稅 3.5 萬、114/01 酒 1.5L、鍵輸費 350 元新制**）  \n\u003e **為什麼必讀這份補充精讀版？**：這 4 個模組雖非單一獨立辦法名稱，但每年在《通關實務概要》與《關務法規概要》合計出題 **10–15 題選擇＋偶發申論**，且近年修法極密集（旅客免稅額、酒量、鍵輸費全部剛調高！），讀熟這篇能輕鬆多拿 15 分以上！\n\n---\n\n## 一、運輸工具進出口通關、艙單、結關與轉口（講 01）\n\n### 1. 進口艙單預報時限與更正期限\n| 運輸工具 | 進口艙單「預報」時限 | 連線更正期限 | 非連線更正期限 |\n|---|---|---|---|\n| **海運（船舶）** | 船舶抵達我國港口前 **5 小時**（以船舶**繫泊**時間為準） | 傳輸後 **72 小時**內（未依限預報者縮減為 **48 小時**內） | **24 小時**內 |\n| **空運（飛機）** | 航程 \u003e 4 小時者：抵達前 **2 小時**；航程 ≦ 4 小時者：起飛前（或抵達前依規定） | 連線傳輸後 **72 小時**（未預報 **48 小時**） | **24 小時**內 |\n\n### 2. 出口清表、結關與短溢卸報告\n- **出口裝船清表**：應於運輸工具**結關前**向海關申報；**出口貨櫃清單**得於結關後 **48 小時內**補送。\n- **結關與開航**：運輸工具辦妥結關手續後，應於 **48 小時內**開航（逾期須重辦或展延）。\n- **免辦結關特例**：船舶／飛機進港（場）後 **24 小時內**開航，且**未上下旅客及裝卸貨物**者，**免辦結關**。\n- **短卸／溢卸報告提出期限（必背！）**：\n  | 貨物型態 | 提出短／溢卸報告期限 |\n  |---|---|\n  | **整裝貨櫃（CY）** | 卸船完畢翌日起 **1 日內** |\n  | **併裝貨櫃（CFS）** | 拆櫃完畢翌日起 **3 日內** |\n  | **非櫃裝貨物（散雜貨）** | 卸船完畢翌日起 **7 日內** |\n  | **快遞貨物** | 進倉（或拆櫃）完畢翌日起 **1 日內** |\n- **轉口貨物期限**：轉口貨物應於進儲翌日起 **60 日內**轉運出口；有正當理由得申請延長 **1 次**，以 **30 日**為限（共 90 日）。\n\n---\n\n## 二、入境旅客行李免稅規定與洗錢防制申報門檻（講 03）【🔥 113–114 最新修法！】\n\n### 1. 旅客行李報關與免稅額度（含最新調高數字！）\n- **不隨身行李**：**一律辦理一般進口報關**（且須於入境時先申報，並於入境翌日起 **6 個月內**運抵進口始享免稅額度）。\n- **隨身非自用／非限制貨物**：出境或入境攜帶非自用、非限制輸出入貨物，價格在 **US$20,000 以下**得免辦一般報關（§16 等規定）。\n- **🔥 入境旅客自用行李免稅額與菸酒免稅額（113–114 年雙雙調高！）**：\n  | 項目 | **現行最新規定（116 年必考！）** | 舊制對照（刷舊題留意） |\n  |---|---|---|\n  | **一般自用行李免稅額** | **新臺幣 35,000 元**（113 年 7 月起調高！） | 舊制 20,000 元 |\n  | **酒類免稅量（滿 18 歲）** | **1.5 公升**（不限瓶數，114 年 1 月起調高！） | 舊制 1 公升 |\n  | **捲菸免稅量（滿 20 歲）** | **捲菸 200 支**（或雪茄 25 支、菸絲 1 磅） | 同左（注意年齡：**酒 18 歲、菸 20 歲**！） |\n  | **超額未申報菸酒罰則** | 依《菸酒管理法》§45Ⅳ：**沒入**超額部分，並按每條捲菸／每公升酒處 **NT$500 ～ NT$5,000** 罰鍰（200 支捲菸罰 1,000 元等基準） | 依菸酒管理法處罰，非僅補稅 |\n\n### 2. 入出境洗錢防制申報門檻與「未申報法律效果」6 大表（超級必考！）\n\n```mermaid\n%% diagram:prac-aml\nflowchart LR\n    AML[\"入出境洗錢防制申報\"] --\u003e CASH[\"🔴 現金類：未申報 → 超額「沒入」\u003cbr/\u003e• 新臺幣 \u003e NT$10 萬 (限帶)\u003cbr/\u003e• 人民幣 \u003e RMB 2 萬 (超額封存)\u003cbr/\u003e• 外幣 \u003e 等值 US$1 萬 (申報不限)\"]\n    AML --\u003e ASSET[\"🟠 非現金類：未申報 → 處「罰鍰」(不沒入)\u003cbr/\u003e• 無記名有價證券 \u003e US$1 萬\u003cbr/\u003e• 黃金 \u003e US$2 萬\u003cbr/\u003e• 超自用鑽石寶石白金 \u003e NT$50 萬\"]\n```\n\u003e ⚠️ **記憶鐵律**：**現金類（臺幣／人民幣／外幣）＝沒入**；**非現金資產類（有價證券／黃金／鑽石寶石白金）＝處罰鍰（不沒入！）**\n\n| 物品類別 | 申報門檻（每人每次） | 未申報／申報不實之處分 | 特殊備註 |\n|---|---|---|---|\n| **新臺幣現鈔** | **超過 NT$100,000** | 超額部分 **沒入** | 即使申報亦**限帶 10 萬元**（超額須先經央行許可，未許可者封存退運） |\n| **人民幣現鈔** | **超過 RMB 20,000** | 超額部分 **沒入** | 超過 2 萬經申報者由海關**封存**退運 |\n| **外幣現鈔（含港幣、澳門幣）** | **等值超過 US$10,000** | 超額部分 **沒入** | 經申報者**不限攜帶金額** |\n| **無記名有價證券**（旅行支票、匯票、本票等） | **等值超過 US$10,000** | 處相當於未申報金額之 **罰鍰**（不沒入） | 僅指「無記名」票據 |\n| **黃金** | **等值超過 US$20,000** | 處相當於未申報價額之 **罰鍰**（不沒入） | 逾 2 萬美元且須另辦經濟部國貿署輸入／輸出許可 |\n| **超越自用目的之鑽石、寶石及白金** | **總價值超過 NT$500,000** | 處相當於未申報價額之 **罰鍰**（不沒入） | 限「超越自用目的」者 |\n\n---\n\n## 三、海關徵收規費規則完整收費表（講 04）【🔥 鍵輸費新舊制必看！】\n\n### 1. 各項規費標準總表\n| 規費項目 | 收費標準（新臺幣） | 必考細節與例外 |\n|---|---|---|\n| **特別驗貨費** | **1,300 元／份**（每份報單） | 例假日、夜間或海關核准於非指定地點查驗時徵收 |\n| **特別監視費** | • 船舶／飛機：**2,000 元／班（次）**\u003cbr\u003e• 貨櫃集散站／貨棧／保稅倉庫：**1,000 元／班**\u003cbr\u003e• 保稅運貨工具：**450 元／班** | 依不同對象分三級收費 |\n| **加封費** | • **一般封條**：**100 元／只**（業者自封 **50 元**）\u003cbr\u003e• **被動式電子封條**：**250 元／只**（業者自封 **200 元**） | ⚠️ **加封費不適用 §9 免徵及 §10 減半規定！**\u003cbr\u003e有 4 款法定免徵加封費情形（如郵包、轉口海關自封特定案件等） |\n| **押運費** | • 同區（或短程）：**600 元**\u003cbr\u003e• 跨區 **\u003c 150 km**：**1,700 元**\u003cbr\u003e• 跨區 **150 ～ 250 km**：**3,700 元**\u003cbr\u003e• 跨區 **≧ 250 km**：**4,600 元** | 每次押運以 **3 輛車（或 3 櫃）** 為限 |\n| **鍵輸費（未連線書面遞單）** | • **報單**：現行 **350 元／份**（⚠️ 114 年以前舊題多考舊制 **200 元**！）\u003cbr\u003e• **艙單**：**200 元／份**\u003cbr\u003e• **其他（如申請書）**：**100 元／份** | 連線報關免徵；書面人工代鍵始徵收 |\n| **快速通關處理費** | 按財政部公告費率徵收，**每 6 個月檢討一次** | 適用於海／空運快遞貨物 |\n| **海關倉庫貯存費** | • **旅客行李**：存倉前 3 日免費，**第 4 日起 30 元／件／日**，上限為完稅價格 **20%**\u003cbr\u003e• **一般進出口貨物**：上限為完稅價格 **50%** | 旅客 20% vs 一般 50%！ |\n| **核發證照費** | 核發新照 **2,000 元**；補發或換發 **1,000 元** | 如報關業證照、保稅證照等 |\n\n### 2. 規費免徵（§9）、減半（§10）與繳納期限\n- **免徵特別驗貨費／特別監視費／押運費（§9）**：① 旅客行李 ② 軍事機關進出口物品 ③ **科技產業園區／科學園區／農業科技園區**出口郵包 ④ 緊急救難物資 ⑤ 總重 **≦ 20 公斤**之進口書報刊物／教育文化新聞影片。\n- **減半徵收（§10）**：進出口貨物離岸／完稅價格在 **US$5,000 以下**者，特別驗貨費、特別監視費、押運費**減半徵收**（⚠️ **加封費不適用減半！**）。\n- **繳納期限與分期**：海關核發規費證翌日起 **14 日內**繳納；應繳規費合計達 **NT$50 萬元以上**確有困難者，得申請分期繳納。\n\n---\n\n## 四、保稅五區與「物流中心 `D8` vs. `L1`」終極比較表（講 06）\n\n```mermaid\n%% diagram:prac-bonded\nflowchart LR\n    EXT[\"國外貨物\"] --\u003e|D8 (一般保倉無C1)| BW[\"保稅倉庫 (2千萬/5千萬)\u003cbr/\u003e存2年不延\"]\n    EXT --\u003e|L1(汽機車/未開放陸貨)\u003cbr/\u003eD8(洋菸酒/露天櫃)| LC[\"物流中心 (1.5億)\u003cbr/\u003e24h通關・存期原則不限\"]\n    EXT --\u003e|B6| BF[\"保稅工廠 (5千萬)\u003cbr/\u003e原料2年+延1年\"]\n    EXT --\u003e|F1| FTZ[\"自由貿易港區 (交通部)\u003cbr/\u003e六海一空・存期不限\"]\n    BW --\u003e|D7轉廠 / D2內銷 / D5出口| OUT[\"課稅區 / 國外\"]\n    BF --\u003e|B2廠對廠或進倉 / G2內銷 / B9成品出口| OUT\n    FTZ --\u003e|F2內銷 / F3區內 / F4國內 / F5出口| OUT\n```\n\n### 1. 我國五大保稅營運體制對照表\n| 項目 | **一般保稅倉庫** | **自用保稅倉庫** | **物流中心** | **保稅工廠** | **自由貿易港區** |\n|---|---|---|---|---|---|\n| **主管機關** | 財政部（海關） | 財政部（海關） | 財政部（海關） | 財政部（海關） | **交通部**（六海一空：基隆、臺北、蘇澳、臺中、安平、高雄港＋桃園航空自由港區） |\n| **最低實收資本額** | **2,000 萬元** | **5,000 萬元** | **1.5 億元** | 5,000 萬元（公司組織） | 依港區事業規定 |\n| **進儲外貨報單** | **`D8`**（僅 **C2 / C3**，無 C1！） | **`D8`**（可有 **C1**） | **`L1` 或 `D8`**（**24 小時**通關） | **`B6`** | **`F1`** |\n| **存儲期限** | **2 年**（不得延長，特定除外） | **2 年**（不得延長） | **原則不限**（⚠️ 但來自**課稅區貨物及洋菸酒**仍限 **2 年**！） | 原料 **2 年**，得申請延長 **1 年** | 原則不限 |\n| **常用出區／交易報單** | `D2`（內銷）、`D5`（出口）、`D7`（轉他倉／保廠） | 同左 | 同左 | `B2`（廠對廠／進倉）、`B8`（料復出）、`B9`（成品出口）、`G2`（內銷補稅） | `F2`（銷課稅區）、`F3`（區內交易）、`F4`（與他港區／課稅區）、`F5`（出口） |\n| **可從事作業** | 檢驗、測試、整理、分類、分割、裝配、**重裝**（不得製造加工） | 同左（專供自用） | 倉儲、轉運、配送及**重整及簡單加工** | **製造、加工、裝配**外銷產品 | 倉儲、物流、組裝、重整、包裝、修理、裝配、加工、製造、檢驗、測試、展覽、技術服務 |\n\n### 2. 物流中心進儲外貨：`L1` vs. `D8` 必考區分！\n- **必須申報 `L1`（轉運申請書進儲）**：**汽機車**、**未開放進口之大陸物品**（限以 `L1` 進儲物流中心，不得用 `D8`）。\n- **必須申報 `D8`（外貨進保稅倉報單）**：**洋菸酒**、**露天貨櫃（無法進倉存儲之大型／露天物品）**。\n\n---\n\n## 五、考前極速自檢清單\n- [ ] 背出最新旅客免稅額：**自用行李 NT$35,000（113/7）**、**酒 1.5 公升（114/1，18 歲）**、**捲菸 200 支（20 歲）**？\n- [ ] 背出洗錢防制 6 門檻：**臺幣 10 萬 / 人民幣 2 萬 / 外幣 1 萬美（沒入）** vs **有價證券 1 萬美 / 黃金 2 萬美 / 鑽石寶石白金 50 萬台幣（罰鍰不沒入）**？\n- [ ] 背出規費關鍵數字：特別驗貨 **1,300**、特別監視 **2,000 / 1,000 / 450**、加封 **100（50）/ 250（200）且不適用免徵減半**、押運 **600 / 1,700 / 3,700 / 4,600（限 3 車）**、鍵輸費 **現行報單 350（舊 200）**？\n- [ ] 背出保稅五區資本額（**2,000 萬 / 5,000 萬 / 1.5 億**）、自貿港區主管機關（**交通部**）、一般保倉 `D8` **無 C1**、物流中心 **`L1`（汽機車／未開放陸貨）vs `D8`（洋菸酒／露天櫃）**？\n"},{"id":"04_稅則概要_01_中華民國海關進口稅則","cat":"稅則概要","title":"中華民國海關進口稅則","md":"# 中華民國海關進口稅則【完整精讀版】\n\n\u003e **整合來源**：游欣翰講師《115 稅則概要 324 頁講義》＋陳玟茹講師《115 稅則總複習 183 頁》＋《進口貨物稅則預先審核實施辦法》（112/04/12 最新版）＋113–115 年專責報關人員考選部歷屆試題與標準答案  \n\u003e **考試權重**：本篇涵蓋《稅則概要》約 **75–80%** 配分（申論 50 分核心＋選擇 40 題之絕大多數）。  \n\u003e **實務背景備忘**：報關實務常靠系統關鍵字查稅號，但考試**禁止查表與使用計算器**，勝負關鍵在於「**總則一～七**」、「**解釋準則（GIR）1–6 適用邏輯**」、「**類註／章註排他條款**」及「**HS 2022 新增稅號**」。\n\n---\n\n## 一、稅則法律依據、顯然錯誤與稅則預先審核\n\n### 1. 短溢徵補退稅與「稅則號別顯然錯誤」三原則（關稅法 §65、施行細則 §54）\n- **補退稅期限（關 §65）**：海關短徵、溢徵或短退、溢退稅款者，應自**稅款完納（或核定退稅）之翌日起 1 年內**通知補繳或退還；**稅則號別顯然錯誤**適用之（114 選擇考點）。\n- **施行細則 §54「稅則號別顯然錯誤」認定三標準（必背！）**：\n  1. **明確貨名錯誤**：海關進口稅則之**節、目、款**之分類品目名稱已明確規範而適用錯誤者。\n  2. **明確註釋違反**：違反海關進口稅則有關**類註、章註、目註**之明確規定者。\n  3. **重複犯錯**：**同一納稅義務人**就相同貨物，經海關**稅則預先審核**或**行政救濟確定**（復查／訴願／行政訴訟確定）之稅則號別，再度申報錯誤者。\n  \u003e ⚠️ **超級考點陷阱（114 Q2）**：海關核發之「**稅則疑義解答函**」**非**屬第 3 款之顯然錯誤依據！僅限「預先審核」或「行政救濟確定」。\n\n### 2. 進口貨物稅則預先審核（關 §21＋實施辦法全條文）【115 申論第 2 題】\n| 項目 | 現行法規規定（112/04/12 修正） | 必考陷阱提示 |\n|---|---|---|\n| **申請人與時點（§2）** | 納稅義務人或其代理人，於**貨物進口前**申請（**不以初次進口者為限**，§6） | 進口「後」只能走稅則疑問解答或行政救濟，不能申請預審 |\n| **審核範圍（§3）** | 稅則號別（前 8 碼）**包括**輸出入貨品分類號列（9–10 碼，疑義時洽詢**經濟部國際貿易署**；輸入規定以國貿署訂定為準） | 含 10 碼號列，非僅前 8 碼 |\n| **遞件對象與程序（§4）** | 依海關規定格式填具申請書（**一份以申請單項貨物為限**），檢附原廠型錄、說明書或樣品，向**各關**申請 → 經**財政部關務署覆核**各關歸列意見 → 由**各關**函復 | 遞件給「各關」，由「關務署」覆核，再由「各關」函復 |\n| **應填資料（§4Ⅱ）** | 貨品名稱、生產國別、型號、規格、成分、材質、製程、主要功能、特性、用途、一次或分批進口及其他相關資料 | 申論題必列至少 6–8 項具體資料 |\n| **補件期限（§5）** | 海關書面通知送達之翌日起 **10 日內**補件；有正當理由得申請延長 **1 次**，最長不逾 **20 日** | 10 日＋延長 20 日（非 15/30 日） |\n| **不予預先審核 5 款（§6）** | ① 未依限補件或補件不全 ② **假設性或仍在設計中之虛擬性貨物** ③ 依關 §13Ⅰ（事後稽核）、§17Ⅴ（補稅/更正）、§18Ⅰ/Ⅱ（押款放行查核）處理中之**相同或類似貨物** ④ 因稅則爭議進行**行政救濟程序中**之相同或類似貨物 ⑤ **廢料**或其他經海關認定不適合預先審核之貨物 | 115 申論二核心必背！特別記住「虛擬性貨物」與「廢料」 |\n| **答復期限（§7）** | 收件或補件完成之翌日起 **30 日內**；必要時得延長 1 次，最長 **30 日**；須洽詢國際／國內機構或專家意見者，**120 日內**答復（115 Q28 必考！） | 30 日 (+30 日)；洽詢專家 **120 日** |\n| **不服之救濟（§8）** | 貨物**進口前**向**財政部關務署**申請**覆審**（30 日＋得延長 30 日）。不服覆審結果者，須俟貨物**進口並經進口地海關核定稅則號別後**，始得依關稅法申請**復查**等行政救濟 | 進口前＝「**覆審**」（向關務署）；進口後核定＝「**復查**」（向原處分海關） |\n| **變更與信賴保護（§9）** | 海關變更原預審稅則時應敘明理由書面通知；申請人舉證已訂約並進行交易且將致損失者，得申請延長原稅則適用，最長 **90 日**。惟涉及**輸入規定**者，仍依進口時規定辦理 | 稅率可展延 **90 日**；輸入規定**不可**展延 |\n| **通關效力（§10）** | C2／C3 須檢附答復函影本；C1 必要時補送。實到貨物相同者海關**應按預審號別核定**（提供錯誤／不實資料者除外） | 對海關具拘束力（非僅供參考） |\n\n---\n\n## 二、海關進口稅則總則（一～七）必背架構\n\n\u003e 💡 **陳玟茹老師總則記憶口訣**：「**一依據、二稅率、三增註、四配額、五行李郵包 5%、六最低、七新臺幣**」\n\n### 1. 總則一（法律依據與解釋準則效力）\n- 本稅則依關稅法第 3 條規定訂定，並採用世界關務組織（WCO）《國際商品統一分類制度》（HS）之解釋準則作為歸類依據。\n\n### 2. 總則二 \u0026 總則二之一（三欄稅率結構）【115 申論第 1 題、114 Q3、113 Q23】\n| 稅率欄 | 適用對象 | 關鍵實務與最新變動（113–115 年考點） |\n|---|---|---|\n| **第一欄** | **WTO 會員**、或與中華民國有**互惠待遇**之國家或地區之進口貨物 | 113 年 8 月 30 日起**東帝汶（TL）**正式成為 WTO 第 166 會員，適用第 1 欄 |\n| **第二欄** | 特定**低度開發（LDC）、開發中國家或地區**（經財政部會商有關機關報請**行政院核定**，並送**立法院查照**），或與我國簽署**自由貿易協定（FTA）／經濟合作協議**之國家或地區之**特定進口貨物**（115 Q27） | ① **FTA／協議夥伴代碼**：PA（巴拿馬）、GT（瓜地馬拉）、CN（中國大陸 ECFA 早收，須檢附產證）、NZ（紐西蘭）、SG（新加坡）、PY（巴拉圭）、SZ（史瓦帝尼）、BZ（貝里斯）、**MH（馬紹爾群島，113/08/14 生效）**\u003cbr\u003e② **總則二之一終止適用日（114 Q3、115 申論一）**：\u003cbr\u003e• 尼加拉瓜（**NI**）：**111/07/01** 起停用\u003cbr\u003e• 薩爾瓦多（**SV**）：**112/05/15** 起停用\u003cbr\u003e• 宏都拉斯（**HN**）：**112/12/06** 起停用\u003cbr\u003e③ **不丹**已自 LDC 畢業除名（113 Q23） |\n| **第三欄** | 不適用第一欄及第二欄之國家或地區（如北韓等非 WTO 且無互惠國，或無法證明原產地者） | 稅率最高 |\n| **競合原則** | 同一貨物**同時適用第一欄及第二欄**稅率時（例如自紐西蘭進口 0810.50.00 鮮奇異果，紐西蘭既是 WTO 會員又簽有臺紐經濟合作協定 ANZTEC） | **擇其較低者適用（從低課徵）**！如 115 申論一：第 1 欄 20%、第 2 欄免稅 → 適用第 2 欄「免稅」（報單附碼填 `PT` 並檢附原產地證明／聲明） |\n\n### 3. 總則三：增註 vs. 類註／章註比較【114 申論第 1 題、115 Q1、Q36】\n| 比較面向 | **類註／章註／目註** | **增註（Additional Notes）** |\n|---|---|---|\n| **法律來源** | WCO《HS 公約》國際統一規範 | 我國**國內獨有**立法，配合產業與關務政策訂定 |\n| **核心功能** | 決定貨品**歸類（分類範圍、定義、排除條款）**，依 GIR 1 具最優先拘束力 | 規定符合**特定條件／用途／主管機關證明**時之**優惠免稅或減稅**待遇（不改變 HS 6 碼大原則，而是賦予特定 8 碼優惠稅率） |\n| **稽徵代碼** | 無特定代碼 | 稽徵特別規定欄標示 **`N`**（適用增註之特定稅則號別） |\n| **實務條件** | 依貨物本身客觀性質判斷 | 多須取得**主管機關證明文件**（如經濟部、農業部、漁業署、衛福部）始得適用（115 Q1 飼料用米澱粉 `3505.10.51` 須經漁業主管機關證明；115 Q36 船用引擎零件免稅屬**第 84 章增註**） |\n\n- **必背高頻增註清單**：\n  - **Ch.22 增註 1**：專供工業用未變性酒精（經濟部證明）。\n  - **Ch.29 增註 4**：洗腎液、血液代用品（衛福部證明＋經濟部證明國內未製造）。\n  - **Ch.35 增註 1**：飼料用米澱粉 `3505.10.51`（漁業主管機關證明，115 Q1）。\n  - **Ch.70 增註 2**：半導體製程用石英玻璃製品 `7020.00.14` 稅率 1.2%。\n  - **Ch.84 增註 13 / Ch.85 增註 7 / Ch.90 增註 3**：製造業或技術服務業輸入供生產用機器設備，經經濟部證明**國內尚未製造**者免稅（**含資本租賃**方式輸入）。\n  - **Ch.84 增註（船用引擎）**：船用引擎製造工廠輸入零件、附件，經經濟部證明確供製造船用引擎者免稅（115 Q36）。\n\n### 4. 總則四：關稅配額（TRQ）16 項農產品【114 Q5】\n- 配額內適用低稅率，配額外適用高稅率（且可能觸發特別防衛措施 SSG，CR 代碼 `G`）。\n- **現行 16 項 WTO 關稅配額貨品（必背排除題！）**：\n  \u003e **食米、鹿茸、東方梨、香蕉、紅豆、液態乳、花生、大蒜、乾香菇、乾金針、椰子、檳榔、鳳梨、芒果、柚子、桂圓肉**  \n  \u003e ⚠️ **常見干擾選項**：**榴槤、蘋果、櫻桃、奇異果、茶葉**皆**非**關稅配額貨品！\n\n### 5. 總則五～七（零星物品、從低原則、幣別）\n- **總則五（零星物品 5%）**：旅客攜帶自用行李以外之零星物品，或郵包之零星物品，歸列 `9899.00.00`，統一按 **5%** 稅率課徵關稅；**但屬關稅配額貨物（總則四）除外**。\n- **總則六（稅率競合從低）**：進口貨物依本稅則及其他法令規定有兩種以上稅率可適用時，除另有規定外，**從低適用**。\n- **總則七**：本稅則所稱從量稅金額，均以**新臺幣**計算。\n\n---\n\n## 三、海關進口稅則解釋準則（GIR 1–6）深度解析與經典案例\n\n```mermaid\n%% diagram:tariff-gir\nflowchart TD\n    G1[\"GIR 1：節之貨名 + 類註/章註 (最優先)\"] --\u003e|無法單獨歸類| G2[\"GIR 2(a) 不完整/拆散貨品\u003cbr/\u003eGIR 2(b) 混合/組合物 → 導向 GIR 3\"]\n    G2 --\u003e G3A[\"GIR 3(a)：具體明確優先\u003cbr/\u003e(各僅述一部分則同等明確)\"]\n    G3A --\u003e|無法決定| G3B[\"GIR 3(b)：主要特徵原則\u003cbr/\u003e(含零售成套 3 要件)\"]\n    G3B --\u003e|無法決定| G3C[\"GIR 3(c)：從後原則\u003cbr/\u003e(取可考慮稅號位列最後者)\"]\n    G3C --\u003e|仍不適用| G4[\"GIR 4：最類似原則\"]\n    G5[\"旁支 GIR 5(a)/(b)：專用盒/重複使用鋼瓶\"] -.-\u003e G1\n    G6[\"歸目 GIR 6：同槓數比較・目註優先於章類註\"] -.-\u003e G1\n```\n\n\u003e **鐵律順序**：**準則一 → 準則二 → 準則三（甲→乙→丙）→ 準則四**，必須**依序適用**；**準則五**專管容器／包裝材料；**準則六**專管**目（Subheading）**之歸類。\n\n| 準則 | 核心規則與條文精義 | 講師經典＋113–115 年實戰案例 |\n|---|---|---|\n| **GIR 1** | 類、章、分章之標題僅供參考；歸類應以**節之貨名（稅則號別所列之貨品名稱）**及**有關之類註、章註**為準。 | ① **博士茶（國寶茶）**→ `1211.90.91` 藥用植物（不歸 1212，依 **GIR 1**，115 Q4）\u003cbr\u003e② **汽車機械工具套組（8202–8205）**→ `8206`（節名明列，直接依 **GIR 1**，115 Q2）\u003cbr\u003e③ **內燃機＋發電機組**→ `8502`（節名明列，115 Q5） |\n| **GIR 2(a)** | **不完整／未完成貨品**（已具有完整／完成貨品之主要特性者），或**未組合／拆散之貨品**，仍按完整貨品歸類。 | ① **PET 塑膠瓶胚**→ `3923.30` 塑膠瓶（已具螺紋瓶口主要特性）\u003cbr\u003e② **未切齒之齒輪毛胚**→ `8483.40` 齒輪（已接近成品形狀）\u003cbr\u003e③ **無把手玻璃鍋蓋**→ `7010.20`（或依用途歸鍋蓋）\u003cbr\u003e④ **拆散進口之電動機車**：須**同一報單**申報且具備車架＋動力／控制／輪圈等主要特性，始歸整車\u003cbr\u003e⑤ **雙系統無電熱元件熱水器**→ `8516.10` |\n| **GIR 2(b)** | 任何材料或物質之稅則號別，包含該材料與其他材料之**混合物或組合物**；超過一種材料之貨品，應依**準則三**歸類。 | 僅為「過渡橋樑」，引導進入 GIR 3。 |\n| **GIR 3(a)** | **具體明確優先於一般性說明**。但若各節僅述及混合物／零售成套貨品之一部分，視為**同等具體明確**，須改進 3(b)。 | ① **電動刮鬍刀**（8467 手提工具 vs 8509 家用電動用具 vs **8510** 刮鬍刀）→ **`8510`**（115 申論三(一)）\u003cbr\u003e② 汽車專用橡膠地墊 → 優先歸 `4016` 或車用配件視節名明確性而定 |\n| **GIR 3(b)** | **主要特徵原則**：混合物、不同材料組合物、**供零售之成套貨物**，按構成**主要特徵**之材料或組件分類。\u003cbr\u003e📌 **零售成套 3 要件**：① 至少 2 種表面可歸不同節貨品 ② 配合滿足**特定需要或執行特定活動** ③ **適合直接零售包裝**不需再包裝。 | ① **皮革掌心＋紡織手背手套** → 掌心、手指下側、拇指及食指（握持耐磨功能）為皮革，構成主要特徵，依 Ch.42 註四歸 **`4203`**（115 申論三(二)）\u003cbr\u003e② **Nutella 隨手杯**（巧克力醬＋餅乾棒）→ `1806.90.99`\u003cbr\u003e③ **附 USB 充電 LED 壁燈** → `9405.11`；**具燈光/無線充電/藍牙喇叭之木製咖啡桌** → `9403.60.90`（115 Q21）\u003cbr\u003e④ **數位智能筆** → `8471.60`；**測速雷射攝影機** → `9029.20`；**含框玻璃淋浴間** → `7020.00.99`\u003cbr\u003e❌ **非零售成套（須分別歸類）**：鴨肝＋培根罐頭組（非單一菜餚必備）、咖啡粉＋陶瓷杯碟、手錶＋皮夾禮盒（無共同特定活動） |\n| **GIR 3(c)** | **從後原則**：無法依 3(a) 或 3(b) 分類時，歸入可予考慮之稅則號別中**位列最後者**。【114 申論第 3 題、115 申論三(三)】 | ① **髮刷（9603）＋髮梳（9615）＋化粧鏡（7009）零售組合** → 皆為整理儀容工具、無單一主要特徵，取最後者 **`9615`**（115 申論三(三)）\u003cbr\u003e② **瓦斯—電聯合加熱家用烤箱**（7321 vs 8516）→ **`8516`**（115 Q40）\u003cbr\u003e③ **除霜清潔劑**→ `3820`；**GPS 運動錶**→ `9102`；**檯燈化粧鏡**→ `9405`；**防彈盾牌**→ `6914.90.90`；**海陸便當**（肉 1602＋魚 1604）→ `1604` |\n| **GIR 4** | **最類似原則**：無法依準則 1–3 分類者，歸入與其**最類似**之貨品號別（實務極少使用，如早期尚未列目之新型電子載具）。 | 僅當 GIR 1–3 全不適用時始得援用。 |\n| **GIR 5(a)** | **專用容器**（如照相機盒、樂器盒、槍套、項鍊盒）同時符合 **5 要件**（① 特殊造型密合 ② 適合長期使用 ③ 與所裝物品同時報運 ④ 正常一併出售 ⑤ **不具整體主要特徵**）→ **併入所裝物品歸類**。 | ❌ **例外（具主要特徵須拆開）**：茶葉裝於**純銀茶罐**、巧克力裝於**純金心型盒** → 分別歸類！ |\n| **GIR 5(b)** | **一般包裝材料與容器**：與貨物同時報運且屬正常包裝者併入貨物歸類；**但明顯適於重複使用者除外**。 | **已填裝 CO₂（2811）之可重複使用不銹鋼鋼瓶（7311）** → **分別歸列 2811 及 7311**（115 Q32 必考！若為一次性拋棄式小氣瓶則併入氣體） |\n| **GIR 6** | **目（Subheading）之歸類**【114 申論第 2 題】：比照準則 1–5 辦理，惟限於**同一位階（相同「－」槓數）之目**始得相互比較；且**目註優先於章註及類註**（除另有規定外）。 | ① **鉛水晶煙灰缸** → 先歸 7013 節，再於單槓目間比較，歸 `7013.91`（114 申論二）\u003cbr\u003e② **第 71 章「鉑」定義**：章註四(乙)稱「鉑」包含鉑、銥、鋨、鈀、銠、釕六元素；但目註二限定 7110.11/19 之「鉑」不含其他五元素 → 歸目時依**目註二優先**！ |\n\n---\n\n## 四、21 類 97 章高頻排他規則、比例門檻與 HS 2022 新增稅號總表\n\n\u003e 📌 本節濃縮游欣翰 324 頁＋陳玟茹 183 頁＋113–115 年考題中**最常考的跨章陷阱與排他註釋**，請搭配口訣反覆熟讀！\n\n### 1. 第 1–4 類：農漁牧與調製食品（第 1–24 章）\n- **第 3 章（水產）**：\n  - 燻製水產無論燻製前或燻製中是否烹煮均歸 Ch.3；**帶殼**經蒸或水煮之甲殼類歸 `0306`（去殼水煮歸 `1605`）。\n  - **HS 2022 新增 `0309`**：適於人類食用之魚、甲殼類、軟體動物粉、細粒及團粒。\n- **第 4 章（乳蛋蜜／昆蟲）**：\n  - **HS 2022 新增 `0410.10`**：食用**昆蟲**（蟋蟀粉等）。\n  - **乳清蛋白分離物陷阱（115 Q10）**：單純乳清蛋白濃縮物乾重 **\u003e 80%** 歸 `3502`（白蛋白），≦ 80% 歸 `0404`；但若**添加肌酸、香料**調配供沖泡之高蛋白營養補給品 → 歸 **`2106`**（未列名食物調製品）！\n- **第 7 / 11 / 19 / 20 章（馬鈴薯加工光譜 — 必考！）**：\n  - 生鮮 `0701` → 冷凍 `0710` → 單純脫水粉/細片 `1105` → 冷凍預炸薯條 `2004` → 未冷凍洋芋片／**馬鈴薯粉 65%＋麥芽糊精 15% 調製馬鈴薯泥粉** `2005`（115 Q19！）→ 以馬鈴薯粉為原料之調製麵團 `1901` → 膨發／烘烤馬鈴薯脆餅 `1905.90`。\n- **第 8 / 20 章（加味果實）**：\n  - 單純鮮／乾檳榔歸 Ch.8（0802.80）；**咖啡香料風味之加味檳榔**已超出 Ch.8 許可加工，歸 **第 20 章**（115 Q8）。\n- **第 9 / 12 章（香料與草本茶）**：\n  - Ch.9 **不同節**香料混合一律歸 `0910`（如咖哩粉）；**芥末粉**歸 `2103`（非 Ch.9）。\n  - **博士茶（國寶茶 Rooibos）**歸 `1211.90.91`（113 年關務署歸類令，115 Q4）。\n- **第 16 章（肉魚調製 \u003e 20% 規則）**：\n  - 凡含香腸、肉、雜碎、血、昆蟲、魚、甲殼類或軟體動物**合計重量超過 20%** 之食物調製品歸 Ch.16；**但明確排除**：`1902` 夾餡麵食（水餃、餛飩、義大利餃）、`2103` 調味醬、`2104` 湯類！\n- **第 17 / 35 章（糊精 10% 門檻）**：\n  - 還原糖含量（以乾重計）**≦ 10%** 之糊精歸 `3505`；**\u003e 10%** 歸 `1702`。\n- **第 18 章（可可霸王條款與 8 大排除）**：\n  - `1806` 涵蓋所有含可可食品，**但 Ch.18 註一排除 8 大類（即使含可可也不歸 1806）**：`0403` 優酪乳、`1901`（全脫脂可可 \u003c 40% 或乳品基底 \u003c 5%）、`1904` 膨化穀類（≦ 6% 可可）、`1905` 烘焙糕餅（未完全披覆巧克力）、`2105` **冰淇淋（不論是否含可可！如 115 Q18 馬卡龍夾巧克力冰淇淋月餅 → `2105`）**、`2202/2208` 飲料、`3003/3004` 藥品。\n- **第 22 章（酒精門檻）**：\n  - 酒精濃度 **≦ 0.5%** 之無酒精啤酒歸 `2202.91`；**\u003e 0.5%** 歸 `2203`。\n- **第 24 章（HS 2022 超級大熱門：`2404` 新興菸品！）**：\n  - `2404.11`：**加熱菸**（含菸葉以非燃燒方式吸入，115/2/1 輸入規定由 501 修正為 516，115 Q3）。\n  - `2404.12`：含尼古丁之**電子煙油**（輸入規定 `111` 管制輸入）。\n  - `2404.91` / `2404.92`：口服（口嚼錠）／皮膚吸收（尼古丁貼片）。\n  - ⚠️ **電子煙載具／霧化加熱裝置本體**歸 **`8543.40`**（非 2404！）。\n\n### 2. 第 5–11 類：礦產、化工、塑橡膠、紡織（第 25–63 章）\n- **第 25 vs. 68 章（石材加工界線）**：\n  - 僅粗鑿／鋸成矩形塊之大理石歸 `2515`；經**拋光、磨光、雕琢**之大理石歸 `6802`。\n  - 矽灰歸 `2811.22.90`；以塑膠基材塗佈磨料之**探針卡清潔片**歸 **`6805`**（研磨料製品，115 Q12）；石墨製鍋爐視鏡墊片歸 **`6815.19.00`**（第 16 類註一排除非電氣用石墨製品，115 Q14）。\n- **第 29 章（有機化學品排除）**：\n  - 排除**乙醇（2207）**、**甲烷與丙烷（2711）**、**尿素（3102）**。\n- **第 30 vs. 38 章（HS 2022 重大移列：`3822`！）**：\n  - **HS 2022 將診斷試劑、血型試藥全面移入 `3822`**，第 30 章註一明確排除 `3822`（114 Q8）。\n  - **微生物培養物滅菌快速判讀指示劑（玻璃安瓿）** → 屬微生物培養物，歸 **`3002.49.00`**（115 Q16）。\n  - **無菌容器內供移植用骨** → 歸 **`3001.90`**（非 9021 整形用具！115 Q17）。\n- **第 33 vs. 34 章（精油、面膜、濕紙巾必考區分！）**：\n  - 零售包裝**純精油**（未稀釋／無其他化粧品添加物）歸 **`3301`**（非 3307）。\n  - 浸漬**化粧品／保養液**之不織布面膜 → **`3307.90`**。\n  - 浸漬**肥皂或界面活性清潔劑**之不織布柔濕巾 → **`3401.11.00`**（115 Q20 必背！）。\n- **第 39 / 40 章（塑橡膠常考件）**：\n  - 普魯蘭膠／鹿角菜膠**食品用空膠囊** → `3923.90.90`（115 Q15）。\n  - 塑膠**洗鼻器＋洗鼻鹽組** → `3924.90.00`（塑膠衛生盥洗用具，非 9018 醫療儀器！115 Q11）。\n  - 硫化天然橡膠**麻醉呼吸袋** → **`4016.95.00`**（其他可充氣之硫化橡膠製品，Ch.90 註一(甲)排除 4016，115 Q6）。\n  - 硫化橡膠**牙科橡皮障** → **`4014.90.90`**（硫化橡膠製衛生及醫藥用品，115 Q24）。\n- **第 11 類（紡織品 Ch.50–63 三大鐵律）**：\n  1. **混紡歸類原則（第 11 類註二）**：按**重量最大**之紡織材料歸類；**⚠️ 關鍵陷阱：第 54 章（人造絲）與第 55 章（人造短纖）在計算比重時必須「視為同一章」加總計算！**（例如：棉 40%＋聚酯長絲 35%＋尼龍短纖 25% → 54+55 合計 60% \u003e 棉 40%，須歸 54 或 55 章，再比較 54 vs 55 取大者 54 章！）\n  2. **無塵室濾網／工業用紡織濾布**：歸 **`5911`**（第 16 類註一(戊)排除 5911 工業用紡織品，故**不歸 8421**！）。\n  3. **第 11 類註十五（智慧紡織品）**：內嵌電子元件之成衣／紡織品仍維持紡織品歸類。\n\n### 3. 第 13–15 類：陶瓷、珠寶、卑金屬（第 68–83 章）\n- **第 69 章（陶瓷）**：須先成形再**燒製 ≥ 800℃**；瓷器 vs 陶器界線＝**吸水率 0.5%**（瓷 \u003c 0.5%）。\n- **第 71 章（珠寶 vs 仿首飾）**：\n  - **珊瑚製耳環（無貴金屬）**：珊瑚屬 `9601` 動物雕刻材料，非寶石亦非珍珠，製成耳環歸 **`7117` 仿首飾**（115 Q33！）。\n- **第 15 類註二「一般用零件（Parts of General Use）」超級必考！**：\n  - 凡屬於 **`7307`（管子配件）、`7312`（鋼索）、`7315`（鏈）、`7317`（釘）、`7318`（螺絲螺帽墊圈）**、卑金屬製**彈簧（7320）**、**`8301`（鎖）、`8302`（金屬配件／鉸鏈）、`8306`（鈴）、`8308`（搭扣）、`8310`（標誌牌）**，即使專為機器或車輛設計，**一律歸入第 15 類本身號列**，**不得**歸入第 16 類（機械電機）或第 17 類（車輛船舶）！\n  - ⚠️ **常考對照**：`8481`（栓塞、旋塞、閥）**非**一般用零件！但 `8301` 機動車輛用鎖屬一般用零件，**不歸** Ch.87（115 Q34）。\n- **第 73 / 82 章高頻品項**：\n  - `7308`：固定式倉儲貨架、路燈桿（結構物）。\n  - `7309`：容量 **\u003e 300 公升**鋼鐵製貯槽（僅配龍頭、閥、液位計、壓力計而**無機械或熱力設備**者，仍歸 `7309`，115 Q31）。\n  - `8207`：金屬沖壓模（互換工具）。\n\n### 4. 第 16–18 類：機械、電機、車輛、光學醫療（第 84–92 章）\n- **第 16 類註二「機器零件歸類三原則」**：\n  - **(甲) 專屬列明優先**：零件本身已為 Ch.84/85（除少數通用零件節外）明確列名者，直接歸入該節（例：電動汽車馬達歸 `8501`，非 Ch.87）。\n  - **(乙) 專用／主要用零件**：專供或主要供特定機器使用者，隨該機器歸類（例如 8473、8529）。\n  - **(丙) 通用零件兜底**：不屬上述者，歸入 `8487`（非電氣）或 `8548`（電氣）。\n- **第 84 vs. 85 章常考區分（115 Q35 必考！）**：\n  - **歸第 84 章（雖用電，但以機械／熱交換為主）**：**電風扇（`8414`）**、**電冰箱（`8418`）**、**縫紉機（`8452`）**、ATM 自動櫃員機（`8472`）、**一次性血液透析器（`8421` 液體過濾淨化機具，115 Q30 大魔王！）**。\n  - **歸第 85 章（電氣特性為主）**：**電鈴（`8531`，115 Q35 正解）**、離岸風力發電機組（`8502.31`）。\n  - **第 84 章註十一(丙) 半導體製造與搬運**：專供或主要供升降、搬運、裝卸晶柱／晶圓／半導體裝置／平面顯示器之機器 → 歸 **`8486`**（不歸 8428 搬運機！115 Q13）。\n- **HS 2022 機電／航空五大全新必考稅號**：\n  | HS 2022 新號列 | 貨品名稱與考試重點 |\n  |---|---|\n  | **`8485`** | **積層製造機器（3D 列印機）**（依材料分金屬、塑膠、陶瓷等目） |\n  | **`8517.13`** | **智慧型手機（Smartphones）**獨立列目 |\n  | **`8524`** | **平面顯示模組（FPD Modules）**（液晶／OLED 面板模組；專用零件歸 `8529`） |\n  | **`8539.51` / `.52` / `8541.41` / `9405`** | **LED 四層必辨**：LED 發光二極體元件（單顆晶片）=`8541.41`；LED 模組=`8539.51`；LED 燈泡／燈管=`8539.52`；完整 LED 燈具=`9405` |\n  | **`8549`** | **電子及電氣廢料及碎屑（E-waste）**獨立成節 |\n  | **`8806`** | **無人機（Unmanned Aircraft / Drones）**；⚠️ **排除純供娛樂目的設計之空拍機／玩具無人機 → 歸 `9503`**（115 Q39 必考！） |\n- **第 87 章（車輛零件陷阱 — 115 Q34）**：\n  - ✅ 屬於 Ch.87 零件：`8708.70` 含胎車輪、**機動車輛用安全氣囊含充氣系統**（`8708.95`，115 Q34 正解）。\n  - ❌ 排除於 Ch.87 外：車用鎖（`8301`）、電動車馬達（`8501`）、**機動車輛用座物（`9401.20`）**！\n- **第 90 章（醫療與光學儀器陷阱）**：\n  - 與電腦（ADP）連線以處理呈現臨床資料之診斷器具 → 歸 **`9018`**（Ch.84 註六(戊)排除執行特定功能之機器，115 Q22）。\n  - **牙科治療椅大陷阱（115 Q23）**：單純牙科用椅歸 `9402.10`；但**裝有牙科用儀器（用具）之牙科治療椅** → 歸 **`9018.49.10`**！\n  - `9021`（整形用具／植入體內彌補缺陷）：包含人造牙齒、人造關節、心律調整器、齒列矯正器、植入式結紮夾；**不包含**無菌容器內供移植用骨（`3001.90`，115 Q17）。\n  - `9032.89`：伺服控制器（113 年關務署歸類令）。\n\n### 5. 第 20 類：家具、玩具、雜項（第 94–96 章）\n- **第 94 章（座物與家具）**：\n  - **可拆式塑膠便盆＋軟墊不銹鋼架馬桶椅** → `9401.71.00`（金屬構架套襯座物，115 Q7）。\n  - **嬰兒座物（附懸掛玩具拱環）** → `9401` 座物（非 9503 玩具！115 Q37）。\n  - **具燈光／磁吸充電／藍牙喇叭之木製咖啡桌** → `9403.60.90`（主要特徵為木製家具，115 Q21）。\n- **第 95 章（玩具與運動器材）**：\n  - **羽毛球** → `9506.99.00`（其他運動用品，**非** `9506.69` 其他球！115 Q9 經典陷阱）。\n  - **娛樂用空拍機組** → `9503`（非 `8806` 無人機，115 Q39）。\n- **第 96 章（雜項製品）**：\n  - `9609`（鉛筆、蠟筆、粉筆）：包含**石筆（天然或凝集板石製，115 Q38）**；**排除**醫療鉛筆（`3004`）、眉筆／化粧用筆（`3304`）、撞球用止滑粉塊（`9504`）。\n\n---\n\n## 五、114–115 年申論題實戰擬答範本\n\n### 範例 1（115 年申論第 3 題）：解釋準則三實戰應用\n- **(一) 電動刮鬍刀**：歸列 **第 8510 節**。理由：依 **解釋準則三（甲）**，稅則號別所列貨品名稱說明較具體明確者優先於一般性說明。相較於 8467（手提工具）與 8509（家用電動用具），8510 已明確列明「刮鬍刀……裝有電動機者」，最具體明確。\n- **(二) 皮革與紡織材質組合手套**：歸列 **第 4203 節**。理由：4203（併 Ch.42 註四涵蓋手套）與 6116 各僅述及組合物所含材料之一部分，依 **準則三（甲）後段** 具同等具體明確性，須依 **準則三（乙）** 按構成主要特徵之材料歸類。本手套之掌心、手指下側、拇指及食指等主要接觸、抓取與防磨部位均為皮革製成，足見皮革賦予其主要特徵，故歸 4203 節。\n- **(三) 髮刷（9603）、髮梳（9615）及化粧鏡（7009）零售包裝組合**：歸列 **第 9615 節**。理由：本貨品由不同節貨品配合滿足個人理容之特定活動且供直接零售，屬零售成套貨物。惟各節僅述及其中一項，依準則三（甲）同等具體明確；且三項物品於理容功能上均具重要性，無法決定單一組件構成主要特徵（準則三（乙）不適用），故依 **準則三（丙）** 從後原則，於 7009、9603、9615 中擇位列最後之 **第 9615 節**。\n\n---\n\n## 六、考前極速自檢清單\n- [ ] 能不看書背出總則一～七口訣，以及 **NI（111/7/1）、SV（112/5/15）、HN（112/12/6）** 停用日期與 16 項關稅配額？\n- [ ] 能完整寫出「稅則號別顯然錯誤」3 款、稅則預審「不予預審」5 款，及 **10/20/30/120/90 日** 期限？\n- [ ] 遇到複合／成套貨品時，會依序檢查 **GIR 1 → 2(a) → 3(a) → 3(b) 零售三要件 → 3(c) 從後 → 5(a)/(b) → 6 同槓比較**？\n- [ ] 熟記 **HS 2022 六大新稅號**（`2404`、`3822`、`8485`、`8517.13`、`8524`、`8549`、`8806`）與 **115 年最新陷阱題**（血液透析器 8421、牙科治療椅裝儀器 9018、羽毛球 9506.99、珊瑚耳環 7117、麻醉呼吸袋 4016.95）？\n"},{"id":"04_稅則概要_02_輸出入貨品分類表合訂本","cat":"稅則概要","title":"輸出入貨品分類表合訂本","md":"# 中華民國輸出入貨品分類表合訂本【完整精讀版】\n\n\u003e **整合來源**：游欣翰講師《115 稅則概要》＋陳玟茹講師《115 稅則總複習》＋劉兆富講師《115 報關手冊》＋財政部關務署／經濟部國際貿易署最新合訂本規定＋113–115 年歷屆試題  \n\u003e **考試權重**：本篇同時橫跨《稅則概要》（約 **20–25%**）與《通關實務概要》（如 115 通關實務申論第 1 題直接考 `B01、F01、MW0`），投資報酬率極高！\n\n---\n\n## 一、合訂本結構、HS 2022 統計數據與主管機關\n\n### 1. 主管機關與權責分工（115 稅則 Q3、Q25 必考！）\n- **合訂本共同主管機關**：**財政部**（實務由關務署辦理前 8 碼海關進口稅則）及 **經濟部國際貿易署**（負責第 9–10 碼貨品分類號列與輸入／輸出規定）（115 Q25 正解）。\n- ⚠️ **高頻考點陷阱（115 Q3）**：例如 115 年 2 月 1 日起將加熱菸 `2404.11.00.00-5` 之輸入規定代號由 `501` 修正為 `516`，**增修「輸入規定代號」之主管業務機關為「經濟部國際貿易署」**（雖然 `5xx` 簽審文件本身由衛生福利部核發，但貨品分類表之輸入規定公告增修權責在國際貿易署！）。\n\n### 2. 11 碼貨品分類號列（CCC Code）解剖圖\n\n```mermaid\n%% diagram:tariff-ccc\nflowchart LR\n    C1[\"前2碼：章 (98章)\"] --\u003e C2[\"3-4碼：節 (1,228節)\"]\n    C2 --\u003e C3[\"5-6碼：目 (5,612目)\u003cbr/\u003eWCO 國際統一 HS 6碼\"]\n    C3 --\u003e C4[\"7-8碼：款 (9,335款)\u003cbr/\u003e財政部海關進口稅則 8碼\"]\n    C4 --\u003e C5[\"9-10碼：統計碼 + 11碼檢查碼\u003cbr/\u003e經濟部國貿署輸出入規定\"]\n```\n```text\n  02      06      49       20        00     -    1\n [章]    [節]    [目]     [款]     [統計碼]    [檢查碼]\n ├─── HS 國際統一 6 碼 ───┤\n ├───── 海關進口稅則 8 碼 ─────┤\n ├──────── 中華民國輸出入貨品分類號列 10 碼 ────────┤\n ├─────────────── 完整 CCC Code 11 碼 ───────────────┤\n```\n- **前 2 碼（章 Chapter）**：共 97 章（HS 國際標準，第 77 章留空）＋我國自設 **第 98 章**（關稅配額、零星物品 `9899` 等）＝ **98 章**。\n- **前 4 碼（節 Heading）**：決定歸類之第一順位（GIR 1）。\n- **前 6 碼（目 Subheading）**：WCO 全球統一碼，歸類受 GIR 6 拘束。\n- **前 8 碼（款 Division）**：我國《海關進口稅則》稅則號別，**稅率決定單位**，由立法院三讀通過。\n- **第 9–10 碼（統計碼）**：經濟部國際貿易署依貿易統計與簽審管理需要增設。\n- **第 11 碼（檢查碼 Check Digit）**：電腦檢核輸入有無筆誤用。\n\n### 3. HS 2022 版官方統計數據（113 Q38 必背數字！）\n| 層級 | WCO 國際 HS 2022 標準 | 我國海關進口稅則（2022 版現行） |\n|---|---|---|\n| **類（Section）** | **21 類** | **21 類** |\n| **章（Chapter）** | **97 章**（第 77 章保留空章，實為 96 章） | **98 章**（含第 98 章特設章） |\n| **節（Heading，4 碼）** | **1,228 節** | 1,228 節（＋98 章若干節） |\n| **目（Subheading，6 碼）** | **5,612 目** | 5,612 目 |\n| **款（Division，8 碼）** | — | **9,335 款** |\n\n---\n\n## 二、稽徵特別規定（CR 欄）代碼全表【每年必考 1–3 題！】\n\n\u003e ⚠️ **必殺陷阱（115 Q26）**：許多考生把 **`B`** 與 **`C`** 搞反！請用英文聯想記憶：**`B` = Beer（酒稅）**、**`C` = Cigarettes（菸稅及菸品健康福利捐）**、**`T` = Tax / 貨物稅（Commodity Tax）**！\n\n| 代碼 | 完整法定意義 | 記憶法與最新修法提示 |\n|---|---|---|\n| **`R`** | 應徵**特別關稅**（反傾銷稅、平衡稅、報復關稅等）或與反傾銷相關註記 | **R**etaliatory / 救濟特別稅 |\n| **`T`** | 應徵**貨物稅** | **T**ax（確定應課貨物稅） |\n| **`T*`** | **部分**應徵貨物稅（該稅號下僅部分貨品符合貨物稅條例課稅範圍） | 📌 **114/12/30 貨物稅條例修正重點**：已取消**彩色電視機、錄影機、電唱機、錄音機**等電器類貨物稅，且無添加糖飲料品亦納入免徵範圍，實務上對應稅號陸續移除 `T`/`T*` |\n| **`N`** | 適用**增註**之特定稅則號別（115 Q1） | Additional **N**ote（須附主管機關證明） |\n| **`B`** | 應徵**酒稅** | **B**eer / Beverage（酒精飲料） |\n| **`B*`** | **部分**應徵酒稅（如料理酒或部分含酒精製品視性質課徵） | 部分酒稅 |\n| **`C`** | 應徵**菸稅及菸品健康福利捐**（115 Q26 正解！） | **C**igarettes（菸品＋健康捐） |\n| **`L*`** | 部分應徵**特種貨物及勞務稅（奢侈稅 10%）**（如完稅價格＋稅費達 300 萬元以上之小客車、遊艇、飛機、龜殼、玳瑁、珊瑚、象牙、毛皮等） | **L**uxury Tax（奢侈稅） |\n| **`Z`** | 屬**免徵營業稅**貨品（如未經加工之生鮮農林漁牧產物副產物、金條金塊等） | **Z**ero VAT（免營業稅） |\n| **`G`** | 採取**特別防衛措施（SSG）**（針對 WTO 關稅配額農產品進口量暴增或價格暴跌時加徵額外關稅） | Safe**G**uard |\n| **`D*`** | 部分進口貨物涉及**外銷品沖退原料稅**相關特別規定（或依特定基準辦理） | **D**rawback |\n\n---\n\n## 三、輸入規定代碼（Import Regulations）完整分類表\n\n\u003e 📌 **115 年《通關實務概要》申論第 1 題（10 分）**直接問：`02064920001` 冷凍豬肉骨輸入規定為 `B01、F01、MW0`，請說明各代碼意義！可見輸出入規定代碼不只是選擇題，更是**申論必考題**！\n\n### 1. 貿易管制與大陸物品規定（數字 1xx、M 開頭）\n| 代碼 | 主管機關 | 完整意義 | 考點提示 |\n|---|---|---|---|\n| **`111`** | 經濟部國貿署 | **管制輸入**（除專案核准外不准輸入，如保育類、特定武器、含尼古丁電子煙油 `2404.12`） | 最嚴格管制 |\n| **`121`** | 經濟部國貿署 | 由貿易署**簽發輸入許可證**（原則需證） | 121＝貿易署簽證 |\n| **`122`** | 簽審機關 | 由**委託簽證單位**簽發輸入許可證 | 與 121 區分 |\n| **`MW0`** | 經濟部國貿署 | **大陸物品不准輸入**（115 通關實務申論一！） | **M**ainland **W**ithheld (0) |\n| **`MP1`** | 經濟部國貿署 | **大陸物品有條件准許輸入**，應符合「大陸物品有條件准許輸入項目、輸入管理法規彙總表」之規定（列有特別規定 `MXX` 代號者須向貿易署申請輸入許可證；未列者免證） | **M**ainland **P**artial (1) |\n| **`M01`–`M99`** | 經濟部國貿署 | 大陸物品特定項目之特別管理條件（搭配 `MP1` 使用） | 如少量免證例外詳見報關手冊 |\n\n### 2. 檢疫、檢驗與食藥署邊境查驗（英文字母開頭 — 最高頻！）\n| 代碼 | 主管機關 | 完整意義 | 記憶口訣 |\n|---|---|---|---|\n| **`A01` / `A02`** | 經濟部國貿署／主管機關 | 與特定配額／輸入規定相關（或農漁畜產品輸入管制，須依貨品表註明；實務 `A02` 亦見特定農產） | 依貨表註記 |\n| **`B01`** | **農業部動植物防疫檢疫署** | 進口時，應依農業部動植物防疫檢疫署編訂之「**應施檢疫動植物品目表**」及有關檢疫規定辦理（115 通關實務申論一！） | **B**io-quarantine（動植物檢疫） |\n| **`C01`** | **經濟部標準檢驗局** | 經濟部標準檢驗局公告**應施進口檢驗商品** | **C**ommodity inspection（BSMI 商檢） |\n| **`C02`** | **經濟部標準檢驗局** | 本項下**部分商品**屬於經濟部標準檢驗局公告應施進口檢驗商品 | 部分應施商檢 |\n| **`F01`** | **衛生福利部食品藥物管理署（TFDA）** | 輸入商品應依照「**食品及相關產品輸入查驗辦法**」規定，向衛生福利部食品藥物管理署申請辦理**輸入查驗**（115 通關實務申論一！） | **F**ood（食品輸入查驗） |\n| **`F02`** | **衛福部食藥署** | 本項下進口商品如屬**食品、食品添加物、食品器具、食品容器或包裝**等用途者，應向食藥署申請輸入查驗（報關時商標欄不得空白，且須填用途代碼 1–4） | 部分用途為食品（須填用途碼） |\n| **`F03`** | **衛福部食藥署** | 特定食品／農產品（如中藥材或特定高風險食品）須依食藥署規定辦理查驗 | 食品相關查驗 |\n| **`H01`** | **衛福部（食藥署／中醫藥司）** | 衛生福利部公告**應施輸入查驗中藥材**，應憑衛福部食藥署核發之輸入許可通知進口（115 稅則 Q29 正解！） | **H**erbs（中藥材輸入查驗） |\n| **`H02`** | **衛福部** | 本項下部分商品屬應施輸入查驗中藥材 | 部分中藥材 |\n| **`W01`** | **財政部國庫署** | 輸入**菸酒**（或未變性酒精）應檢附財政部核發之菸酒進口業許可執照影本或財政部同意文件 | **W**ine（菸酒管理） |\n\n### 3. 各部會專業簽審代碼（數字 4xx、5xx、6xx）\n| 代碼區間 | 主管機關 | 代表性必考代碼 |\n|---|---|---|\n| **`401`–`406`** | **農業部**（農糧、漁業、畜牧、林保等） | `401` 農業部同意文件、`402` 飼料輸入登記證、`403` 農藥許可證、`404` 動物用藥品、`406` 肥料登記證 |\n| **`462`–`467`** | **財政部關務署**（關稅配額證明書） | `462` 應檢附財政部（臺灣銀行代辦）核發之**關稅配額證明書**（配額內稅率）；未附者按配額外高稅率課徵 |\n| **`501`–`522`** | **衛生福利部**（藥品、醫療器材、化粧品、菸品） | • `501` 進口**人用藥品**（須附藥品許可證影本及核准函）\u003cbr\u003e• `503` 進口**原料藥**（限藥廠或藥商）\u003cbr\u003e• `504` 進口**醫療器材**（須附醫療器材許可證或登錄字號）\u003cbr\u003e• `505` **中藥製劑／藥品**\u003cbr\u003e• `516`（115/2/1 新增適用加熱菸 `2404.11` 取代原 `501`，115 Q3）\u003cbr\u003e• `522` **管制藥品**（須附食藥署管制藥品輸入同意書） |\n| **`550`–`555`** | **環境部**（資源循環署／化學物質管理署） | • `550` 事業廢棄物／再生資源同意文件\u003cbr\u003e• **`553` 毒性及關注化學物質**（環境部核准文件 — 高頻必考！） |\n| **`581`** | **核能安全委員會（原原能會）** | 放射性物質或可發生游離輻射設備同意文件 |\n| **`602`** | **國家通訊傳播委員會（NCC）** | **電信管制射頻器材**（藍牙、Wi-Fi、手機、無線遙控器等）進口核准證或型式認證證明 |\n| **`641`** | **內政部警政署** | 警械、刀械、模擬槍等同意文件 |\n\n\u003e 🚨 **「其他相關輸入規定」超級必考條款（游欣翰講師強調！）**：  \n\u003e **凡輸入「人用藥品」，不論其歸列之貨品分類號列（CCC Code）是否列有 `501`、`503`、`505` 代號，均應一律依照 `501`、`503`、`505` 規定向衛生福利部辦理查驗／檢附許可證！**（例如某些歸列第 21 章營養品或第 30 章以外稅號但實質屬藥品者，仍受此條款拘束。）\n\n---\n\n## 四、輸出規定代碼（Export Regulations）精要\n| 代碼 | 主管機關 | 完整意義 |\n|---|---|---|\n| **`111`** | 經濟部國貿署 | **管制輸出**（除專案核准外不准輸出） |\n| **`121`** | 經濟部國貿署 | 應由國際貿易署簽發**輸出許可證** |\n| **`S01` / `S02`** | 經濟部國貿署 | **戰略性高科技貨品（SHTC）**輸出管制（含瓦聖納協定軍商兩用清單；出口至管制地區或列管貨品須取得 SHTC 輸出許可證，連**三角貿易**與**保稅區復出口**亦不豁免！） |\n| **`B01`** | 農業部防檢署 | 輸出應施檢疫動植物（如特定苗木、活體動物） |\n| **`441` / `442`** | 農業部／林保署 | 保育類野生動物、CITES 瀕臨絕種動植物輸出許可（報單須申報**學名＋俗名**並於申請審驗方式填 `8`） |\n| **`522` / `525`** | 衛福部 | 管制藥品、人體器官／血液等輸出同意文件 |\n| **`531`** | 環境部 | 有害事業廢棄物（巴塞爾公約）輸出許可 |\n| **`561`–`565`** | 經濟部／文化部／海委會 | 古物、珍貴文書、特定砂石或資源輸出管制 |\n\n---\n\n## 五、115 年實戰申論示範（跨科通吃！）\n\n### 範例（115 年《通關實務概要》申論第 1 題，10 分）\n\u003e **題目**：進口冷凍豬肉骨（`02064920001`），輸入規定為「`B01`、`F01`、`MW0`」，請說明各輸入規定代碼之意義。\n\n**高分標準擬答**：\n1. **`B01`（動植物檢疫規定）**：進口時，應依**農業部動植物防疫檢疫署**編訂之「應施檢疫動植物品目表」及有關檢疫規定辦理（冷凍豬肉骨屬動物產品，須辦理動物檢疫並檢附輸出國官方動物檢疫證明書）。\n2. **`F01`（食品輸入查驗規定）**：輸入商品應依照「**食品及相關產品輸入查驗辦法**」規定，向**衛生福利部食品藥物管理署**申請辦理輸入查驗（經查驗合格核發輸入許可通知後，始准放行）。\n3. **`MW0`（大陸物品輸入管制規定）**：**大陸物品不准輸入**（該貨品如原產地為中國大陸，除經經濟部國際貿易署專案核准者外，一律禁止輸入）。\n\n---\n\n## 六、考前極速自檢清單\n- [ ] 能立刻區分 `B`/`B*`（酒稅）、`C`（菸稅＋健康捐）、`T`/`T*`（貨物稅）、`N`（增註）、`G`（特別防衛措施）、`L*`（奢侈稅）、`Z`（免營業稅）？\n- [ ] 能背出 HS 2022 統計數據：**21 類、97 章（我國 98 章）、1,228 節、5,612 目、9,335 款**？\n- [ ] 知道合訂本共同主管機關是「**財政部及經濟部國際貿易署**」，且**增修輸入規定代號**屬**經濟部國際貿易署**業務？\n- [ ] 能默寫出 `111`、`121`、`MW0`、`MP1`、`B01`、`C01/C02`、`F01/F02`、`H01`、`W01`、`462`、`501/504/522`、`553`、`602`、`S01` 的完整意義？\n"}];

function renderProgressDashboardSvg(planDone, planTotal, fcDone, fcTotal, qDone, qTotal, wrongCnt) {
  const ring = (x, pct, color, label, sub) => {
    const r = 34, c = 2 * Math.PI * r;
    const off = c * (1 - pct / 100);
    return `
      <g transform="translate(${x},54)">
        <circle r="${r}" fill="none" stroke="#e2e8f0" stroke-width="8"/>
        <circle r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90)"/>
        <text y="5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">${pct}%</text>
        <text y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">${label}</text>
        <text y="70" text-anchor="middle" font-size="10.5" fill="#64748b">${sub}</text>
      </g>`;
  };
  const pPct = planTotal ? Math.round(planDone / planTotal * 100) : 0;
  const fPct = fcTotal ? Math.round(fcDone / fcTotal * 100) : 0;
  const qPct = qTotal ? Math.round(qDone / qTotal * 100) : 0;
  const accPct = qDone ? Math.max(0, Math.round((qDone - wrongCnt) / qDone * 100)) : 100;
  return `
    <div class="diagram-card" style="margin-bottom:14px;">
      <div class="diagram-title">📊 即時備考進度儀表板（自動隨打卡／閃卡／刷題更新）</div>
      <div class="diagram-scroll">
        <svg viewBox="0 0 720 142" style="width:100%;max-width:720px;min-width:460px;height:auto;display:block;margin:0 auto;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang TC,Microsoft JhengHei,sans-serif">
          ${ring(95, pPct, "#0f4c81", "看課打卡", `${planDone} / ${planTotal} 項`)}
          ${ring(270, fPct, "#0d9488", "英文閃卡熟記", `${fcDone} / ${fcTotal} 詞`)}
          ${ring(445, qPct, "#d97706", "互動刷題完成", `${qDone} / ${qTotal} 題`)}
          ${ring(620, accPct, wrongCnt > 0 ? "#dc2626" : "#16a34a", "刷題正確率", `待複習錯題 ${wrongCnt} 題`)}
        </svg>
      </div>
    </div>`;
}

let mlState = { sub: "prac", epIdx: 0, sceneIdx: 0, playing: false, voiceOn: true, rate: 1.1, pitch: 1.0, voiceURI: "" };

try {
  const savedV = JSON.parse(localStorage.getItem(ML_VOICE_CFG_KEY) || "null");
  if (savedV) {
    if (typeof savedV.rate === "number") mlState.rate = savedV.rate;
    if (typeof savedV.pitch === "number") mlState.pitch = savedV.pitch;
    if (typeof savedV.voiceURI === "string") mlState.voiceURI = savedV.voiceURI;
    if (typeof savedV.voiceOn === "boolean") mlState.voiceOn = savedV.voiceOn;
  }
} catch (e) {}

function saveMlVoiceCfg() {
  try {
    localStorage.setItem(ML_VOICE_CFG_KEY, JSON.stringify({
      rate: mlState.rate,
      pitch: mlState.pitch,
      voiceURI: mlState.voiceURI,
      voiceOn: mlState.voiceOn
    }));
  } catch (e) {}
}

function getCurMlList() {
  return (MICRO_LESSONS_BY_SUB[mlState.sub] || MICRO_LESSONS_BY_SUB.prac).eps;
}

function stopMicroLessonAudio() {
  if (mlTimer) { clearTimeout(mlTimer); mlTimer = null; }
  if ("speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
}

function getAvailableZhVoices() {
  if (!("speechSynthesis" in window)) return [];
  const vs = window.speechSynthesis.getVoices() || [];
  const zh = vs.filter(v => /zh|cmn|chinese|taiwan|mandarin/i.test((v.lang || "") + " " + (v.name || "")));
  const score = v => {
    const s = (v.name || "") + " " + (v.lang || "");
    let sc = 0;
    if (/zh[-_]TW/i.test(v.lang || "")) sc += 50;
    else if (/zh[-_]Hant/i.test(v.lang || "")) sc += 40;
    if (/Natural|Online|Neural|Enhanced|Premium|Siri/i.test(s)) sc += 30;
    if (/HsiaoChen|YunJhe|HsiaoYu|Mei-Jia|Google 國語/i.test(s)) sc += 20;
    return sc;
  };
  return zh.sort((a, b) => score(b) - score(a));
}

function pickZhTwVoice() {
  const list = getAvailableZhVoices();
  if (mlState.voiceURI) {
    const exact = list.find(v => v.voiceURI === mlState.voiceURI);
    if (exact) return exact;
  }
  return list[0] || null;
}

if ("speechSynthesis" in window && typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
  window.speechSynthesis.onvoiceschanged = () => {
    if (typeof state !== "undefined" && state.tab === "video") render();
  };
}

function testMicroVoice() {
  stopMicroLessonAudio();
  mlState.playing = false;
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
    toast("此瀏覽器不支援語音合成");
    return;
  }
  const u = new SpeechSynthesisUtterance("哈囉！這是我目前的講解聲音跟聲調，聽起來順耳嗎？");
  u.lang = "zh-TW";
  u.rate = mlState.rate;
  u.pitch = mlState.pitch;
  const v = pickZhTwVoice();
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

function advanceMicroScene() {
  if (!mlState.playing) return;
  const list = getCurMlList();
  const ep = list[mlState.epIdx];
  if (mlState.sceneIdx < ep.scenes.length - 1) {
    mlState.sceneIdx++;
    render();
    playCurrentMicroScene();
  } else {
    mlState.playing = false;
    render();
    toast("🎉 本集微課播放完畢！");
  }
}

function playCurrentMicroScene() {
  stopMicroLessonAudio();
  if (!mlState.playing) return;
  const list = getCurMlList();
  const ep = list[mlState.epIdx];
  const sc = ep.scenes[mlState.sceneIdx];
  const fallbackMs = Math.max(6000, Math.round((sc.narration.length * 165) / mlState.rate));

  if (mlState.voiceOn && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined") {
    try {
      const u = new SpeechSynthesisUtterance(sc.narration);
      u.lang = "zh-TW";
      u.rate = mlState.rate;
      u.pitch = mlState.pitch;
      const v = pickZhTwVoice();
      if (v) u.voice = v;
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        if (mlState.playing) mlTimer = setTimeout(advanceMicroScene, 900);
      };
      u.onend = done;
      u.onerror = () => {
        if (finished) return;
        finished = true;
        if (mlState.playing) mlTimer = setTimeout(advanceMicroScene, fallbackMs);
      };
      mlTimer = setTimeout(done, fallbackMs + 10000);
      window.speechSynthesis.speak(u);
      return;
    } catch (e) {}
  }
  mlTimer = setTimeout(advanceMicroScene, fallbackMs);
}

function renderMicroLessons(root) {
  const list = getCurMlList();

  const ep = list[mlState.epIdx];

  const totalSc = ep.scenes.length;

    ? `<div class="ml-diag-wrap">${EXAM_DIAGRAMS[sc.diagramId].svg}</div>`
    : "";

  root.innerHTML = `
    <div class="toolbar" style="flex-direction:column;align-items:stretch;gap:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <div><strong>🎬 全四科生活化白話微課（共 18 集・108 幕）</strong></div>
        <div class="group">
          <button class="btn ${mlState.voiceOn ? "btn-ok" : ""}" id="ml-voice">${mlState.voiceOn ? "🔊 語音說書：開" : "🔇 純字幕輪播"}</button>
          <button class="btn" id="ml-test-v" title="試聽目前聲音與聲調">🎧 試聽</button>
        </div>
      </div>
      <div class="group" style="gap:8px;">
        <span style="font-size:0.78rem;font-weight:700;color:var(--muted);">🎙️ 聲音調校：</span>
        <select id="ml-speaker" title="選擇講者聲音" style="max-width:260px;">
          ${zhVoices.length === 0
            ? `<option value="">系統預設中文語音</option>`
            : zhVoices.map(v => {
                const selected = curVoice && curVoice.voiceURI === v.voiceURI;
                const shortName = v.name.replace(/^Microsoft\s+/i, "").replace(/\s*-\s*Chinese.*$/i, "");
                return `<option value="${escHtml(v.voiceURI)}" ${selected?"selected":""}>${escHtml(shortName)} (${escHtml(v.lang)})</option>`;
              }).join("")}
        </select>
        <select id="ml-pitch" title="調整講解聲調（音高）">
          <option value="0.82" ${mlState.pitch===0.82?"selected":""}>🎵 聲調：沉穩低音 (0.82)</option>
          <option value="0.93" ${mlState.pitch===0.93?"selected":""}>🎵 聲調：溫和自然 (0.93)</option>
          <option value="1" ${mlState.pitch===1?"selected":""}>🎵 聲調：標準 (1.0)</option>
          <option value="1.12" ${mlState.pitch===1.12?"selected":""}>🎵 聲調：輕快活潑 (1.12)</option>
          <option value="1.25" ${mlState.pitch===1.25?"selected":""}>🎵 聲調：清亮高音 (1.25)</option>
        </select>
        <select id="ml-rate" title="播放語速">
          <option value="0.95" ${mlState.rate===0.95?"selected":""}>⚡ 語速 0.95x（慢速）</option>
          <option value="1" ${mlState.rate===1?"selected":""}>⚡ 語速 1.0x</option>
          <option value="1.1" ${mlState.rate===1.1?"selected":""}>⚡ 語速 1.1x（自然聊天）</option>
          <option value="1.25" ${mlState.rate===1.25?"selected":""}>⚡ 語速 1.25x</option>
          <option value="1.45" ${mlState.rate===1.45?"selected":""}>⚡ 語速 1.45x（衝刺）</option>
        </select>
      </div>
      <div class="group">
        <span style="font-size:0.78rem;font-weight:700;color:var(--primary);">選擇科目：</span>
        ${["law","tariff","prac","eng"].map(k => {
          const obj = MICRO_LESSONS_BY_SUB[k];
          return `<button class="btn ${mlState.sub===k?"btn-primary":""}" data-mlsub="${k}">${obj.label} (${obj.eps.length}集)</button>`;
        }).join("")}
      </div>
    </div>

    <div class="ml-ep-strip">
      ${list.map((e, i) => `
        <button class="ml-ep-card ${i===mlState.epIdx?"active":""}" data-ep="${i}">
          <div class="ml-ep-num">${e.ep} · ${e.duration}</div>
          <div class="ml-ep-t">${escHtml(e.title)}</div>
        </button>
      `).join("")}
    </div>

    <div class="ml-stage">
      <div class="ml-stage-top">
        <span class="ml-badge">${ep.ep}｜第 ${mlState.sceneIdx + 1} / ${totalSc} 幕</span>
        <span class="ml-tag">${escHtml(sc.badge)}</span>
      </div>

      <div class="ml-scene-body" key="${ep.id}_${mlState.sceneIdx}">

          ${sc.bullets.map(b => `<li>${escHtml(b)}</li>`).join("")}

      </div>

      <div class="ml-controls">
        <button class="btn" id="ml-prev" ${mlState.sceneIdx===0?"disabled":""}>⏮ 上一幕</button>
        <button class="btn btn-primary" id="ml-play" style="min-width:130px;">${mlState.playing ? "⏸ 暫停播放" : "▶ 播放本集"}</button>
        <button class="btn" id="ml-next" ${mlState.sceneIdx===totalSc-1?"disabled":""}>⏭ 下一幕</button>
        ${mlState.epIdx < list.length - 1 ? `<button class="btn btn-ok" id="ml-next-ep">下一集 ➔</button>` : ""}
      </div>
    </div>

    <div style="margin-top:12px;font-size:0.83rem;color:var(--muted);">
      💡 <strong>讓聲音變真人級的小技巧</strong>：電腦用 <strong>Microsoft Edge</strong> 開啟時，上方講者選 <code>HsiaoChen Online (Natural)</code> 或 <code>YunJhe Online (Natural)</code> 最接近真人主播！iPhone 可到「設定 → 輔助使用 → 語音內容 → 聲音 → 中文(台灣)」免費下載「美佳（增強版）」。想要雙人自然聊天室影片／MP4，可用 <code>NotebookLM_全四科影音包/</code> 3 分鐘生成！
    </div>
  `;

  root.querySelectorAll("[data-mlsub]").forEach(b => {

      mlState.epIdx = 0;
      mlState.sceneIdx = 0;
      mlState.playing = false;
      render();
    };
  });
  root.querySelectorAll("[data-ep]").forEach(b => {
    b.onclick = () => {
      stopMicroLessonAudio();
      mlState.epIdx = Number(b.dataset.ep);
      mlState.sceneIdx = 0;
      mlState.playing = false;
      render();
    };
  });
  root.querySelectorAll("[data-sc]").forEach(b => {
    b.onclick = () => {
      mlState.sceneIdx = Number(b.dataset.sc);
      render();
      if (mlState.playing) playCurrentMicroScene();
    };
  });
  document.getElementById("ml-voice").onclick = () => {
    mlState.voiceOn = !mlState.voiceOn;
    saveMlVoiceCfg();
    render();
    if (mlState.playing) playCurrentMicroScene();
  };
  document.getElementById("ml-test-v").onclick = testMicroVoice;
  document.getElementById("ml-speaker").onchange = e => {
    mlState.voiceURI = e.target.value;
    saveMlVoiceCfg();
    if (mlState.playing) playCurrentMicroScene();
    else testMicroVoice();
  };
  document.getElementById("ml-pitch").onchange = e => {
    mlState.pitch = Number(e.target.value);
    saveMlVoiceCfg();
    if (mlState.playing) playCurrentMicroScene();
    else testMicroVoice();
  };
  document.getElementById("ml-rate").onchange = e => {
    mlState.rate = Number(e.target.value);
    saveMlVoiceCfg();
    if (mlState.playing) playCurrentMicroScene();
  };
  document.getElementById("ml-play").onclick = () => {
    mlState.playing = !mlState.playing;
    render();
    if (mlState.playing) playCurrentMicroScene();
    else stopMicroLessonAudio();
  };
  document.getElementById("ml-prev").onclick = () => {
    mlState.sceneIdx = Math.max(0, mlState.sceneIdx - 1);
    render();
    if (mlState.playing) playCurrentMicroScene();
  };
  document.getElementById("ml-next").onclick = () => {
    mlState.sceneIdx = Math.min(totalSc - 1, mlState.sceneIdx + 1);
    render();
    if (mlState.playing) playCurrentMicroScene();
  };
  const nep = document.getElementById("ml-next-ep");
  if (nep) nep.onclick = () => {
    stopMicroLessonAudio();
    mlState.epIdx++;
    mlState.sceneIdx = 0;
    mlState.playing = true;
    render();
    playCurrentMicroScene();
  };
}

// ==================== LIGHTWEIGHT MARKDOWN RENDERER ====================
function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inlineMd(s) {
  let out = escHtml(s);
  out = out.replace(/\\(\$)/g, "$1");
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  out = out.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  return out;
}
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let inCode = false, codeLang = "", codeBuf = [];
  let inUl = false, inOl = false;
  let tableBuf = [];

  function flushLists() {
    if (inUl) { html += "</ul>"; inUl = false; }
    if (inOl) { html += "</ol>"; inOl = false; }
  }
  function flushTable() {
    if (tableBuf.length < 2) {
      tableBuf.forEach(l => { html += `<p>${inlineMd(l)}</p>`; });
      tableBuf = [];
      return;
    }
    const parseRow = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    const headers = parseRow(tableBuf[0]);
    html += "<table><thead><tr>" + headers.map(h => `<th>${inlineMd(h)}</th>`).join("") + "</tr></thead><tbody>";
    for (let i = 2; i < tableBuf.length; i++) {
      const cells = parseRow(tableBuf[i]);
      html += "<tr>" + cells.map(c => `<td>${inlineMd(c)}</td>`).join("") + "</tr>";
    }
    html += "</tbody></table>";
    tableBuf = [];
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      flushLists(); flushTable();
      if (!inCode) {
        inCode = true;
        codeLang = line.trim().slice(3).trim().toLowerCase();
        codeBuf = [];
      } else {
        const rawCode = codeBuf.join("\n");
        const mDiag = codeLang === "mermaid" && rawCode.match(/%%\s*diagram:([a-z0-9\-_]+)/i);
        if (mDiag && typeof EXAM_DIAGRAMS !== "undefined" && EXAM_DIAGRAMS[mDiag[1]]) {
          const d = EXAM_DIAGRAMS[mDiag[1]];
          html += `<div class="diagram-card"><div class="diagram-title">${escHtml(d.title)}</div><div class="diagram-scroll">${d.svg}</div></div>`;
        } else {
          html += `<pre><code>${escHtml(rawCode)}</code></pre>`;
        }
        inCode = false;
        codeLang = "";
      }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
      flushLists();
      tableBuf.push(line.trim());
      continue;
    } else if (tableBuf.length) {
      flushTable();
    }

    if (!line.trim()) { flushLists(); continue; }
    if (/^---+$/.test(line.trim())) { flushLists(); html += "<hr style='border:none;border-top:1px solid var(--border);margin:16px 0;'>"; continue; }
    if (line.startsWith("# ")) { flushLists(); html += `<h1>${inlineMd(line.slice(2))}</h1>`; continue; }
    if (line.startsWith("## ")) { flushLists(); html += `<h2>${inlineMd(line.slice(3))}</h2>`; continue; }
    if (line.startsWith("### ")) { flushLists(); html += `<h3>${inlineMd(line.slice(4))}</h3>`; continue; }
    if (line.startsWith("#### ")) { flushLists(); html += `<h4 style="margin:12px 0 6px;font-size:0.95rem;color:#334155;">${inlineMd(line.slice(5))}</h4>`; continue; }
    if (line.startsWith("> ")) { flushLists(); html += `<blockquote>${inlineMd(line.slice(2))}</blockquote>`; continue; }

    const ulMatch = line.match(/^\s*[-*]\s+(.*)$/);
    if (ulMatch) {
      if (inOl) { html += "</ol>"; inOl = false; }
      if (!inUl) { html += "<ul>"; inUl = true; }
      html += `<li>${inlineMd(ulMatch[1])}</li>`;
      continue;
    }
    const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
    if (olMatch) {
      if (inUl) { html += "</ul>"; inUl = false; }
      if (!inOl) { html += "<ol>"; inOl = true; }
      html += `<li>${inlineMd(olMatch[1])}</li>`;
      continue;
    }
    flushLists();
    html += `<p>${inlineMd(line)}</p>`;
  }
  flushLists(); flushTable();
  return html;
}

    for (let i = FLASHCARDS.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [FLASHCARDS[i],FLASHCARDS[j]]=[FLASHCARDS[j],FLASHCARDS[i]]; }
    state.fcIdx = 0; state.fcFlipped = false; render();
  };
  if (list.length === 0) {
    document.getElementById("fc-clr").onclick = () => { state.fcCat="ALL"; state.fcOnlyWeak=false; state.fcQuery=""; render(); };
    return;
  }
  document.getElementById("fc-card").onclick = () => { state.fcFlipped = !state.fcFlipped; render(); };
  document.getElementById("fc-prev").onclick = () => { state.fcIdx = (state.fcIdx - 1 + list.length) % list.length; state.fcFlipped = false; render(); };
  document.getElementById("fc-next").onclick = () => { state.fcIdx = (state.fcIdx + 1) % list.length; state.fcFlipped = false; render(); };
  document.getElementById("fc-known").onclick = () => {

    else state.progress.knownFc[card.id] = true;
    saveProgress();
    state.fcFlipped = false;
    if (!state.fcOnlyWeak) state.fcIdx = (state.fcIdx + 1) % list.length;
    render();
  };
}

function getPoolBySub(sub) {
  if (sub === "all") return ALL_QUIZZES;
  const pastSub = ["115","114","113","112","111"].flatMap(y => PAST_EXAMS[y][sub] || []);
  const mockSub = M116_MOCK_QUESTIONS.filter(q => q.id.includes("_" + sub + "_"));
  const extra = sub === "eng" ? ENG_QUESTIONS : (sub === "law" ? LAW_QUESTIONS : []);
  return [...mockSub, ...pastSub, ...extra];
}

function rollRandomPool(sub) {
  const pool = [...getPoolBySub(sub)];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  state.randomPool = pool.slice(0, 40);
  state.randomKey = sub;
  state.qIdx["random:" + sub] = 0;
}

function getQuizBankList() {
  const src = state.quizSrc;
  const sub = state.quizSub;
  if (src === "mistakes") return ALL_QUIZZES.filter(q => state.progress.wrongSet[q.id]);
  if (src === "random") {
    if (state.randomKey !== sub || state.randomPool.length === 0) rollRandomPool(sub);
    return state.randomPool;
  }
  if (src === "116mock") {
    if (sub === "all") return M116_MOCK_QUESTIONS;
    return M116_MOCK_QUESTIONS.filter(q => q.id.includes("_" + sub + "_"));
  }
  if (src === "inst") {
    if (sub === "inst_eng") return ENG_QUESTIONS;
    if (sub === "inst_law") return LAW_QUESTIONS;
    if (sub === "inst_core") return CORE_QUESTIONS;
    return [...ENG_QUESTIONS, ...LAW_QUESTIONS, ...CORE_QUESTIONS];
  }
  const yr = PAST_EXAMS[src];
  if (!yr) return [];
  if (sub === "all") return [...yr.law, ...yr.tariff, ...yr.prac, ...yr.eng];
  return yr[sub] || [];
}

function formatExpHtml(exp) {
  const safe = escHtml(exp);
  const marker = "⚠️【115 最新修法提醒】";
  const idx = safe.indexOf(marker);
  if (idx === -1) return safe;
  const main = safe.slice(0, idx).trim();
  const warn = safe.slice(idx).trim();
  return `${main ? `<div>${main}</div>` : ""}<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:#fef3c7;border-left:4px solid #d97706;color:#92400e;font-weight:600;font-size:0.86rem;">${warn}</div>`;
}

async function gistPush() {
  const token = document.getElementById("g-token").value.trim();
  const gistId = document.getElementById("g-id").value.trim();
  if (!token) { toast("請先填入 GitHub Token（僅需勾選 gist 權限）"); return; }
  gistCfg.token = token;
  gistCfg.gistId = gistId;
  saveGistCfg();

  const payload = {
    description: "116 專責報關人員備考進度同步檔（自動建立，私密）",
    public: false,
    files: { "customs-exam-116-progress.json": { content: JSON.stringify(state.progress, null, 2) } }
  };
  const url = gistId ? `https://api.github.com/gists/${gistId}` : "https://api.github.com/gists";
  const method = gistId ? "PATCH" : "POST";

  try {
    toast("☁️ 上傳中...");
    const res = await fetch(url, {
      method,
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    gistCfg.gistId = data.id;
    saveGistCfg();
    toast("✅ 已上傳至私密 GitHub Gist！");
    render();
  } catch (err) {
    toast("❌ 上傳失敗：" + err.message + "（請確認 Token 有 gist 權限）");
  }
}

async function gistPull() {
  const token = document.getElementById("g-token").value.trim();
  const gistId = document.getElementById("g-id").value.trim();
  if (!token || !gistId) { toast("請填入 Token 與 Gist ID"); return; }
  gistCfg.token = token;
  gistCfg.gistId = gistId;
  saveGistCfg();

  try {
    toast("⬇️ 同步下載中...");
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const file = data.files["customs-exam-116-progress.json"];
    if (!file) throw new Error("找不到同步檔");
    const parsed = JSON.parse(file.content);
    state.progress = {
      updatedAt: parsed.updatedAt || Date.now(),
      planDone: parsed.planDone || {},
      knownFc: parsed.knownFc || {},
      answered: parsed.answered || {},
      wrongSet: parsed.wrongSet || {},
      customNotes: Array.isArray(parsed.customNotes) ? parsed.customNotes : []
    };
    saveProgress();
    toast("✅ 已從雲端同步最新進度！");
    render();
  } catch (err) {
    toast("❌ 下載失敗：" + err.message);
  }
}

      <h3>📋 方式二：免設定「一鍵同步碼」（傳到 LINE 給自己 1 秒同步）</h3>
      <p style="font-size:0.86rem;color:var(--muted);margin:0 0 8px;">
        不想申請 Token 也沒關係！按「複製我的進度碼」貼到另一台手機／電腦的下方輸入框按「匯入」，全部打卡、閃卡、錯題與筆記立刻同步。
      </p>
      <div class="group" style="margin-bottom:10px;">
        <button class="btn btn-primary" id="btn-copy-code">📋 複製我的進度碼</button>
      </div>
      <textarea id="inp-code" placeholder="在這裡貼上從另一台裝置複製的進度碼..."></textarea>
      <div class="group" style="margin-top:8px;">
        <button class="btn btn-ok" id="btn-import-code">📥 匯入進度碼</button>
      </div>
    </div>
  `;

  document.getElementById("btn-g-push").onclick = gistPush;
  document.getElementById("btn-g-pull").onclick = gistPull;
  document.getElementById("btn-copy-code").onclick = async () => {
    try { await navigator.clipboard.writeText(syncCode); toast("✅ 已複製進度碼！貼到另一台裝置即可同步"); }
    catch (e) { document.getElementById("inp-code").value = syncCode; toast("已填入下方框中，請全選複製"); }
  };
  document.getElementById("btn-import-code").onclick = () => {
    const raw = document.getElementById("inp-code").value.trim();
    if (!raw) { toast("請先貼上進度碼"); return; }
    try {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(raw))));
      state.progress = {
        updatedAt: Date.now(),
        planDone: parsed.planDone || {},
        knownFc: parsed.knownFc || {},
        answered: parsed.answered || {},
        wrongSet: parsed.wrongSet || {},
        customNotes: Array.isArray(parsed.customNotes) ? parsed.customNotes : []
      };
      saveProgress();
      toast("✅ 匯入成功！全部進度已同步");
      render();
    } catch (e) { toast("❌ 進度碼格式無效，請確認完整複製"); }
  };
}

// ==================== MAIN RENDER & EVENTS ====================
function setTab(t) {
  if (state.tab === "video" && t !== "video") {
    mlState.playing = false;
    stopMicroLessonAudio();
  }
  state.tab = t;
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function render() {
  updateBadges();
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
  const root = document.getElementById("app");
  if (state.tab === "guides") renderGuides(root);
  else if (state.tab === "video") renderMicroLessons(root);
  else if (state.tab === "plan") renderPlan(root);
  else if (state.tab === "flashcards") renderFlashcards(root);
  else if (state.tab === "quiz") renderQuiz(root);
  else if (state.tab === "notes") renderNotes(root);
  else if (state.tab === "sync") renderSync(root);
}

document.querySelectorAll("[data-tab]").forEach(b => { b.onclick = () => setTab(b.dataset.tab); });
document.getElementById("top-sync-btn").onclick = () => setTab("sync");

loadAll();
render();
</script>
</body>
</html>
