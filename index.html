D8`（外貨進保稅倉報單）**：**洋菸酒**、**露天貨櫃（無法進倉存儲之大型／露天物品）**。\n\n---\n\n## 五、考前極速自檢清單\n- [ ] 背出最新旅客免稅額：**自用行李 NT$35,000（113/7）**、**酒 1.5 公升（114/1，18 歲）**、**捲菸 200 支（20 歲）**？\n- [ ] 背出洗錢防制 6 門檻：**臺幣 10 萬 / 人民幣 2 萬 / 外幣 1 萬美（沒入）** vs **有價證券 1 萬美 / 黃金 2 萬美 / 鑽石寶石白金 50 萬台幣（罰鍰不沒入）**？\n- [ ] 背出規費關鍵數字：特別驗貨 **1,300**、特別監視 **2,000 / 1,000 / 450**、加封 **100（50）/ 250（200）且不適用免徵減半**、押運 **600 / 1,700 / 3,700 / 4,600（限 3 車）**、鍵輸費 **現行報單 350（舊 200）**？\n- [ ] 背出保稅五區資本額（**2,000 萬 / 5,000 萬 / 1.5 億**）、自貿港區主管機關（**交通部**）、一般保倉 `D8` **無 C1**、物流中心 **`L1`（汽機車／未開放陸貨）vs `D8`（洋菸酒／露天櫃）**？\n"},{"id":"04_稅則概要_01_中華民國海關進口稅則","cat":"稅則概要","title":"中華民國海關進口稅則","md":"# 中華民國海關進口稅則【完整精讀版】\n\n\u003e **整合來源**：游欣翰講師《115 稅則概要 324 頁講義》＋陳玟茹講師《115 稅則總複習 183 頁》＋《進口貨物稅則預先審核實施辦法》（112/04/12 最新版）＋113–115 年專責報關人員考選部歷屆試題與標準答案  \n\u003e **考試權重**：本篇涵蓋《稅則概要》約 **75–80%** 配分（申論 50 分核心＋選擇 40 題之絕大多數）。  \n\u003e **實務背景備忘**：報關實務常靠系統關鍵字查稅號，但考試**禁止查表與使用計算器**，勝負關鍵在於「**總則一～七**」、「**解釋準則（GIR）1–6 適用邏輯**」、「**類註／章註排他條款**」及「**HS 2022 新增稅號**」。\n\n---\n\n## 一、稅則法律依據、顯然錯誤與稅則預先審核\n\n### 1. 短溢徵補退稅與「稅則號別顯然錯誤」三原則（關稅法 §65、施行細則 §54）\n- **補退稅期限（關 §65）**：海關短徵、溢徵或短退、溢退稅款者，應自**稅款完納（或核定退稅）之翌日起 1 年內**通知補繳或退還；**稅則號別顯然錯誤**適用之（114 選擇考點）。\n- **施行細則 §54「稅則號別顯然錯誤」認定三標準（必背！）**：\n  1. **明確貨名錯誤**：海關進口稅則之**節、目、款**之分類品目名稱已明確規範而適用錯誤者。\n  2. **明確註釋違反**：違反海關進口稅則有關**類註、章註、目註**之明確規定者。\n  3. **重複犯錯**：**同一納稅義務人**就相同貨物，經海關**稅則預先審核**或**行政救濟確定**（復查／訴願／行政訴訟確定）之稅則號別，再度申報錯誤者。\n  \u003e ⚠️ **超級考點陷阱（114 Q2）**：海關核發之「**稅則疑義解答函**」**非**屬第 3 款之顯然錯誤依據！僅限「預先審核」或「行政救濟確定」。\n\n### 2. 進口貨物稅則預先審核（關 §21＋實施辦法全條文）【115 申論第 2 題】\n| 項目 | 現行法規規定（112/04/12 修正） | 必考陷阱提示 |\n|---|---|---|\n| **申請人與時點（§2）** | 納稅義務人或其代理人，於**貨物進口前**申請（**不以初次進口者為限**，§6） | 進口「後」只能走稅則疑問解答或行政救濟，不能申請預審 |\n| **審核範圍（§3）** | 稅則號別（前 8 碼）**包括**輸出入貨品分類號列（9–10 碼，疑義時洽詢**經濟部國際貿易署**；輸入規定以國貿署訂定為準） | 含 10 碼號列，非僅前 8 碼 |\n| **遞件對象與程序（§4）** | 依海關規定格式填具申請書（**一份以申請單項貨物為限**），檢附原廠型錄、說明書或樣品，向**各關**申請 → 經**財政部關務署覆核**各關歸列意見 → 由**各關**函復 | 遞件給「各關」，由「關務署」覆核，再由「各關」函復 |\n| **應填資料（§4Ⅱ）** | 貨品名稱、生產國別、型號、規格、成分、材質、製程、主要功能、特性、用途、一次或分批進口及其他相關資料 | 申論題必列至少 6–8 項具體資料 |\n| **補件期限（§5）** | 海關書面通知送達之翌日起 **10 日內**補件；有正當理由得申請延長 **1 次**，最長不逾 **20 日** | 10 日＋延長 20 日（非 15/30 日） |\n| **不予預先審核 5 款（§6）** | ① 未依限補件或補件不全 ② **假設性或仍在設計中之虛擬性貨物** ③ 依關 §13Ⅰ（事後稽核）、§17Ⅴ（補稅/更正）、§18Ⅰ/Ⅱ（押款放行查核）處理中之**相同或類似貨物** ④ 因稅則爭議進行**行政救濟程序中**之相同或類似貨物 ⑤ **廢料**或其他經海關認定不適合預先審核之貨物 | 115 申論二核心必背！特別記住「虛擬性貨物」與「廢料」 |\n| **答復期限（§7）** | 收件或補件完成之翌日起 **30 日內**；必要時得延長 1 次，最長 **30 日**；須洽詢國際／國內機構或專家意見者，**120 日內**答復（115 Q28 必考！） | 30 日 (+30 日)；洽詢專家 **120 日** |\n| **不服之救濟（§8）** | 貨物**進口前**向**財政部關務署**申請**覆審**（30 日＋得延長 30 日）。不服覆審結果者，須俟貨物**進口並經進口地海關核定稅則號別後**，始得依關稅法申請**復查**等行政救濟 | 進口前＝「**覆審**」（向關務署）；進口後核定＝「**復查**」（向原處分海關） |\n| **變更與信賴保護（§9）** | 海關變更原預審稅則時應敘明理由書面通知；申請人舉證已訂約並進行交易且將致損失者，得申請延長原稅則適用，最長 **90 日**。惟涉及**輸入規定**者，仍依進口時規定辦理 | 稅率可展延 **90 日**；輸入規定**不可**展延 |\n| **通關效力（§10）** | C2／C3 須檢附答復函影本；C1 必要時補送。實到貨物相同者海關**應按預審號別核定**（提供錯誤／不實資料者除外） | 對海關具拘束力（非僅供參考） |\n\n---\n\n## 二、海關進口稅則總則（一～七）必背架構\n\n\u003e 💡 **陳玟茹老師總則記憶口訣**：「**一依據、二稅率、三增註、四配額、五行李郵包 5%、六最低、七新臺幣**」\n\n### 1. 總則一（法律依據與解釋準則效力）\n- 本稅則依關稅法第 3 條規定訂定，並採用世界關務組織（WCO）《國際商品統一分類制度》（HS）之解釋準則作為歸類依據。\n\n### 2. 總則二 \u0026 總則二之一（三欄稅率結構）【115 申論第 1 題、114 Q3、113 Q23】\n| 稅率欄 | 適用對象 | 關鍵實務與最新變動（113–115 年考點） |\n|---|---|---|\n| **第一欄** | **WTO 會員**、或與中華民國有**互惠待遇**之國家或地區之進口貨物 | 113 年 8 月 30 日起**東帝汶（TL）**正式成為 WTO 第 166 會員，適用第 1 欄 |\n| **第二欄** | 特定**低度開發（LDC）、開發中國家或地區**（經財政部會商有關機關報請**行政院核定**，並送**立法院查照**），或與我國簽署**自由貿易協定（FTA）／經濟合作協議**之國家或地區之**特定進口貨物**（115 Q27） | ① **FTA／協議夥伴代碼**：PA（巴拿馬）、GT（瓜地馬拉）、CN（中國大陸 ECFA 早收，須檢附產證）、NZ（紐西蘭）、SG（新加坡）、PY（巴拉圭）、SZ（史瓦帝尼）、BZ（貝里斯）、**MH（馬紹爾群島，113/08/14 生效）**\u003cbr\u003e② **總則二之一終止適用日（114 Q3、115 申論一）**：\u003cbr\u003e• 尼加拉瓜（**NI**）：**111/07/01** 起停用\u003cbr\u003e• 薩爾瓦多（**SV**）：**112/05/15** 起停用\u003cbr\u003e• 宏都拉斯（**HN**）：**112/12/06** 起停用\u003cbr\u003e③ **不丹**已自 LDC 畢業除名（113 Q23） |\n| **第三欄** | 不適用第一欄及第二欄之國家或地區（如北韓等非 WTO 且無互惠國，或無法證明原產地者） | 稅率最高 |\n| **競合原則** | 同一貨物**同時適用第一欄及第二欄**稅率時（例如自紐西蘭進口 0810.50.00 鮮奇異果，紐西蘭既是 WTO 會員又簽有臺紐經濟合作協定 ANZTEC） | **擇其較低者適用（從低課徵）**！如 115 申論一：第 1 欄 20%、第 2 欄免稅 → 適用第 2 欄「免稅」（報單附碼填 `PT` 並檢附原產地證明／聲明） |\n\n### 3. 總則三：增註 vs. 類註／章註比較【114 申論第 1 題、115 Q1、Q36】\n| 比較面向 | **類註／章註／目註** | **增註（Additional Notes）** |\n|---|---|---|\n| **法律來源** | WCO《HS 公約》國際統一規範 | 我國**國內獨有**立法，配合產業與關務政策訂定 |\n| **核心功能** | 決定貨品**歸類（分類範圍、定義、排除條款）**，依 GIR 1 具最優先拘束力 | 規定符合**特定條件／用途／主管機關證明**時之**優惠免稅或減稅**待遇（不改變 HS 6 碼大原則，而是賦予特定 8 碼優惠稅率） |\n| **稽徵代碼** | 無特定代碼 | 稽徵特別規定欄標示 **`N`**（適用增註之特定稅則號別） |\n| **實務條件** | 依貨物本身客觀性質判斷 | 多須取得**主管機關證明文件**（如經濟部、農業部、漁業署、衛福部）始得適用（115 Q1 飼料用米澱粉 `3505.10.51` 須經漁業主管機關證明；115 Q36 船用引擎零件免稅屬**第 84 章增註**） |\n\n- **必背高頻增註清單**：\n  - **Ch.22 增註 1**：專供工業用未變性酒精（經濟部證明）。\n  - **Ch.29 增註 4**：洗腎液、血液代用品（衛福部證明＋經濟部證明國內未製造）。\n  - **Ch.35 增註 1**：飼料用米澱粉 `3505.10.51`（漁業主管機關證明，115 Q1）。\n  - **Ch.70 增註 2**：半導體製程用石英玻璃製品 `7020.00.14` 稅率 1.2%。\n  - **Ch.84 增註 13 / Ch.85 增註 7 / Ch.90 增註 3**：製造業或技術服務業輸入供生產用機器設備，經經濟部證明**國內尚未製造**者免稅（**含資本租賃**方式輸入）。\n  - **Ch.84 增註（船用引擎）**：船用引擎製造工廠輸入零件、附件，經經濟部證明確供製造船用引擎者免稅（115 Q36）。\n\n### 4. 總則四：關稅配額（TRQ）16 項農產品【114 Q5】\n- 配額內適用低稅率，配額外適用高稅率（且可能觸發特別防衛措施 SSG，CR 代碼 `G`）。\n- **現行 16 項 WTO 關稅配額貨品（必背排除題！）**：\n  \u003e **食米、鹿茸、東方梨、香蕉、紅豆、液態乳、花生、大蒜、乾香菇、乾金針、椰子、檳榔、鳳梨、芒果、柚子、桂圓肉**  \n  \u003e ⚠️ **常見干擾選項**：**榴槤、蘋果、櫻桃、奇異果、茶葉**皆**非**關稅配額貨品！\n\n### 5. 總則五～七（零星物品、從低原則、幣別）\n- **總則五（零星物品 5%）**：旅客攜帶自用行李以外之零星物品，或郵包之零星物品，歸列 `9899.00.00`，統一按 **5%** 稅率課徵關稅；**但屬關稅配額貨物（總則四）除外**。\n- **總則六（稅率競合從低）**：進口貨物依本稅則及其他法令規定有兩種以上稅率可適用時，除另有規定外，**從低適用**。\n- **總則七**：本稅則所稱從量稅金額，均以**新臺幣**計算。\n\n---\n\n## 三、海關進口稅則解釋準則（GIR 1–6）深度解析與經典案例\n\n```mermaid\n%% diagram:tariff-gir\nflowchart TD\n    G1[\"GIR 1：節之貨名 + 類註/章註 (最優先)\"] --\u003e|無法單獨歸類| G2[\"GIR 2(a) 不完整/拆散貨品\u003cbr/\u003eGIR 2(b) 混合/組合物 → 導向 GIR 3\"]\n    G2 --\u003e G3A[\"GIR 3(a)：具體明確優先\u003cbr/\u003e(各僅述一部分則同等明確)\"]\n    G3A --\u003e|無法決定| G3B[\"GIR 3(b)：主要特徵原則\u003cbr/\u003e(含零售成套 3 要件)\"]\n    G3B --\u003e|無法決定| G3C[\"GIR 3(c)：從後原則\u003cbr/\u003e(取可考慮稅號位列最後者)\"]\n    G3C --\u003e|仍不適用| G4[\"GIR 4：最類似原則\"]\n    G5[\"旁支 GIR 5(a)/(b)：專用盒/重複使用鋼瓶\"] -.-\u003e G1\n    G6[\"歸目 GIR 6：同槓數比較・目註優先於章類註\"] -.-\u003e G1\n```\n\n\u003e **鐵律順序**：**準則一 → 準則二 → 準則三（甲→乙→丙）→ 準則四**，必須**依序適用**；**準則五**專管容器／包裝材料；**準則六**專管**目（Subheading）**之歸類。\n\n| 準則 | 核心規則與條文精義 | 講師經典＋113–115 年實戰案例 |\n|---|---|---|\n| **GIR 1** | 類、章、分章之標題僅供參考；歸類應以**節之貨名（稅則號別所列之貨品名稱）**及**有關之類註、章註**為準。 | ① **博士茶（國寶茶）**→ `1211.90.91` 藥用植物（不歸 1212，依 **GIR 1**，115 Q4）\u003cbr\u003e② **汽車機械工具套組（8202–8205）**→ `8206`（節名明列，直接依 **GIR 1**，115 Q2）\u003cbr\u003e③ **內燃機＋發電機組**→ `8502`（節名明列，115 Q5） |\n| **GIR 2(a)** | **不完整／未完成貨品**（已具有完整／完成貨品之主要特性者），或**未組合／拆散之貨品**，仍按完整貨品歸類。 | ① **PET 塑膠瓶胚**→ `3923.30` 塑膠瓶（已具螺紋瓶口主要特性）\u003cbr\u003e② **未切齒之齒輪毛胚**→ `8483.40` 齒輪（已接近成品形狀）\u003cbr\u003e③ **無把手玻璃鍋蓋**→ `7010.20`（或依用途歸鍋蓋）\u003cbr\u003e④ **拆散進口之電動機車**：須**同一報單**申報且具備車架＋動力／控制／輪圈等主要特性，始歸整車\u003cbr\u003e⑤ **雙系統無電熱元件熱水器**→ `8516.10` |\n| **GIR 2(b)** | 任何材料或物質之稅則號別，包含該材料與其他材料之**混合物或組合物**；超過一種材料之貨品，應依**準則三**歸類。 | 僅為「過渡橋樑」，引導進入 GIR 3。 |\n| **GIR 3(a)** | **具體明確優先於一般性說明**。但若各節僅述及混合物／零售成套貨品之一部分，視為**同等具體明確**，須改進 3(b)。 | ① **電動刮鬍刀**（8467 手提工具 vs 8509 家用電動用具 vs **8510** 刮鬍刀）→ **`8510`**（115 申論三(一)）\u003cbr\u003e② 汽車專用橡膠地墊 → 優先歸 `4016` 或車用配件視節名明確性而定 |\n| **GIR 3(b)** | **主要特徵原則**：混合物、不同材料組合物、**供零售之成套貨物**，按構成**主要特徵**之材料或組件分類。\u003cbr\u003e📌 **零售成套 3 要件**：① 至少 2 種表面可歸不同節貨品 ② 配合滿足**特定需要或執行特定活動** ③ **適合直接零售包裝**不需再包裝。 | ① **皮革掌心＋紡織手背手套** → 掌心、手指下側、拇指及食指（握持耐磨功能）為皮革，構成主要特徵，依 Ch.42 註四歸 **`4203`**（115 申論三(二)）\u003cbr\u003e② **Nutella 隨手杯**（巧克力醬＋餅乾棒）→ `1806.90.99`\u003cbr\u003e③ **附 USB 充電 LED 壁燈** → `9405.11`；**具燈光/無線充電/藍牙喇叭之木製咖啡桌** → `9403.60.90`（115 Q21）\u003cbr\u003e④ **數位智能筆** → `8471.60`；**測速雷射攝影機** → `9029.20`；**含框玻璃淋浴間** → `7020.00.99`\u003cbr\u003e❌ **非零售成套（須分別歸類）**：鴨肝＋培根罐頭組（非單一菜餚必備）、咖啡粉＋陶瓷杯碟、手錶＋皮夾禮盒（無共同特定活動） |\n| **GIR 3(c)** | **從後原則**：無法依 3(a) 或 3(b) 分類時，歸入可予考慮之稅則號別中**位列最後者**。【114 申論第 3 題、115 申論三(三)】 | ① **髮刷（9603）＋髮梳（9615）＋化粧鏡（7009）零售組合** → 皆為整理儀容工具、無單一主要特徵，取最後者 **`9615`**（115 申論三(三)）\u003cbr\u003e② **瓦斯—電聯合加熱家用烤箱**（7321 vs 8516）→ **`8516`**（115 Q40）\u003cbr\u003e③ **除霜清潔劑**→ `3820`；**GPS 運動錶**→ `9102`；**檯燈化粧鏡**→ `9405`；**防彈盾牌**→ `6914.90.90`；**海陸便當**（肉 1602＋魚 1604）→ `1604` |\n| **GIR 4** | **最類似原則**：無法依準則 1–3 分類者，歸入與其**最類似**之貨品號別（實務極少使用，如早期尚未列目之新型電子載具）。 | 僅當 GIR 1–3 全不適用時始得援用。 |\n| **GIR 5(a)** | **專用容器**（如照相機盒、樂器盒、槍套、項鍊盒）同時符合 **5 要件**（① 特殊造型密合 ② 適合長期使用 ③ 與所裝物品同時報運 ④ 正常一併出售 ⑤ **不具整體主要特徵**）→ **併入所裝物品歸類**。 | ❌ **例外（具主要特徵須拆開）**：茶葉裝於**純銀茶罐**、巧克力裝於**純金心型盒** → 分別歸類！ |\n| **GIR 5(b)** | **一般包裝材料與容器**：與貨物同時報運且屬正常包裝者併入貨物歸類；**但明顯適於重複使用者除外**。 | **已填裝 CO₂（2811）之可重複使用不銹鋼鋼瓶（7311）** → **分別歸列 2811 及 7311**（115 Q32 必考！若為一次性拋棄式小氣瓶則併入氣體） |\n| **GIR 6** | **目（Subheading）之歸類**【114 申論第 2 題】：比照準則 1–5 辦理，惟限於**同一位階（相同「－」槓數）之目**始得相互比較；且**目註優先於章註及類註**（除另有規定外）。 | ① **鉛水晶煙灰缸** → 先歸 7013 節，再於單槓目間比較，歸 `7013.91`（114 申論二）\u003cbr\u003e② **第 71 章「鉑」定義**：章註四(乙)稱「鉑」包含鉑、銥、鋨、鈀、銠、釕六元素；但目註二限定 7110.11/19 之「鉑」不含其他五元素 → 歸目時依**目註二優先**！ |\n\n---\n\n## 四、21 類 97 章高頻排他規則、比例門檻與 HS 2022 新增稅號總表\n\n\u003e 📌 本節濃縮游欣翰 324 頁＋陳玟茹 183 頁＋113–115 年考題中**最常考的跨章陷阱與排他註釋**，請搭配口訣反覆熟讀！\n\n### 1. 第 1–4 類：農漁牧與調製食品（第 1–24 章）\n- **第 3 章（水產）**：\n  - 燻製水產無論燻製前或燻製中是否烹煮均歸 Ch.3；**帶殼**經蒸或水煮之甲殼類歸 `0306`（去殼水煮歸 `1605`）。\n  - **HS 2022 新增 `0309`**：適於人類食用之魚、甲殼類、軟體動物粉、細粒及團粒。\n- **第 4 章（乳蛋蜜／昆蟲）**：\n  - **HS 2022 新增 `0410.10`**：食用**昆蟲**（蟋蟀粉等）。\n  - **乳清蛋白分離物陷阱（115 Q10）**：單純乳清蛋白濃縮物乾重 **\u003e 80%** 歸 `3502`（白蛋白），≦ 80% 歸 `0404`；但若**添加肌酸、香料**調配供沖泡之高蛋白營養補給品 → 歸 **`2106`**（未列名食物調製品）！\n- **第 7 / 11 / 19 / 20 章（馬鈴薯加工光譜 — 必考！）**：\n  - 生鮮 `0701` → 冷凍 `0710` → 單純脫水粉/細片 `1105` → 冷凍預炸薯條 `2004` → 未冷凍洋芋片／**馬鈴薯粉 65%＋麥芽糊精 15% 調製馬鈴薯泥粉** `2005`（115 Q19！）→ 以馬鈴薯粉為原料之調製麵團 `1901` → 膨發／烘烤馬鈴薯脆餅 `1905.90`。\n- **第 8 / 20 章（加味果實）**：\n  - 單純鮮／乾檳榔歸 Ch.8（0802.80）；**咖啡香料風味之加味檳榔**已超出 Ch.8 許可加工，歸 **第 20 章**（115 Q8）。\n- **第 9 / 12 章（香料與草本茶）**：\n  - Ch.9 **不同節**香料混合一律歸 `0910`（如咖哩粉）；**芥末粉**歸 `2103`（非 Ch.9）。\n  - **博士茶（國寶茶 Rooibos）**歸 `1211.90.91`（113 年關務署歸類令，115 Q4）。\n- **第 16 章（肉魚調製 \u003e 20% 規則）**：\n  - 凡含香腸、肉、雜碎、血、昆蟲、魚、甲殼類或軟體動物**合計重量超過 20%** 之食物調製品歸 Ch.16；**但明確排除**：`1902` 夾餡麵食（水餃、餛飩、義大利餃）、`2103` 調味醬、`2104` 湯類！\n- **第 17 / 35 章（糊精 10% 門檻）**：\n  - 還原糖含量（以乾重計）**≦ 10%** 之糊精歸 `3505`；**\u003e 10%** 歸 `1702`。\n- **第 18 章（可可霸王條款與 8 大排除）**：\n  - `1806` 涵蓋所有含可可食品，**但 Ch.18 註一排除 8 大類（即使含可可也不歸 1806）**：`0403` 優酪乳、`1901`（全脫脂可可 \u003c 40% 或乳品基底 \u003c 5%）、`1904` 膨化穀類（≦ 6% 可可）、`1905` 烘焙糕餅（未完全披覆巧克力）、`2105` **冰淇淋（不論是否含可可！如 115 Q18 馬卡龍夾巧克力冰淇淋月餅 → `2105`）**、`2202/2208` 飲料、`3003/3004` 藥品。\n- **第 22 章（酒精門檻）**：\n  - 酒精濃度 **≦ 0.5%** 之無酒精啤酒歸 `2202.91`；**\u003e 0.5%** 歸 `2203`。\n- **第 24 章（HS 2022 超級大熱門：`2404` 新興菸品！）**：\n  - `2404.11`：**加熱菸**（含菸葉以非燃燒方式吸入，115/2/1 輸入規定由 501 修正為 516，115 Q3）。\n  - `2404.12`：含尼古丁之**電子煙油**（輸入規定 `111` 管制輸入）。\n  - `2404.91` / `2404.92`：口服（口嚼錠）／皮膚吸收（尼古丁貼片）。\n  - ⚠️ **電子煙載具／霧化加熱裝置本體**歸 **`8543.40`**（非 2404！）。\n\n### 2. 第 5–11 類：礦產、化工、塑橡膠、紡織（第 25–63 章）\n- **第 25 vs. 68 章（石材加工界線）**：\n  - 僅粗鑿／鋸成矩形塊之大理石歸 `2515`；經**拋光、磨光、雕琢**之大理石歸 `6802`。\n  - 矽灰歸 `2811.22.90`；以塑膠基材塗佈磨料之**探針卡清潔片**歸 **`6805`**（研磨料製品，115 Q12）；石墨製鍋爐視鏡墊片歸 **`6815.19.00`**（第 16 類註一排除非電氣用石墨製品，115 Q14）。\n- **第 29 章（有機化學品排除）**：\n  - 排除**乙醇（2207）**、**甲烷與丙烷（2711）**、**尿素（3102）**。\n- **第 30 vs. 38 章（HS 2022 重大移列：`3822`！）**：\n  - **HS 2022 將診斷試劑、血型試藥全面移入 `3822`**，第 30 章註一明確排除 `3822`（114 Q8）。\n  - **微生物培養物滅菌快速判讀指示劑（玻璃安瓿）** → 屬微生物培養物，歸 **`3002.49.00`**（115 Q16）。\n  - **無菌容器內供移植用骨** → 歸 **`3001.90`**（非 9021 整形用具！115 Q17）。\n- **第 33 vs. 34 章（精油、面膜、濕紙巾必考區分！）**：\n  - 零售包裝**純精油**（未稀釋／無其他化粧品添加物）歸 **`3301`**（非 3307）。\n  - 浸漬**化粧品／保養液**之不織布面膜 → **`3307.90`**。\n  - 浸漬**肥皂或界面活性清潔劑**之不織布柔濕巾 → **`3401.11.00`**（115 Q20 必背！）。\n- **第 39 / 40 章（塑橡膠常考件）**：\n  - 普魯蘭膠／鹿角菜膠**食品用空膠囊** → `3923.90.90`（115 Q15）。\n  - 塑膠**洗鼻器＋洗鼻鹽組** → `3924.90.00`（塑膠衛生盥洗用具，非 9018 醫療儀器！115 Q11）。\n  - 硫化天然橡膠**麻醉呼吸袋** → **`4016.95.00`**（其他可充氣之硫化橡膠製品，Ch.90 註一(甲)排除 4016，115 Q6）。\n  - 硫化橡膠**牙科橡皮障** → **`4014.90.90`**（硫化橡膠製衛生及醫藥用品，115 Q24）。\n- **第 11 類（紡織品 Ch.50–63 三大鐵律）**：\n  1. **混紡歸類原則（第 11 類註二）**：按**重量最大**之紡織材料歸類；**⚠️ 關鍵陷阱：第 54 章（人造絲）與第 55 章（人造短纖）在計算比重時必須「視為同一章」加總計算！**（例如：棉 40%＋聚酯長絲 35%＋尼龍短纖 25% → 54+55 合計 60% \u003e 棉 40%，須歸 54 或 55 章，再比較 54 vs 55 取大者 54 章！）\n  2. **無塵室濾網／工業用紡織濾布**：歸 **`5911`**（第 16 類註一(戊)排除 5911 工業用紡織品，故**不歸 8421**！）。\n  3. **第 11 類註十五（智慧紡織品）**：內嵌電子元件之成衣／紡織品仍維持紡織品歸類。\n\n### 3. 第 13–15 類：陶瓷、珠寶、卑金屬（第 68–83 章）\n- **第 69 章（陶瓷）**：須先成形再**燒製 ≥ 800℃**；瓷器 vs 陶器界線＝**吸水率 0.5%**（瓷 \u003c 0.5%）。\n- **第 71 章（珠寶 vs 仿首飾）**：\n  - **珊瑚製耳環（無貴金屬）**：珊瑚屬 `9601` 動物雕刻材料，非寶石亦非珍珠，製成耳環歸 **`7117` 仿首飾**（115 Q33！）。\n- **第 15 類註二「一般用零件（Parts of General Use）」超級必考！**：\n  - 凡屬於 **`7307`（管子配件）、`7312`（鋼索）、`7315`（鏈）、`7317`（釘）、`7318`（螺絲螺帽墊圈）**、卑金屬製**彈簧（7320）**、**`8301`（鎖）、`8302`（金屬配件／鉸鏈）、`8306`（鈴）、`8308`（搭扣）、`8310`（標誌牌）**，即使專為機器或車輛設計，**一律歸入第 15 類本身號列**，**不得**歸入第 16 類（機械電機）或第 17 類（車輛船舶）！\n  - ⚠️ **常考對照**：`8481`（栓塞、旋塞、閥）**非**一般用零件！但 `8301` 機動車輛用鎖屬一般用零件，**不歸** Ch.87（115 Q34）。\n- **第 73 / 82 章高頻品項**：\n  - `7308`：固定式倉儲貨架、路燈桿（結構物）。\n  - `7309`：容量 **\u003e 300 公升**鋼鐵製貯槽（僅配龍頭、閥、液位計、壓力計而**無機械或熱力設備**者，仍歸 `7309`，115 Q31）。\n  - `8207`：金屬沖壓模（互換工具）。\n\n### 4. 第 16–18 類：機械、電機、車輛、光學醫療（第 84–92 章）\n- **第 16 類註二「機器零件歸類三原則」**：\n  - **(甲) 專屬列明優先**：零件本身已為 Ch.84/85（除少數通用零件節外）明確列名者，直接歸入該節（例：電動汽車馬達歸 `8501`，非 Ch.87）。\n  - **(乙) 專用／主要用零件**：專供或主要供特定機器使用者，隨該機器歸類（例如 8473、8529）。\n  - **(丙) 通用零件兜底**：不屬上述者，歸入 `8487`（非電氣）或 `8548`（電氣）。\n- **第 84 vs. 85 章常考區分（115 Q35 必考！）**：\n  - **歸第 84 章（雖用電，但以機械／熱交換為主）**：**電風扇（`8414`）**、**電冰箱（`8418`）**、**縫紉機（`8452`）**、ATM 自動櫃員機（`8472`）、**一次性血液透析器（`8421` 液體過濾淨化機具，115 Q30 大魔王！）**。\n  - **歸第 85 章（電氣特性為主）**：**電鈴（`8531`，115 Q35 正解）**、離岸風力發電機組（`8502.31`）。\n  - **第 84 章註十一(丙) 半導體製造與搬運**：專供或主要供升降、搬運、裝卸晶柱／晶圓／半導體裝置／平面顯示器之機器 → 歸 **`8486`**（不歸 8428 搬運機！115 Q13）。\n- **HS 2022 機電／航空五大全新必考稅號**：\n  | HS 2022 新號列 | 貨品名稱與考試重點 |\n  |---|---|\n  | **`8485`** | **積層製造機器（3D 列印機）**（依材料分金屬、塑膠、陶瓷等目） |\n  | **`8517.13`** | **智慧型手機（Smartphones）**獨立列目 |\n  | **`8524`** | **平面顯示模組（FPD Modules）**（液晶／OLED 面板模組；專用零件歸 `8529`） |\n  | **`8539.51` / `.52` / `8541.41` / `9405`** | **LED 四層必辨**：LED 發光二極體元件（單顆晶片）=`8541.41`；LED 模組=`8539.51`；LED 燈泡／燈管=`8539.52`；完整 LED 燈具=`9405` |\n  | **`8549`** | **電子及電氣廢料及碎屑（E-waste）**獨立成節 |\n  | **`8806`** | **無人機（Unmanned Aircraft / Drones）**；⚠️ **排除純供娛樂目的設計之空拍機／玩具無人機 → 歸 `9503`**（115 Q39 必考！） |\n- **第 87 章（車輛零件陷阱 — 115 Q34）**：\n  - ✅ 屬於 Ch.87 零件：`8708.70` 含胎車輪、**機動車輛用安全氣囊含充氣系統**（`8708.95`，115 Q34 正解）。\n  - ❌ 排除於 Ch.87 外：車用鎖（`8301`）、電動車馬達（`8501`）、**機動車輛用座物（`9401.20`）**！\n- **第 90 章（醫療與光學儀器陷阱）**：\n  - 與電腦（ADP）連線以處理呈現臨床資料之診斷器具 → 歸 **`9018`**（Ch.84 註六(戊)排除執行特定功能之機器，115 Q22）。\n  - **牙科治療椅大陷阱（115 Q23）**：單純牙科用椅歸 `9402.10`；但**裝有牙科用儀器（用具）之牙科治療椅** → 歸 **`9018.49.10`**！\n  - `9021`（整形用具／植入體內彌補缺陷）：包含人造牙齒、人造關節、心律調整器、齒列矯正器、植入式結紮夾；**不包含**無菌容器內供移植用骨（`3001.90`，115 Q17）。\n  - `9032.89`：伺服控制器（113 年關務署歸類令）。\n\n### 5. 第 20 類：家具、玩具、雜項（第 94–96 章）\n- **第 94 章（座物與家具）**：\n  - **可拆式塑膠便盆＋軟墊不銹鋼架馬桶椅** → `9401.71.00`（金屬構架套襯座物，115 Q7）。\n  - **嬰兒座物（附懸掛玩具拱環）** → `9401` 座物（非 9503 玩具！115 Q37）。\n  - **具燈光／磁吸充電／藍牙喇叭之木製咖啡桌** → `9403.60.90`（主要特徵為木製家具，115 Q21）。\n- **第 95 章（玩具與運動器材）**：\n  - **羽毛球** → `9506.99.00`（其他運動用品，**非** `9506.69` 其他球！115 Q9 經典陷阱）。\n  - **娛樂用空拍機組** → `9503`（非 `8806` 無人機，115 Q39）。\n- **第 96 章（雜項製品）**：\n  - `9609`（鉛筆、蠟筆、粉筆）：包含**石筆（天然或凝集板石製，115 Q38）**；**排除**醫療鉛筆（`3004`）、眉筆／化粧用筆（`3304`）、撞球用止滑粉塊（`9504`）。\n\n---\n\n## 五、114–115 年申論題實戰擬答範本\n\n### 範例 1（115 年申論第 3 題）：解釋準則三實戰應用\n- **(一) 電動刮鬍刀**：歸列 **第 8510 節**。理由：依 **解釋準則三（甲）**，稅則號別所列貨品名稱說明較具體明確者優先於一般性說明。相較於 8467（手提工具）與 8509（家用電動用具），8510 已明確列明「刮鬍刀……裝有電動機者」，最具體明確。\n- **(二) 皮革與紡織材質組合手套**：歸列 **第 4203 節**。理由：4203（併 Ch.42 註四涵蓋手套）與 6116 各僅述及組合物所含材料之一部分，依 **準則三（甲）後段** 具同等具體明確性，須依 **準則三（乙）** 按構成主要特徵之材料歸類。本手套之掌心、手指下側、拇指及食指等主要接觸、抓取與防磨部位均為皮革製成，足見皮革賦予其主要特徵，故歸 4203 節。\n- **(三) 髮刷（9603）、髮梳（9615）及化粧鏡（7009）零售包裝組合**：歸列 **第 9615 節**。理由：本貨品由不同節貨品配合滿足個人理容之特定活動且供直接零售，屬零售成套貨物。惟各節僅述及其中一項，依準則三（甲）同等具體明確；且三項物品於理容功能上均具重要性，無法決定單一組件構成主要特徵（準則三（乙）不適用），故依 **準則三（丙）** 從後原則，於 7009、9603、9615 中擇位列最後之 **第 9615 節**。\n\n---\n\n## 六、考前極速自檢清單\n- [ ] 能不看書背出總則一～七口訣，以及 **NI（111/7/1）、SV（112/5/15）、HN（112/12/6）** 停用日期與 16 項關稅配額？\n- [ ] 能完整寫出「稅則號別顯然錯誤」3 款、稅則預審「不予預審」5 款，及 **10/20/30/120/90 日** 期限？\n- [ ] 遇到複合／成套貨品時，會依序檢查 **GIR 1 → 2(a) → 3(a) → 3(b) 零售三要件 → 3(c) 從後 → 5(a)/(b) → 6 同槓比較**？\n- [ ] 熟記 **HS 2022 六大新稅號**（`2404`、`3822`、`8485`、`8517.13`、`8524`、`8549`、`8806`）與 **115 年最新陷阱題**（血液透析器 8421、牙科治療椅裝儀器 9018、羽毛球 9506.99、珊瑚耳環 7117、麻醉呼吸袋 4016.95）？\n"},{"id":"04_稅則概要_02_輸出入貨品分類表合訂本","cat":"稅則概要","title":"輸出入貨品分類表合訂本","md":"# 中華民國輸出入貨品分類表合訂本【完整精讀版】\n\n\u003e **整合來源**：游欣翰講師《115 稅則概要》＋陳玟茹講師《115 稅則總複習》＋劉兆富講師《115 報關手冊》＋財政部關務署／經濟部國際貿易署最新合訂本規定＋113–115 年歷屆試題  \n\u003e **考試權重**：本篇同時橫跨《稅則概要》（約 **20–25%**）與《通關實務概要》（如 115 通關實務申論第 1 題直接考 `B01、F01、MW0`），投資報酬率極高！\n\n---\n\n## 一、合訂本結構、HS 2022 統計數據與主管機關\n\n### 1. 主管機關與權責分工（115 稅則 Q3、Q25 必考！）\n- **合訂本共同主管機關**：**財政部**（實務由關務署辦理前 8 碼海關進口稅則）及 **經濟部國際貿易署**（負責第 9–10 碼貨品分類號列與輸入／輸出規定）（115 Q25 正解）。\n- ⚠️ **高頻考點陷阱（115 Q3）**：例如 115 年 2 月 1 日起將加熱菸 `2404.11.00.00-5` 之輸入規定代號由 `501` 修正為 `516`，**增修「輸入規定代號」之主管業務機關為「經濟部國際貿易署」**（雖然 `5xx` 簽審文件本身由衛生福利部核發，但貨品分類表之輸入規定公告增修權責在國際貿易署！）。\n\n### 2. 11 碼貨品分類號列（CCC Code）解剖圖\n\n```mermaid\n%% diagram:tariff-ccc\nflowchart LR\n    C1[\"前2碼：章 (98章)\"] --\u003e C2[\"3-4碼：節 (1,228節)\"]\n    C2 --\u003e C3[\"5-6碼：目 (5,612目)\u003cbr/\u003eWCO 國際統一 HS 6碼\"]\n    C3 --\u003e C4[\"7-8碼：款 (9,335款)\u003cbr/\u003e財政部海關進口稅則 8碼\"]\n    C4 --\u003e C5[\"9-10碼：統計碼 + 11碼檢查碼\u003cbr/\u003e經濟部國貿署輸出入規定\"]\n```\n```text\n  02      06      49       20        00     -    1\n [章]    [節]    [目]     [款]     [統計碼]    [檢查碼]\n ├─── HS 國際統一 6 碼 ───┤\n ├───── 海關進口稅則 8 碼 ─────┤\n ├──────── 中華民國輸出入貨品分類號列 10 碼 ────────┤\n ├─────────────── 完整 CCC Code 11 碼 ───────────────┤\n```\n- **前 2 碼（章 Chapter）**：共 97 章（HS 國際標準，第 77 章留空）＋我國自設 **第 98 章**（關稅配額、零星物品 `9899` 等）＝ **98 章**。\n- **前 4 碼（節 Heading）**：決定歸類之第一順位（GIR 1）。\n- **前 6 碼（目 Subheading）**：WCO 全球統一碼，歸類受 GIR 6 拘束。\n- **前 8 碼（款 Division）**：我國《海關進口稅則》稅則號別，**稅率決定單位**，由立法院三讀通過。\n- **第 9–10 碼（統計碼）**：經濟部國際貿易署依貿易統計與簽審管理需要增設。\n- **第 11 碼（檢查碼 Check Digit）**：電腦檢核輸入有無筆誤用。\n\n### 3. HS 2022 版官方統計數據（113 Q38 必背數字！）\n| 層級 | WCO 國際 HS 2022 標準 | 我國海關進口稅則（2022 版現行） |\n|---|---|---|\n| **類（Section）** | **21 類** | **21 類** |\n| **章（Chapter）** | **97 章**（第 77 章保留空章，實為 96 章） | **98 章**（含第 98 章特設章） |\n| **節（Heading，4 碼）** | **1,228 節** | 1,228 節（＋98 章若干節） |\n| **目（Subheading，6 碼）** | **5,612 目** | 5,612 目 |\n| **款（Division，8 碼）** | — | **9,335 款** |\n\n---\n\n## 二、稽徵特別規定（CR 欄）代碼全表【每年必考 1–3 題！】\n\n\u003e ⚠️ **必殺陷阱（115 Q26）**：許多考生把 **`B`** 與 **`C`** 搞反！請用英文聯想記憶：**`B` = Beer（酒稅）**、**`C` = Cigarettes（菸稅及菸品健康福利捐）**、**`T` = Tax / 貨物稅（Commodity Tax）**！\n\n| 代碼 | 完整法定意義 | 記憶法與最新修法提示 |\n|---|---|---|\n| **`R`** | 應徵**特別關稅**（反傾銷稅、平衡稅、報復關稅等）或與反傾銷相關註記 | **R**etaliatory / 救濟特別稅 |\n| **`T`** | 應徵**貨物稅** | **T**ax（確定應課貨物稅） |\n| **`T*`** | **部分**應徵貨物稅（該稅號下僅部分貨品符合貨物稅條例課稅範圍） | 📌 **114/12/30 貨物稅條例修正重點**：已取消**彩色電視機、錄影機、電唱機、錄音機**等電器類貨物稅，且無添加糖飲料品亦納入免徵範圍，實務上對應稅號陸續移除 `T`/`T*` |\n| **`N`** | 適用**增註**之特定稅則號別（115 Q1） | Additional **N**ote（須附主管機關證明） |\n| **`B`** | 應徵**酒稅** | **B**eer / Beverage（酒精飲料） |\n| **`B*`** | **部分**應徵酒稅（如料理酒或部分含酒精製品視性質課徵） | 部分酒稅 |\n| **`C`** | 應徵**菸稅及菸品健康福利捐**（115 Q26 正解！） | **C**igarettes（菸品＋健康捐） |\n| **`L*`** | 部分應徵**特種貨物及勞務稅（奢侈稅 10%）**（如完稅價格＋稅費達 300 萬元以上之小客車、遊艇、飛機、龜殼、玳瑁、珊瑚、象牙、毛皮等） | **L**uxury Tax（奢侈稅） |\n| **`Z`** | 屬**免徵營業稅**貨品（如未經加工之生鮮農林漁牧產物副產物、金條金塊等） | **Z**ero VAT（免營業稅） |\n| **`G`** | 採取**特別防衛措施（SSG）**（針對 WTO 關稅配額農產品進口量暴增或價格暴跌時加徵額外關稅） | Safe**G**uard |\n| **`D*`** | 部分進口貨物涉及**外銷品沖退原料稅**相關特別規定（或依特定基準辦理） | **D**rawback |\n\n---\n\n## 三、輸入規定代碼（Import Regulations）完整分類表\n\n\u003e 📌 **115 年《通關實務概要》申論第 1 題（10 分）**直接問：`02064920001` 冷凍豬肉骨輸入規定為 `B01、F01、MW0`，請說明各代碼意義！可見輸出入規定代碼不只是選擇題，更是**申論必考題**！\n\n### 1. 貿易管制與大陸物品規定（數字 1xx、M 開頭）\n| 代碼 | 主管機關 | 完整意義 | 考點提示 |\n|---|---|---|---|\n| **`111`** | 經濟部國貿署 | **管制輸入**（除專案核准外不准輸入，如保育類、特定武器、含尼古丁電子煙油 `2404.12`） | 最嚴格管制 |\n| **`121`** | 經濟部國貿署 | 由貿易署**簽發輸入許可證**（原則需證） | 121＝貿易署簽證 |\n| **`122`** | 簽審機關 | 由**委託簽證單位**簽發輸入許可證 | 與 121 區分 |\n| **`MW0`** | 經濟部國貿署 | **大陸物品不准輸入**（115 通關實務申論一！） | **M**ainland **W**ithheld (0) |\n| **`MP1`** | 經濟部國貿署 | **大陸物品有條件准許輸入**，應符合「大陸物品有條件准許輸入項目、輸入管理法規彙總表」之規定（列有特別規定 `MXX` 代號者須向貿易署申請輸入許可證；未列者免證） | **M**ainland **P**artial (1) |\n| **`M01`–`M99`** | 經濟部國貿署 | 大陸物品特定項目之特別管理條件（搭配 `MP1` 使用） | 如少量免證例外詳見報關手冊 |\n\n### 2. 檢疫、檢驗與食藥署邊境查驗（英文字母開頭 — 最高頻！）\n| 代碼 | 主管機關 | 完整意義 | 記憶口訣 |\n|---|---|---|---|\n| **`A01` / `A02`** | 經濟部國貿署／主管機關 | 與特定配額／輸入規定相關（或農漁畜產品輸入管制，須依貨品表註明；實務 `A02` 亦見特定農產） | 依貨表註記 |\n| **`B01`** | **農業部動植物防疫檢疫署** | 進口時，應依農業部動植物防疫檢疫署編訂之「**應施檢疫動植物品目表**」及有關檢疫規定辦理（115 通關實務申論一！） | **B**io-quarantine（動植物檢疫） |\n| **`C01`** | **經濟部標準檢驗局** | 經濟部標準檢驗局公告**應施進口檢驗商品** | **C**ommodity inspection（BSMI 商檢） |\n| **`C02`** | **經濟部標準檢驗局** | 本項下**部分商品**屬於經濟部標準檢驗局公告應施進口檢驗商品 | 部分應施商檢 |\n| **`F01`** | **衛生福利部食品藥物管理署（TFDA）** | 輸入商品應依照「**食品及相關產品輸入查驗辦法**」規定，向衛生福利部食品藥物管理署申請辦理**輸入查驗**（115 通關實務申論一！） | **F**ood（食品輸入查驗） |\n| **`F02`** | **衛福部食藥署** | 本項下進口商品如屬**食品、食品添加物、食品器具、食品容器或包裝**等用途者，應向食藥署申請輸入查驗（報關時商標欄不得空白，且須填用途代碼 1–4） | 部分用途為食品（須填用途碼） |\n| **`F03`** | **衛福部食藥署** | 特定食品／農產品（如中藥材或特定高風險食品）須依食藥署規定辦理查驗 | 食品相關查驗 |\n| **`H01`** | **衛福部（食藥署／中醫藥司）** | 衛生福利部公告**應施輸入查驗中藥材**，應憑衛福部食藥署核發之輸入許可通知進口（115 稅則 Q29 正解！） | **H**erbs（中藥材輸入查驗） |\n| **`H02`** | **衛福部** | 本項下部分商品屬應施輸入查驗中藥材 | 部分中藥材 |\n| **`W01`** | **財政部國庫署** | 輸入**菸酒**（或未變性酒精）應檢附財政部核發之菸酒進口業許可執照影本或財政部同意文件 | **W**ine（菸酒管理） |\n\n### 3. 各部會專業簽審代碼（數字 4xx、5xx、6xx）\n| 代碼區間 | 主管機關 | 代表性必考代碼 |\n|---|---|---|\n| **`401`–`406`** | **農業部**（農糧、漁業、畜牧、林保等） | `401` 農業部同意文件、`402` 飼料輸入登記證、`403` 農藥許可證、`404` 動物用藥品、`406` 肥料登記證 |\n| **`462`–`467`** | **財政部關務署**（關稅配額證明書） | `462` 應檢附財政部（臺灣銀行代辦）核發之**關稅配額證明書**（配額內稅率）；未附者按配額外高稅率課徵 |\n| **`501`–`522`** | **衛生福利部**（藥品、醫療器材、化粧品、菸品） | • `501` 進口**人用藥品**（須附藥品許可證影本及核准函）\u003cbr\u003e• `503` 進口**原料藥**（限藥廠或藥商）\u003cbr\u003e• `504` 進口**醫療器材**（須附醫療器材許可證或登錄字號）\u003cbr\u003e• `505` **中藥製劑／藥品**\u003cbr\u003e• `516`（115/2/1 新增適用加熱菸 `2404.11` 取代原 `501`，115 Q3）\u003cbr\u003e• `522` **管制藥品**（須附食藥署管制藥品輸入同意書） |\n| **`550`–`555`** | **環境部**（資源循環署／化學物質管理署） | • `550` 事業廢棄物／再生資源同意文件\u003cbr\u003e• **`553` 毒性及關注化學物質**（環境部核准文件 — 高頻必考！） |\n| **`581`** | **核能安全委員會（原原能會）** | 放射性物質或可發生游離輻射設備同意文件 |\n| **`602`** | **國家通訊傳播委員會（NCC）** | **電信管制射頻器材**（藍牙、Wi-Fi、手機、無線遙控器等）進口核准證或型式認證證明 |\n| **`641`** | **內政部警政署** | 警械、刀械、模擬槍等同意文件 |\n\n\u003e 🚨 **「其他相關輸入規定」超級必考條款（游欣翰講師強調！）**：  \n\u003e **凡輸入「人用藥品」，不論其歸列之貨品分類號列（CCC Code）是否列有 `501`、`503`、`505` 代號，均應一律依照 `501`、`503`、`505` 規定向衛生福利部辦理查驗／檢附許可證！**（例如某些歸列第 21 章營養品或第 30 章以外稅號但實質屬藥品者，仍受此條款拘束。）\n\n---\n\n## 四、輸出規定代碼（Export Regulations）精要\n| 代碼 | 主管機關 | 完整意義 |\n|---|---|---|\n| **`111`** | 經濟部國貿署 | **管制輸出**（除專案核准外不准輸出） |\n| **`121`** | 經濟部國貿署 | 應由國際貿易署簽發**輸出許可證** |\n| **`S01` / `S02`** | 經濟部國貿署 | **戰略性高科技貨品（SHTC）**輸出管制（含瓦聖納協定軍商兩用清單；出口至管制地區或列管貨品須取得 SHTC 輸出許可證，連**三角貿易**與**保稅區復出口**亦不豁免！） |\n| **`B01`** | 農業部防檢署 | 輸出應施檢疫動植物（如特定苗木、活體動物） |\n| **`441` / `442`** | 農業部／林保署 | 保育類野生動物、CITES 瀕臨絕種動植物輸出許可（報單須申報**學名＋俗名**並於申請審驗方式填 `8`） |\n| **`522` / `525`** | 衛福部 | 管制藥品、人體器官／血液等輸出同意文件 |\n| **`531`** | 環境部 | 有害事業廢棄物（巴塞爾公約）輸出許可 |\n| **`561`–`565`** | 經濟部／文化部／海委會 | 古物、珍貴文書、特定砂石或資源輸出管制 |\n\n---\n\n## 五、115 年實戰申論示範（跨科通吃！）\n\n### 範例（115 年《通關實務概要》申論第 1 題，10 分）\n\u003e **題目**：進口冷凍豬肉骨（`02064920001`），輸入規定為「`B01`、`F01`、`MW0`」，請說明各輸入規定代碼之意義。\n\n**高分標準擬答**：\n1. **`B01`（動植物檢疫規定）**：進口時，應依**農業部動植物防疫檢疫署**編訂之「應施檢疫動植物品目表」及有關檢疫規定辦理（冷凍豬肉骨屬動物產品，須辦理動物檢疫並檢附輸出國官方動物檢疫證明書）。\n2. **`F01`（食品輸入查驗規定）**：輸入商品應依照「**食品及相關產品輸入查驗辦法**」規定，向**衛生福利部食品藥物管理署**申請辦理輸入查驗（經查驗合格核發輸入許可通知後，始准放行）。\n3. **`MW0`（大陸物品輸入管制規定）**：**大陸物品不准輸入**（該貨品如原產地為中國大陸，除經經濟部國際貿易署專案核准者外，一律禁止輸入）。\n\n---\n\n## 六、考前極速自檢清單\n- [ ] 能立刻區分 `B`/`B*`（酒稅）、`C`（菸稅＋健康捐）、`T`/`T*`（貨物稅）、`N`（增註）、`G`（特別防衛措施）、`L*`（奢侈稅）、`Z`（免營業稅）？\n- [ ] 能背出 HS 2022 統計數據：**21 類、97 章（我國 98 章）、1,228 節、5,612 目、9,335 款**？\n- [ ] 知道合訂本共同主管機關是「**財政部及經濟部國際貿易署**」，且**增修輸入規定代號**屬**經濟部國際貿易署**業務？\n- [ ] 能默寫出 `111`、`121`、`MW0`、`MP1`、`B01`、`C01/C02`、`F01/F02`、`H01`、`W01`、`462`、`501/504/522`、`553`、`602`、`S01` 的完整意義？\n"}];

function renderProgressDashboardSvg(planDone, planTotal, fcDone, fcTotal, qDone, qTotal, wrongCnt) {
  const ring = (x, pct, color, label, sub) => {
    const r = 34, c = 2 * Math.PI * r;
    const off = c * (1 - pct / 100);
    return `
      <g transform="translate(${x},54)">
        <circle r="${r}" fill="none" stroke="#e2e8f0" stroke-width="8"/>
        <circle r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90)"/>
        <text y="5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">${pct}%</text>
        <text y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">${label}</text>
        <text y="70" text-anchor="middle" font-size="10.5" fill="#64748b">${sub}</text>
      </g>`;
  };
  const pPct = planTotal ? Math.round(planDone / planTotal * 100) : 0;
  const fPct = fcTotal ? Math.round(fcDone / fcTotal * 100) : 0;
  const qPct = qTotal ? Math.round(qDone / qTotal * 100) : 0;
  const accPct = qDone ? Math.max(0, Math.round((qDone - wrongCnt) / qDone * 100)) : 100;
  return `
    <div class="diagram-card" style="margin-bottom:14px;">
      <div class="diagram-title">📊 即時備考進度儀表板（自動隨打卡／閃卡／刷題更新）</div>
      <div class="diagram-scroll">
        <svg viewBox="0 0 720 142" style="width:100%;max-width:720px;min-width:460px;height:auto;display:block;margin:0 auto;" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,PingFang TC,Microsoft JhengHei,sans-serif">
          ${ring(95, pPct, "#0f4c81", "看課打卡", `${planDone} / ${planTotal} 項`)}
          ${ring(270, fPct, "#0d9488", "英文閃卡熟記", `${fcDone} / ${fcTotal} 詞`)}
          ${ring(445, qPct, "#d97706", "互動刷題完成", `${qDone} / ${qTotal} 題`)}
          ${ring(620, accPct, wrongCnt > 0 ? "#dc2626" : "#16a34a", "刷題正確率", `待複習錯題 ${wrongCnt} 題`)}
        </svg>
      </div>
    </div>`;
}

let gistCfg = { token: "", gistId: "" };

function loadAll() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && typeof p === "object") {
        state.progress = {
          updatedAt: p.updatedAt || 0,
          planDone: p.planDone || {},
          knownFc: p.knownFc || {},
          answered: p.answered || {},
          wrongSet: p.wrongSet || {},
          customNotes: Array.isArray(p.customNotes) ? p.customNotes : state.progress.customNotes
        };
      }
    }
    const cfgRaw = localStorage.getItem(SYNC_CFG_KEY);
    if (cfgRaw) gistCfg = JSON.parse(cfgRaw);
  } catch (e) {}
}

function saveProgress() {
  state.progress.updatedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.progress)); } catch (e) {}
}

function saveGistCfg() {
  try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(gistCfg)); } catch (e) {}
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.style.display = "none"; }, 2600);
}

// ==================== LIGHTWEIGHT MARKDOWN RENDERER ====================
function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inlineMd(s) {
  let out = escHtml(s);
  out = out.replace(/\\(\$)/g, "$1");
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  out = out.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  return out;
}
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let inCode = false, codeLang = "", codeBuf = [];
  let inUl = false, inOl = false;
  let tableBuf = [];

  function flushLists() {
    if (inUl) { html += "</ul>"; inUl = false; }
    if (inOl) { html += "</ol>"; inOl = false; }
  }
  function flushTable() {
    if (tableBuf.length < 2) {
      tableBuf.forEach(l => { html += `<p>${inlineMd(l)}</p>`; });
      tableBuf = [];
      return;
    }
    const parseRow = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    const headers = parseRow(tableBuf[0]);
    html += "<table><thead><tr>" + headers.map(h => `<th>${inlineMd(h)}</th>`).join("") + "</tr></thead><tbody>";
    for (let i = 2; i < tableBuf.length; i++) {
      const cells = parseRow(tableBuf[i]);
      html += "<tr>" + cells.map(c => `<td>${inlineMd(c)}</td>`).join("") + "</tr>";
    }
    html += "</tbody></table>";
    tableBuf = [];
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.trim().startsWith("```")) {
      flushLists(); flushTable();
      if (!inCode) {
        inCode = true;
        codeLang = line.trim().slice(3).trim().toLowerCase();
        codeBuf = [];
      } else {
        const rawCode = codeBuf.join("\n");
        const mDiag = codeLang === "mermaid" && rawCode.match(/%%\s*diagram:([a-z0-9\-_]+)/i);
        if (mDiag && typeof EXAM_DIAGRAMS !== "undefined" && EXAM_DIAGRAMS[mDiag[1]]) {
          const d = EXAM_DIAGRAMS[mDiag[1]];
          html += `<div class="diagram-card"><div class="diagram-title">${escHtml(d.title)}</div><div class="diagram-scroll">${d.svg}</div></div>`;
        } else {
          html += `<pre><code>${escHtml(rawCode)}</code></pre>`;
        }
        inCode = false;
        codeLang = "";
      }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
      flushLists();
      tableBuf.push(line.trim());
      continue;
    } else if (tableBuf.length) {
      flushTable();
    }

    if (!line.trim()) { flushLists(); continue; }
    if (/^---+$/.test(line.trim())) { flushLists(); html += "<hr style='border:none;border-top:1px solid var(--border);margin:16px 0;'>"; continue; }
    if (line.startsWith("# ")) { flushLists(); html += `<h1>${inlineMd(line.slice(2))}</h1>`; continue; }
    if (line.startsWith("## ")) { flushLists(); html += `<h2>${inlineMd(line.slice(3))}</h2>`; continue; }
    if (line.startsWith("### ")) { flushLists(); html += `<h3>${inlineMd(line.slice(4))}</h3>`; continue; }
    if (line.startsWith("#### ")) { flushLists(); html += `<h4 style="margin:12px 0 6px;font-size:0.95rem;color:#334155;">${inlineMd(line.slice(5))}</h4>`; continue; }
    if (line.startsWith("> ")) { flushLists(); html += `<blockquote>${inlineMd(line.slice(2))}</blockquote>`; continue; }

    const ulMatch = line.match(/^\s*[-*]\s+(.*)$/);
    if (ulMatch) {
      if (inOl) { html += "</ol>"; inOl = false; }
      if (!inUl) { html += "<ul>"; inUl = true; }
      html += `<li>${inlineMd(ulMatch[1])}</li>`;
      continue;
    }
    const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
    if (olMatch) {
      if (inUl) { html += "</ul>"; inUl = false; }
      if (!inOl) { html += "<ol>"; inOl = true; }
      html += `<li>${inlineMd(olMatch[1])}</li>`;
      continue;
    }
    flushLists();
    html += `<p>${inlineMd(line)}</p>`;
  }
  flushLists(); flushTable();
  return html;
}

    : GUIDES;

  let current = filtered.find(g => g.id === state.guideId) || filtered[0];

  const grouped = {};
  filtered.forEach(g => { (grouped[g.cat] = grouped[g.cat] || []).push(g); });

  root.innerHTML = `
    <div class="toolbar">
      <div class="group" style="flex:1;">
        <input type="text" id="g-search" style="flex:1;min-width:200px;" placeholder="🔍 全文搜尋 15 份完整精讀講義（例：滯報費、採購佣金、DDP、解釋準則、X1、35000）..." value="${escHtml(state.guideSearch)}" />

          ${Object.entries(grouped).map(([cat, arr]) => `
            <div class="guide-cat-hdr">${escHtml(cat)}</div>
            ${arr.map(g => `<button class="guide-item ${g.id===current.id?"active":""}" data-gid="${g.id}">${escHtml(g.title)}</button>`).join("")}
          `).join("")}
        </div>
        <div class="md-view">${renderMarkdown(current.md)}</div>
      </div>

  const knownFc = Object.keys(state.progress.knownFc).filter(k => state.progress.knownFc[k]).length;
  const doneQ = Object.keys(state.progress.answered).length;
  const wrongCnt = Object.keys(state.progress.wrongSet).filter(k => state.progress.wrongSet[k]).length;
  const phases = [...new Set(PLAN_ITEMS.map(p => p.phase))];

  root.innerHTML = `
    ${renderProgressDashboardSvg(doneCount, PLAN_ITEMS.length, knownFc, FLASHCARDS.length, doneQ, ALL_QUIZZES.length, wrongCnt)}
    <div class="toolbar">
      <div><strong>📅 6 個月在職省時看課與備考打卡</strong>（已完成 ${doneCount} / ${PLAN_ITEMS.length} 項，${pct}%）</div>
      <span style="font-size:0.82rem;color:var(--muted);">影片放 OneDrive App 串流看，這裡負責追蹤進度</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>

      <h3 style="margin:16px 0 8px;color:var(--primary);font-size:0.98rem;">${escHtml(ph)}</h3>

        const isDone = !!state.progress.planDone[p.id];

          <label class="plan-card ${isDone?"done":""}">

            <div style="flex:1;">
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;">
                <span class="${p.cls}">${p.badge}</span>
                <span class="plan-title" style="font-weight:700;">${escHtml(p.title)}</span>
              </div>
              <div style="font-size:0.85rem;color:var(--muted);">${escHtml(p.sub)}</div>

          </label>
        `;
      }).join("")}
    `).join("")}

function renderFlashcards(root) {
  const cats = ["ALL", ...new Set(FLASHCARDS.map(c => c.cat))];
  const list = FLASHCARDS.filter(c => {
    if (state.fcCat !== "ALL" && c.cat !== state.fcCat) return false;
    if (state.fcOnlyWeak && state.progress.knownFc[c.id]) return false;
    if (state.fcQuery.trim()) {
      const q = state.fcQuery.trim().toLowerCase();
      return c.zh.toLowerCase().includes(q) || c.en.toLowerCase().includes(q);
    }
    return true;
  });
  if (state.fcIdx >= list.length) state.fcIdx = Math.max(0, list.length - 1);
  const card = list[state.fcIdx];

  root.innerHTML = `
    <div class="toolbar">
      <div class="group">
        <select id="sel-cat">
          ${cats.map(c => `<option value="${c}" ${state.fcCat===c?"selected":""}>${c==="ALL"?"全部（90 詞）":c}</option>`).join("")}
        </select>
        <select id="sel-dir">
          <option value="zh2en" ${state.fcDir==="zh2en"?"selected":""}>中 → 英（練申論 20 分）</option>
          <option value="en2zh" ${state.fcDir==="en2zh"?"selected":""}>英 → 中</option>
        </select>
        <input type="text" id="fc-q" placeholder="搜尋單字..." value="${escHtml(state.fcQuery)}" />
      </div>
      <div class="group">
        <button class="btn ${state.fcOnlyWeak?"btn-warn":""}" id="btn-weak">${state.fcOnlyWeak?"✓ 僅未熟記":"僅未熟記"}</button>
        <button class="btn" id="btn-shuf">🔀 洗牌</button>
      </div>
    </div>
    ${list.length === 0 ? `<div style="text-align:center;padding:36px;color:var(--muted);">🎉 這個範圍已全部熟記！<br><br><button class="btn btn-primary" id="fc-clr">顯示全部卡片</button></div>` : `
      <div class="fc-wrap">
        <div style="display:flex;justify-content:space-between;font-size:0.84rem;color:var(--muted);margin-bottom:8px;">
          <span>第 <b>${state.fcIdx+1}</b> / ${list.length} 張</span>
          <span>點卡片翻面</span>
        </div>
        <div class="fc-card ${state.fcFlipped?"flipped":""}" id="fc-card">
          <span class="fc-cat">${card.cat}</span>
          <span class="fc-status">${state.progress.knownFc[card.id]?"✅ 已熟記":"📝 學習中"}</span>
          <div class="fc-main">${state.fcFlipped
            ? (state.fcDir==="zh2en" ? card.en : card.zh)
            : (state.fcDir==="zh2en" ? card.zh : card.en)}</div>
          ${state.fcFlipped ? `<div class="fc-sub">${state.fcDir==="zh2en"?card.zh:card.en}</div>` : `<div class="fc-hint">（點擊顯示答案）</div>`}
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap;">
          <div class="group">
            <button class="btn" id="fc-prev">← 上一張</button>
            <button class="btn" id="fc-next">下一張 →</button>
          </div>
          <button class="btn ${state.progress.knownFc[card.id]?"":"btn-ok"}" id="fc-known">
            ${state.progress.knownFc[card.id]?"標回需加強":"✅ 已熟記"}
          </button>
        </div>
      </div>
    `}
  `;
  document.getElementById("sel-cat").onchange = e => { state.fcCat = e.target.value; state.fcIdx = 0; state.fcFlipped = false; render(); };
  document.getElementById("sel-dir").onchange = e => { state.fcDir = e.target.value; state.fcFlipped = false; render(); };
  document.getElementById("fc-q").oninput = e => { state.fcQuery = e.target.value; state.fcIdx = 0; state.fcFlipped = false; render(); };
  document.getElementById("btn-weak").onclick = () => { state.fcOnlyWeak = !state.fcOnlyWeak; state.fcIdx = 0; state.fcFlipped = false; render(); };
  document.getElementById("btn-shuf").onclick = () => {
    for (let i = FLASHCARDS.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [FLASHCARDS[i],FLASHCARDS[j]]=[FLASHCARDS[j],FLASHCARDS[i]]; }
    state.fcIdx = 0; state.fcFlipped = false; render();
  };
  if (list.length === 0) {
    document.getElementById("fc-clr").onclick = () => { state.fcCat="ALL"; state.fcOnlyWeak=false; state.fcQuery=""; render(); };
    return;
  }
  document.getElementById("fc-card").onclick = () => { state.fcFlipped = !state.fcFlipped; render(); };
  document.getElementById("fc-prev").onclick = () => { state.fcIdx = (state.fcIdx - 1 + list.length) % list.length; state.fcFlipped = false; render(); };
  document.getElementById("fc-next").onclick = () => { state.fcIdx = (state.fcIdx + 1) % list.length; state.fcFlipped = false; render(); };
  document.getElementById("fc-known").onclick = () => {
    if (state.progress.knownFc[card.id]) delete state.progress.knownFc[card.id];
    else state.progress.knownFc[card.id] = true;
    saveProgress();
    state.fcFlipped = false;
    if (!state.fcOnlyWeak) state.fcIdx = (state.fcIdx + 1) % list.length;
    render();
  };
}

function getQuizBankList(bank) {
  if (bank === "eng") return ENG_QUESTIONS;
  if (bank === "law") return LAW_QUESTIONS;
  if (bank === "core") return CORE_QUESTIONS;
  return ALL_QUIZZES.filter(q => state.progress.wrongSet[q.id]);
}

function renderQuiz(root) {
  const bank = state.quizBank;
  const list = getQuizBankList(bank);
  const wrongCnt = Object.keys(state.progress.wrongSet).filter(k => state.progress.wrongSet[k]).length;

  const bankTabs = `
    <div class="toolbar">
      <div class="group">
        <button class="btn ${bank==="eng"?"btn-primary":""}" data-bank="eng">🇬🇧 英文模擬 (${ENG_QUESTIONS.length})</button>
        <button class="btn ${bank==="law"?"btn-primary":""}" data-bank="law">⚖️ 法規 103–114 (${LAW_QUESTIONS.length})</button>
        <button class="btn ${bank==="core"?"btn-primary":""}" data-bank="core">⚡ 四科核心 (${CORE_QUESTIONS.length})</button>
        <button class="btn ${bank==="mistakes"?"btn-danger":""}" data-bank="mistakes">📌 錯題重練 (${wrongCnt})</button>
      </div>
      ${bank !== "mistakes" ? `<button class="btn" id="q-reset">重做本題庫</button>` : ""}
    </div>
  `;

  if (list.length === 0) {
    root.innerHTML = bankTabs + `<div style="text-align:center;padding:36px;color:var(--muted);">🎉 錯題庫目前是空的！答錯的題目會自動集中到這裡。</div>`;
    bindBankTabs(root);
    return;
  }

  if (state.qIdx[bank] >= list.length) state.qIdx[bank] = list.length - 1;
  if (state.qIdx[bank] < 0) state.qIdx[bank] = 0;
  const idx = state.qIdx[bank];
  const item = list[idx];
  const isM = bank === "mistakes";
  const chosen = isM ? item._retryAns : state.progress.answered[item.id];
  const hasAns = chosen !== undefined;
  const isOk = hasAns && chosen === item.ans;
  const pct = Math.round(((idx + 1) / list.length) * 100);

  root.innerHTML = bankTabs + `
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <span class="q-tag">${item.tag}</span>
      <select id="q-jump">
        ${list.map((q,i) => {
          const st = state.progress.answered[q.id]===undefined ? "" : (state.progress.answered[q.id]===q.ans ? " ✅" : " ❌");
          return `<option value="${i}" ${i===idx?"selected":""}>第 ${i+1} / ${list.length} 題${st}</option>`;
        }).join("")}
      </select>
    </div>
    <div class="q-text">${escHtml(item.q)}</div>
    <div class="options">
      ${item.opts.map((opt, i) => {
        let cls = "opt-btn";
        if (hasAns) {
          if (i === item.ans) cls += " correct";
          else if (i === chosen && i !== item.ans) cls += " wrong";
        }
        return `<button class="${cls}" data-opt="${i}" ${hasAns?"disabled":""}>
          <span class="opt-letter">${["A","B","C","D"][i]}</span>
          <span>${escHtml(opt.replace(/^\([A-D]\)\s*/,""))}</span>
        </button>`;
      }).join("")}
    </div>
    ${hasAns ? `
      <div class="explain-box ${isOk?"ok":"err"}">
        <strong>${isOk ? "✅ 答對了！" : "❌ 正解為 (" + ["A","B","C","D"][item.ans] + ")"}</strong>
        <div style="margin-top:6px;">${escHtml(item.exp)}</div>
      </div>
    ` : ""}
    <div style="display:flex;justify-content:space-between;margin-top:16px;gap:8px;flex-wrap:wrap;">
      <div class="group">
        <button class="btn" id="q-prev" ${idx===0?"disabled":""}>← 上一題</button>
        <button class="btn btn-primary" id="q-next">${idx===list.length-1?"回到第 1 題":"下一題 →"}</button>
      </div>
      ${isM && isOk ? `<button class="btn btn-ok" id="q-rm-wrong">🎉 移出錯題本</button>` : ""}
      ${!isM && hasAns && !state.progress.wrongSet[item.id] ? `<button class="btn btn-warn" id="q-add-wrong">📌 加入錯題本</button>` : ""}
    </div>
  `;

  bindBankTabs(root);
  document.getElementById("q-jump").onchange = e => { state.qIdx[bank] = Number(e.target.value); render(); };
  const rst = document.getElementById("q-reset");
  if (rst) rst.onclick = () => {
    if (!confirm("確定清除本題庫作答紀錄？")) return;
    list.forEach(q => delete state.progress.answered[q.id]);
    state.qIdx[bank] = 0;
    saveProgress();
    render();
  };
  root.querySelectorAll(".opt-btn").forEach(b => {
    b.onclick = () => {
      const sel = Number(b.dataset.opt);
      if (isM) item._retryAns = sel;
      else {
        state.progress.answered[item.id] = sel;
        if (sel !== item.ans) state.progress.wrongSet[item.id] = true;
        saveProgress();
      }
      render();
    };
  });
  document.getElementById("q-prev").onclick = () => { if (isM) delete item._retryAns; state.qIdx[bank] = Math.max(0, idx - 1); render(); };
  document.getElementById("q-next").onclick = () => { if (isM) delete item._retryAns; state.qIdx[bank] = (idx + 1) % list.length; render(); };
  const rm = document.getElementById("q-rm-wrong");
  if (rm) rm.onclick = () => { delete item._retryAns; delete state.progress.wrongSet[item.id]; state.progress.answered[item.id] = item.ans; saveProgress(); render(); };
  const add = document.getElementById("q-add-wrong");
  if (add) add.onclick = () => { state.progress.wrongSet[item.id] = true; saveProgress(); render(); toast("已加入錯題本"); };
}

function bindBankTabs(root) {
  root.querySelectorAll("[data-bank]").forEach(b => {
    b.onclick = () => { state.quizBank = b.dataset.bank; render(); };
  });
}

function renderNotes(root) {
  const wrongQs = ALL_QUIZZES.filter(q => state.progress.wrongSet[q.id]);
  root.innerHTML = `
    <div class="sync-box">
      <h3>✍️ 新增個人錯題 / 讀書筆記（可雲端同步到手機與電腦）</h3>
      <div style="display:grid;gap:8px;">
        <div class="group">
          <select id="n-cat">
            <option>關務法規</option><option>稅則概要</option><option>通關實務</option><option>關務英文</option><option>其他</option>
          </select>
          <input type="text" id="n-title" style="flex:1;min-width:180px;" placeholder="標題（例：海運快遞拆櫃 1 日內申報）" />
        </div>
        <textarea id="n-body" placeholder="寫下法條依據、錯因、口訣或申論重點..."></textarea>
        <div><button class="btn btn-primary" id="n-add">＋ 儲存筆記</button></div>
      </div>
    </div>

    <h3 style="margin:14px 0 8px;">📒 我的筆記（${state.progress.customNotes.length} 則）</h3>
    ${state.progress.customNotes.length === 0 ? `<p style="color:var(--muted);">尚無自訂筆記。</p>` : state.progress.customNotes.map(n => `
      <div class="note-item">
        <div class="note-hdr">
          <div><span class="q-tag">${escHtml(n.cat)}</span> <strong style="margin-left:6px;">${escHtml(n.title)}</strong></div>
          <button class="btn btn-danger" style="padding:3px 9px;font-size:0.78rem;" data-delnote="${n.id}">刪除</button>
        </div>
        <div class="note-body">${escHtml(n.body)}</div>
        <div style="font-size:0.75rem;color:var(--muted);margin-top:6px;">建立日期：${escHtml(n.createdAt || "")}</div>
      </div>
    `).join("")}

    <h3 style="margin:20px 0 8px;">📌 刷題自動收錄之錯題（${wrongQs.length} 題）</h3>
    ${wrongQs.length === 0 ? `<p style="color:var(--muted);">目前無錯題，或前往「刷題測驗」練習！</p>` : wrongQs.map(q => `
      <div class="note-item">
        <div class="note-hdr">
          <span class="q-tag">${escHtml(q.tag)}</span>
          <button class="btn btn-ok" style="padding:3px 9px;font-size:0.78rem;" data-clrw="${q.id}">已弄懂移除</button>
        </div>
        <div style="font-weight:700;margin-bottom:4px;">${escHtml(q.q)}</div>
        <div style="font-size:0.88rem;color:#14532d;">正解 (${["A","B","C","D"][q.ans]})：${escHtml(q.exp)}</div>
      </div>
    `).join("")}
  `;

  document.getElementById("n-add").onclick = () => {
    const title = document.getElementById("n-title").value.trim();
    const body = document.getElementById("n-body").value.trim();
    const cat = document.getElementById("n-cat").value;
    if (!title && !body) { toast("請輸入標題或內容"); return; }
    state.progress.customNotes.unshift({
      id: "n_" + Date.now(),
      cat,
      title: title || "未命名筆記",
      body,
      createdAt: new Date().toISOString().slice(0,10)
    });
    saveProgress();
    toast("✅ 已儲存筆記！");
    render();
  };
  root.querySelectorAll("[data-delnote]").forEach(b => {
    b.onclick = () => {
      state.progress.customNotes = state.progress.customNotes.filter(n => n.id !== b.dataset.delnote);
      saveProgress();
      render();
    };
  });
  root.querySelectorAll("[data-clrw]").forEach(b => {
    b.onclick = () => {
      delete state.progress.wrongSet[b.dataset.clrw];
      saveProgress();
      render();
    };
  });
}

// ==================== CLOUD SYNC (GITHUB PRIVATE GIST + SYNC CODE) ====================
async function gistPush() {
  const token = document.getElementById("g-token").value.trim();
  const gistId = document.getElementById("g-id").value.trim();
  if (!token) { toast("請先填入 GitHub Token（僅需勾選 gist 權限）"); return; }
  gistCfg.token = token;
  gistCfg.gistId = gistId;
  saveGistCfg();

  const payload = {
    description: "116 專責報關人員備考進度同步檔（自動建立，私密）",
    public: false,
    files: { "customs-exam-116-progress.json": { content: JSON.stringify(state.progress, null, 2) } }
  };
  const url = gistId ? `https://api.github.com/gists/${gistId}` : "https://api.github.com/gists";
  const method = gistId ? "PATCH" : "POST";

  try {
    toast("☁️ 上傳中...");
    const res = await fetch(url, {
      method,
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    gistCfg.gistId = data.id;
    saveGistCfg();
    toast("✅ 已上傳至私密 GitHub Gist！");
    render();
  } catch (err) {
    toast("❌ 上傳失敗：" + err.message + "（請確認 Token 有 gist 權限）");
  }
}

async function gistPull() {
  const token = document.getElementById("g-token").value.trim();
  const gistId = document.getElementById("g-id").value.trim();
  if (!token || !gistId) { toast("請填入 Token 與 Gist ID"); return; }
  gistCfg.token = token;
  gistCfg.gistId = gistId;
  saveGistCfg();

  try {
    toast("⬇️ 同步下載中...");
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const file = data.files["customs-exam-116-progress.json"];
    if (!file) throw new Error("找不到同步檔");
    const parsed = JSON.parse(file.content);
    state.progress = {
      updatedAt: parsed.updatedAt || Date.now(),
      planDone: parsed.planDone || {},
      knownFc: parsed.knownFc || {},
      answered: parsed.answered || {},
      wrongSet: parsed.wrongSet || {},
      customNotes: Array.isArray(parsed.customNotes) ? parsed.customNotes : []
    };
    saveProgress();
    toast("✅ 已從雲端同步最新進度！");
    render();
  } catch (err) {
    toast("❌ 下載失敗：" + err.message);
  }
}

function renderSync(root) {
  const syncCode = btoa(unescape(encodeURIComponent(JSON.stringify(state.progress))));
  root.innerHTML = `
    <div class="sync-box">
      <h3>☁️ 方式一：GitHub 私密 Gist 全自動雲端同步（最推薦，100% 免費）</h3>
      <p style="font-size:0.86rem;color:var(--muted);margin:0 0 10px;">
        到 GitHub → Settings → Developer settings → Personal access tokens (classic) 產生一組<b>僅勾選 <code>gist</code> 權限</b>的 Token，貼到下方（只存在你自己的手機／電腦瀏覽器，不會外洩）。第一次按「上傳雲端」會自動產生專屬 <b>Gist ID</b>，把 Token＋Gist ID 貼到 iPhone 就完成雙向雲端同步！
      </p>
      <div style="display:grid;gap:8px;">
        <input type="password" id="g-token" placeholder="GitHub Token（ghp_...，僅需 gist 權限）" value="${escHtml(gistCfg.token || "")}" />
        <input type="text" id="g-id" placeholder="Gist ID（第一次上傳留空會自動建立，再複製到 iPhone）" value="${escHtml(gistCfg.gistId || "")}" />
        <div class="group">
          <button class="btn btn-primary" id="btn-g-push">☁️ 上傳進度到雲端</button>
          <button class="btn btn-ok" id="btn-g-pull">⬇️ 從雲端下載同步</button>
        </div>
      </div>
    </div>

    <div class="sync-box">
      <h3>📋 方式二：免設定「一鍵同步碼」（傳到 LINE 給自己 1 秒同步）</h3>
      <p style="font-size:0.86rem;color:var(--muted);margin:0 0 8px;">
        不想申請 Token 也沒關係！按「複製我的進度碼」貼到另一台手機／電腦的下方輸入框按「匯入」，全部打卡、閃卡、錯題與筆記立刻同步。
      </p>
      <div class="group" style="margin-bottom:10px;">
        <button class="btn btn-primary" id="btn-copy-code">📋 複製我的進度碼</button>
      </div>
      <textarea id="inp-code" placeholder="在這裡貼上從另一台裝置複製的進度碼..."></textarea>
      <div class="group" style="margin-top:8px;">
        <button class="btn btn-ok" id="btn-import-code">📥 匯入進度碼</button>
      </div>
    </div>
  `;

  document.getElementById("btn-g-push").onclick = gistPush;
  document.getElementById("btn-g-pull").onclick = gistPull;
  document.getElementById("btn-copy-code").onclick = async () => {
    try { await navigator.clipboard.writeText(syncCode); toast("✅ 已複製進度碼！貼到另一台裝置即可同步"); }
    catch (e) { document.getElementById("inp-code").value = syncCode; toast("已填入下方框中，請全選複製"); }
  };
  document.getElementById("btn-import-code").onclick = () => {
    const raw = document.getElementById("inp-code").value.trim();
    if (!raw) { toast("請先貼上進度碼"); return; }
    try {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(raw))));
      state.progress = {
        updatedAt: Date.now(),
        planDone: parsed.planDone || {},
        knownFc: parsed.knownFc || {},
        answered: parsed.answered || {},
        wrongSet: parsed.wrongSet || {},
        customNotes: Array.isArray(parsed.customNotes) ? parsed.customNotes : []
      };
      saveProgress();
      toast("✅ 匯入成功！全部進度已同步");
      render();
    } catch (e) { toast("❌ 進度碼格式無效，請確認完整複製"); }
  };
}

// ==================== MAIN RENDER & EVENTS ====================
function setTab(t) {
  state.tab = t;
  render();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function render() {
  updateBadges();
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
  const root = document.getElementById("app");
  if (state.tab === "guides") renderGuides(root);
  else if (state.tab === "plan") renderPlan(root);
  else if (state.tab === "flashcards") renderFlashcards(root);
  else if (state.tab === "quiz") renderQuiz(root);
  else if (state.tab === "notes") renderNotes(root);
  else if (state.tab === "sync") renderSync(root);
}

document.querySelectorAll("[data-tab]").forEach(b => { b.onclick = () => setTab(b.dataset.tab); });
document.getElementById("top-sync-btn").onclick = () => setTab("sync");

loadAll();
render();
</script>
