  .explain-box { margin-top: 14px; padding: 13px 15px; border-radius: 10px; background: #f8fafc; border-left: 4px solid var(--primary); font-size: 0.91rem; }

<script>

const GUIDES = [{"id":"01_關務英文_01_關務及報關英文講義","cat":"關務英文","title":"關務及報關英文講義","md":"# 01｜關務及報關英文【完整精讀版】\n\n\u003e **整合來源**：趙世玉講師《1 關務英文（94 頁）》、《2 附表（12 頁）》、《3 關務英文對照表（15 頁）》、《4 模擬考題（40 題）》＋ **113–115 年考畢試題**。\n\u003e\n\u003e **🔥 命題重大趨勢**：\n\u003e 1. **申論題一（中翻英，20 分）**：114 年與 115 年共 8 題，**100% 一字不差出自關務署官方《關務業務中英文詞彙對照表》**！\n\u003e 2. **測驗題（40 題，50 分）**：113–114 年主攻「台灣關務法條英文＋時事」，**115 年大舉轉向「傳統國貿實務英文（佔 15 題！）」＋「台灣通關與保稅法規細節」**。\n\n---\n\n## 一、14 大國際公約、協定與關務機制速查表（趙世玉《2 附表》核心）\n\n| 英文簡稱／全稱 | 中文名稱 | 考場高頻關鍵字與必考點 |\n| :--- | :--- | :--- |\n| **WTO TFA**\u003cbr\u003eTrade Facilitation Agreement | 貿易便捷化協定 | `pre-arrival clearance`（預先通關）、`highly perishable goods`（易腐品）、`advance ruling`（預審）、`Single Window`（單一窗口） |\n| **WCO SAFE**\u003cbr\u003eFramework of Standards to Secure and Facilitate Global Trade | 全球貿易安全與便捷標準架構 | `supply chain security`（供應鏈安全）、`AEO`、`MRA`（相互認證） |\n| **WCO RKC**\u003cbr\u003eRevised Kyoto Convention | 修正版京都公約 | 1973 年 CCC 採納，目標為 `simplification and harmonization of customs procedures`（🔥 113 Q35、115 Q37 連考！） |\n| **AEO**\u003cbr\u003eAuthorized Economic Operator | 優質企業認證 | 分為 **AEOG**（一般）與 **AEOS**（安全認證，⚠️ 注意 `S` 非複數！）；每 **3 年**覆核（`reviewing`）；**MRA** 促進 `bilateral trade`；優惠：`reduce examination rate`、AEOS 進口完稅價格逾 **NT\\$1 億元**得免審免驗（🔥 115 Q35） |\n| **Agreement on Customs Valuation** | WTO 關稅估價協定 | 對應我國《關稅法》第 29–35 條六種完稅價格核定順位 |\n| **Agreement on Rules of Origin** | 原產地規定協定 | `wholly obtained or produced`、`substantial transformation`、`LDCs`（低度開發國家優惠） |\n| **HS Code**\u003cbr\u003eHarmonized Commodity Description and Coding System | 國際商品統一分類制度 | 全球共通前 **6 碼**；分類依據 **GIRs**（`General Interpretative Rules` 稅則解釋準則）；結構：章 Chapter(2)→節 Heading(4)→目 Subheading(6)→款 Division(8)→項 Item(10)＋檢查碼 Check Digit(11) |\n| **CITES** | 華盛頓公約（瀕臨絕種野生動植物國際貿易公約） | `endangered species`、`fauna and flora`、`export permit` |\n| **ATA Carnet / Istanbul Convention** | 貨品暫准通關證／伊斯坦堡公約 | `temporary admission`、`duty-free, tax-free`、效期最長 **1 year**、須指定 `guarantee institution`、**不適用易腐品（`perishable 之條件（113 Q31）。\n\n### 2. UCP 600、提單（B/L）與貨運角色實務\n- **UCP 600 裝船日認定**（115 Q6）：提單已載明 `on board` 但未另列裝船日時，以**提單簽發日（`date of bill of lading issuance`）**視為裝船日。\n- **輸入許可證（I/P）效期 6 個月之「裝船日（`date of shipment`）」**（115 Q13）：以出口港**提單簽發日**為準。\n- **清潔提單（Clean B/L）**（115 Q8）：貨物裝船時已受損但運送人仍簽發清潔提單者，收貨人（`consignee`）得向運送人（`carrier`）求償。\n- **「貨先到、單據未到」三大實務解法**（115 Q7）：\n  1. 擔保提貨（`Guarantee for collection` / `L/G`）\n  2. 電報放貨（`Telegraphic release`）\n  3. 副提單背書（`Endorsement of a duplicate B/L`）\n  *(⚠️ 「船邊提貨 Collection at the ship\u0027s side」不是解決方案！)*\n- **單據與業者辨析**：\n  - `S/O`（Shipping Order 裝貨單／託運單）：訂艙後之裝船通知（`reservation slip`）。\n  - `B/L`（海運提單）vs `AWB`（空運提單）vs `D/O`（Delivery Order 小提單／提貨單）。\n  - `NVOCC`（Non-Vessel Operating Common Carrier 無船公共運送人）：簽發 House B/L 但不擁有營運主要船舶（113 Q28）。\n  - `Freight Forwarder`（貨運承攬人：託運人與運送人間中介，安排國際運送）vs `Customs Broker`（報關行：進出口商與海關間中介，辦理清關）（113 申論二、Q29）。\n\n### 3. 海上保險、託收付款與國際商務爭議\n- **協會貨物保險條款（Institute Cargo Clauses）**（115 Q11）：\n  - `ICC(A)`：保障最廣、採**概括式（all-risks / comprehensive）**。\n  - `ICC(B)`、`ICC(C)`：採**列舉式**（非概括式）；`ICC(C)` 保費最低。\n  - 三者均**不承保戰爭險（`war risks`）與罷工險（`strike risks`）**。\n- **`I.O.P.`（Irrespective of Percentage 不計免賠率）**（115 Q9）：不論損失百分比多寡，保險人均全額理賠。\n- **共同海損（General Average）**（115 Q15）：船方（`vessel`）、貨方（`cargo`）、運費受益人（`freight beneficiaries`）按比例共同分攤損失。\n- **輸出保險（Export Insurance）**（115 Q12）：承保出口商**無法收回貨款（`unable to collect payment`）**之信用或政治風險。\n- **承兌交單 `D/A`（Documents Against Acceptance）**（115 Q14）：進口商於**已承兌之匯票到期時（`matured bill of exchange`）**付款。\n- **調解（Mediation）vs 仲裁（Arbitration）**（115 Q16）：\n  - 調解：第三方協助合意，通常**無拘束力（`non-binding`）**，省時省訴訟費。\n  - 仲裁：雙方合意提交，判斷**具法律拘束力（`legally binding`）**，且**當事人可自行選擇仲裁人或仲裁機構**（非法院強制指定）。\n\n---\n\n## 三、用英文考台灣關務法規：數字與 114–115 最新修法警示總表\n\n\u003e ⚠️ **最新修法紅燈提醒（趙世玉講師強調，切勿背到舊考題數字！）**：\n\u003e - **入境旅客一般自用行李免稅額**：已調高至 **NT\\$35,000**（原 2 萬）；單件已使用行李 **NT\\$10,000**；現金逾 **NT\\$100,000**（`aggregate value`）須申報。\n\u003e - **入境旅客菸酒免稅與限量（114 年新制）**：\n\u003e   - 酒類（滿 18 歲）：免稅放寬為 **1.5 公升**（113 舊題考 1 公升！），有申報總限量 **5 公升**（未開放大陸酒 1 公升）。\n\u003e   - 菸類（滿 20 歲）：免稅捲菸 200 支 / 雪茄 25 支 / 菸絲 1 磅 / **衛福部核定指定加熱菸（`heated tobacco`）200 支**；**電子菸（`vapes / e-cigarettes`）屬類菸品全面禁止！**\n\u003e - **114.12.30 貨物稅新免稅清單**：無添加糖飲料、**彩色電視機、錄影機、電唱機、錄音機**、2026–2030 太陽能玻璃、完稅價 140 萬內電動車（原已免稅：洗衣機；仍課稅：冰箱 13%、冷暖氣機、除濕機 15%、音響 10%、電烤箱 15%）。\n\n### 1. 高頻法條英文關鍵數字速查\n| 主題 | 關鍵英文與最新法定數字 | 歷屆出處 |\n| :--- | :--- | :---: |\n| **報關／滯報費／納稅** | 進口翌日起 **15 days** 報關；滯報費（`late declaration fee`）每日 **NT\\$200**；納稅 **14 days**，逾期加徵 `delinquent fee` | 113/114/115 連考 |\n| **海空運承攬業預報與保證金** | 進口艙單預報：空運抵前 **2 hours**、海運抵前 **5 hours**；海運承攬保證金 **TWD 500,000**（AEOS 減半 **250,000**）；漏列艙單更正：海空運均 **72 hours** | 115 Q31–33 |\n| **完稅價格估價 6 順位** | ① `Transaction Value` → ② `Identical Goods` → ③ `Similar Goods` → ④ `Deductive Value` → ⑤ `Computed Value` → ⑥ `Reasonable Means` | 114 Q16 |\n| **預估發票（Pro-forma Invoice）** | 納稅辦法報 **65 / 62** 繳押金先放行，放行後 **4 months** 內補正式商業發票（最長展延 **1 year**） | 114 Q39、趙講義 p.77 |\n| **預審補件與延長** | 估價預審補件 **30 days**（114 Q36）；稅則預審遭變更致損失得申請延長適用原決定 **90 days**（關§21） | 114 Q36、模擬 Q11 |\n| **原產地實質轉型** | 稅則前 **6-digit** 改變、重要製程、或 `value-added rate` 逾 **35%**（公式：`[FOB - 進口原料CIF] ÷ FOB`）；主管產證機關為國際貿易署 | 113 Q38、115 Q1/27/28 |\n| **免稅限額** | 低價免稅 `de minimis` **NT\\$2,000**（排除菸酒及關稅配額農產品）；進口廣告品及貨樣 **NT\\$12,000**；郵包 FOB 逾 **US\\$5,000** 須正式報關 | 114 Q8、115 Q18 |\n| **外銷品免／退稅 4 大時限** | 原料沖退稅（§63）放行翌日起 **1.5 years**；原料未用復運出口免稅（§56）**1 year**（免稅手續 6 月內）；外銷退貨復運進口（§57Ⅰ）**3 years**；整修復運出口（§57Ⅱ）**6 months** | 114 Q33、趙講義 p.68 |\n| **查驗與貨樣留存** | 抽驗（`selective basis`）為原則；人工開箱原則不逾 **10%**，開滿 **20 cartons** 無訛免續驗；貨樣留存進口 **2 months**、出口 **10 days**；C1 報單紙本保存 **12 months** | 113 Q37、115 Q25/39 |\n| **快遞通關** | 分類 X1–X4、X6–X8（無 X5）；單件毛重限 **70 kg**；禁運生鮮農漁畜品；海運快遞拆櫃進倉 **3 working days**；戶對戶以 `holder` 報關 | 113 Q40、114 Q25/35、115 Q24 |\n| **保稅園區與主管機關** | 科學園區→**國科會**；科技產業園區→**經濟部**；農科園區→**農業部**；自貿港區→母法**交通部**／通關子法**財政部**；保稅倉／保稅廠／物流中心→**財政部**（物流中心 **24-hour** 通關＋`simple processing`＋自然短少 `de-booking`；保稅倉僅 `reconditioning`） | 114 Q24/40、115 Q29/30/34/36 |\n| **特別關稅與緝私** | 補貼→`Countervailing Duty`；低於正常價→`Anti-dumping Duty`；SSG 依 `trigger quantity / price`；緝私水域 **24 nautical miles**、私運 **3 倍**貨價（出口依 FOB）、收受藏匿 **NT\\$90,000**、非洲豬瘟初犯 **NT\\$200,000**／累犯 **NT\\$1,000,000** | 113/114 連考 |\n\n---\n\n## 四、官方《關務業務中英文詞彙對照表》申論中翻英必背金礦（114–115 年 100% 命中！）\n\n\u003e 🔥 標註【114考】【115考】為已考出真題，其餘為同族群最高潛力命題詞彙！\n\n### 1. 徵課類（Customs Duty Collection）\n- **出口報單** `Export Declaration`【115考】 ／ **進口報單** `Import Declaration` ／ **簡易報單** `Simplified Declaration Form`\n- **免驗通關** `Exemption from Customs Examination`【115考】 ／ **免驗** `Exemption from Examination`\n- **過境貨物艙單** `Through Cargo Manifest`【114考】 ／ **進口貨物艙單** `Import Cargo Manifest` ／ **載貨清單** `Cargo List`\n- **推廣貿易服務費** `Trade Promotion Service Fee`【114考】 ／ **商港服務費** `Port Duties` ／ **健康福利捐** `Health and Welfare Surcharge`\n- **從量稅** `Specific Duty`【114考】 ／ **從價稅** `Ad Valorem Duty` ／ **複合稅** `Compound Duty` ／ **特別關稅** `Special Customs Duty`\n- **先放後稅** `Post-release Duty Payment` ／ **按月彙總繳納稅費** `Consolidated Payment of Duties and Charges on a Monthly Basis`\n- **稅款繳納證** `Duty Memo` ／ **完稅證明** `Duty Payment Certificate` ／ **滯報費** `Late Declaration Fee` ／ **滯納金** `Delinquent Fee`\n- **納稅義務人** `Duty-payer` ／ **申報人** `Declarant` ／ **報關行** `Customs Broker` ／ **收貨人** `Consignee` ／ **發貨人** `Consignor / Shipper`\n- **行政救濟** `Administrative Remedy` ／ **復查案件** `Review Case` ／ **訴願案件** `Appeal Case`\n- **船邊驗放** `Cargo Examination and Release Alongside the Vessel` ／ **倉庫驗放** `Cargo Examination and Release at the Warehouse`\n- **預報** `Pre-entry Declaration` ／ **實名認證** `Real Name Authentication` ／ **微量價值** `De Minimis Shipment Value`\n- **進口貨物稅則預審** `Advance Ruling for Tariff Classification of Imported Goods` ／ **原產地自行具證** `Self-certification of Country of Origin`\n- **轉運** `Transit` ／ **轉口** `Transshipment` ／ **三角貿易** `Triangular Trade` ／ **復運出口 / 進口** `Re-export / Re-import`\n- **發遞單** `Dispatch Note` ／ **多國集併貨物** `Multi-country Cargo Consolidation (MCC)` ／ **貨主自備貨櫃** `Shipper\u0027s Own Containers (SOC)`\n\n### 2. 驗估類（Examination \u0026 Valuation）\n- **先估後驗** `Valuation before Examination`【114考】 ／ **先驗後估** `Examination before Valuation`\n- **預估發票** `Pro-forma Invoice`【115考】 ／ **貨價申報書** `Customs Value Declaration Form`\n- **交易價格** `Transaction Value` ／ **實付或應付價格** `Price Actually Paid or Payable` ／ **權利金及報酬** `Royalties and License Fees`\n- **同樣／類似貨物之交易價格** `Transaction Value of Identical / Similar Goods` ／ **扣減價格** `Deductive Value` ／ **計算價格** `Computed Value`\n- **事後稽核制度** `Post-clearance Audit System` ／ **進口貨物價格預審** `Advance Ruling for Customs Valuation of Imported Goods`\n\n### 3. 查緝、保稅、退稅、反傾銷與國際關務\n- **離岸價格** `Free on Board (FOB) Value`【115考】 ／ **起岸價格** `CIF Value`\n- **海關緝私條例** `Customs Anti-Smuggling Act` ／ **沒入** `Confiscation / Forfeiture` ／ **扣押** `Detention` ／ **緝獲** `Seizure` ／ **未列艙單貨物** `Unmanifested Cargo`\n- **旅客紅綠線通關制度** `Red-Green Lane Passenger Clearance System` ／ **隨身／後送行李** `Accompanied / Unaccompanied Baggage`\n- **戰略性高科技貨品** `Strategic High-tech Commodities` ／ **電子封條** `E-seal` ／ **仿冒** `Counterfeit / Forgery` ／ **侵權** `Infringement`\n- **保稅倉庫 / 工廠** `Bonded Warehouse / Factory` ／ **物流中心** `Logistics Center` ／ **自由貿易港區** `Free Trade Zone` ／ **用料清表** `Bill of Materials (BOM)` ／ **重整** `Reassembly / Reconditioning` ／ **除帳** `De-booking` ／ **監毀** `Destroyed under Supervision`\n- **退稅 / 沖退原料稅** `Duty Drawback / Offsetting \u0026 Refund of Duties and Taxes on Raw Materials` ／ **切結書** `Affidavit`\n- **反傾銷稅 / 平衡稅** `Anti-dumping Duty / Countervailing Duty` ／ **傾銷差額** `Margin of Dumping` ／ **實質損害** `Material Injury` ／ **落日檢討** `Sunset Review` ／ **價格具結** `Price Undertakings`\n- **關港貿單一窗口** `Customs-Port-Trade (CPT) Single Window` ／ **無紙化通關** `Paperless System` ／ **整合邊境管理** `Coordinated Border Management` ／ **納稅者權利保護** `Taxpayer Rights Protection`\n"},{"id":"01_關務英文_02_一般英文與翻譯解題講義","cat":"關務英文","title":"一般英文與翻譯解題講義","md":"# 02｜一般英文、時事詞彙與翻譯解題【完整精讀版】\n\n\u003e **整合來源**：趙世玉講師《2 附表（法條句型與關鍵字聯想）》、《4 模擬考題（時事熱點）》＋ **113–115 年申論題二（英翻中 6 篇全語料分析）**。\n\n---\n\n## 一、選擇題必背法條句型與秒殺聯想（趙世玉《2 附表》精華）\n\n### 1. 題幹常見法條連接詞與反向警訊\n- **反向題必圈起來**：`NOT`、`incorrect`、`false`、`except`、`excluded`\n- **依據／按照（一律譯「依……規定」）**：`according to` / `in accordance with` / `pursuant to` / `compliant with` / `in compliance with` / `subject to`\n- **法條「但書」與例外**：`provided (however) that ~`（但……／惟……）；`unless otherwise prescribed herein`（除本法另有規定者外）\n- **時間介系詞精準辨析**：\n  - 之前：`before` / `prior to` / `in advance`（如 `prior to importation` 進口前）\n  - 之後：`after` / `following`（如 `following the arrival date` 進口日翌日起）\n  - 收到通知起 X 日內：`within X days upon receipt (of the notice)`\n- **強制義務 vs 裁量權**：`shall`＝**應**（強制）；`may`＝**得**（裁量）\n\n### 2. 趙世玉老師「生鮮／動植物」三秒判斷口訣\n看到題目出現動植物或生鮮字眼，直接對照關鍵字選答案：\n1. `Animals / plants` ＋ **`endangered species`（瀕危物種）** → 選 **CITES**（華盛頓公約）\n2. `Animals / plants` ＋ **`disease`（疫病）** → 選 **quarantine**（檢疫）\n3. **`Fresh / perishable / live animals`** → 考 **快速通關、`pre-entry declaration`（預報）、船／機邊驗放、不得走快遞專區、不適用 ATA Carnet**\n\n---\n\n## 二、2025–2026 時事經貿與關務英文高頻詞彙庫\n\n\u003e 114–115 年考題大量取材自**關務署英文新聞稿、台美關稅談判、地緣政治航運衝擊、邊境新興管制物**！\n\n### 1. 關稅戰、對等貿易與洗產地\n| 英文詞彙／片語 | 中文意義 | 考題情境 |\n| :--- | :--- | :--- |\n| `reciprocal tariffs` / `Taiwan-U.S. ART` | 對等關稅／台美對等貿易協定 | 114、115、模擬 Q10 |\n| `Section 301 of the US Trade Act of 1974` | 美國 1974 年貿易法第 301 條 | 授權美國總統反制外國不公平貿易限制（115 Q19） |\n| `TECRO` | Taipei Economic and Cultural Representative Office（駐美代表處） | 🔥 115 Q10 |\n| `illicit transshipment` / `circumvent` | 違法轉運（洗產地）／規避 | 114 申論二(一) 三道防線打擊洗產地 |\n| `three-level defense system` | 三道防線（事前產證、事中查核、事後重罰） | 114 申論二(一) |\n| `phasing out the de minimis loophole` | 逐步取消小額包裹免稅漏洞 | 美國取消 US\\$800 免稅（模擬 Q37） |\n| `War Risk Surcharge` / `Bunker Adjustment Fee (BAF)` | 戰爭險附加費／燃油附加費 | 荷姆茲海峽封鎖導致運費與附加費暴漲（115 Q4） |\n| `tightened sanctions and export controls` | 加強制裁與出口管制 | 俄烏戰爭與歐盟接軌（114 申論二(二)） |\n| `diversify export markets` / `reduce reliance on` | 分散出口市場／降低對……之依賴 | 114、115 連兩年申論出現！ |\n| `plummeted` / `plunged` / `shed` | 暴跌、驟降（反義：`surged` / `skyrocketed`） | 114 選擇、115 申論 |\n\n### 2. 智慧海關、電商與新興邊境管制\n| 英文詞彙／片語 | 中文意義 | 考題情境 |\n| :--- | :--- | :--- |\n| `Digital Customs Transformation Program` | 數位海關轉型計畫 | 115 申論二(一) |\n| `data analytics` / `cloud computing` / `off-site backups` | 數據分析／雲端運算／異地備援 | 115 申論二(一) |\n| `resilient and smart customs environment` | 具韌性且智慧化的海關環境 | 115 申論二(一) |\n| `Hainan Free Trade Port customs closure` | 海南自貿港封關運作 | 模擬 Q2 |\n| `weight loss pens` | 減重筆（瘦瘦筆，無輸入許可禁帶） | 模擬 Q3 |\n| `heated tobacco products` vs `vapes / e-cigarettes` | 加熱菸（核准始可帶）vs 電子菸（全面禁止） | 114 Q11、模擬 Q6/35 |\n| `African Swine Fever (ASF)` / `crack down on` | 非洲豬瘟／嚴厲取締 | 114 Q9 |\n| `surcharge` / `overcharge` / `undercharge` / `undervalue` | 加收附加費／超收／少收／低報價值 | 115 Q2 |\n| `cold-chain systems` | 冷鏈系統 | 115 申論二(二) |\n\n---\n\n## 三、113–115 年申論「英翻中」三種必考文體與滿分拆譯範本\n\n近三年 6 篇英翻中（每篇 15 分，共 30 分）高度固定在以下 **3 種文體**：\n\n### 文體 1：政策願景與關務署公文體（115 年二(一)、114 年二(一)(二)）\n- **句型特徵**：句首 `To + V...` 表目的，搭配冒號後並列動名詞（`reshaping..., developing..., adopting..., and strengthening...`）或三階段並列（`pre-clearance / during transit / post-violation`）。\n- **高分譯法**：把英文並列項轉成**中文四字／對仗行政術語**，專業感直接拉滿！\n  - *實戰例（114 申論二(一)）*：`pre-clearance verification of origin documents, rigorous inspection during transit, and strict post-violation penalties`\n  - **高分譯文**：「**事前**核查原產地證明文件、**事中**加強轉運嚴密查驗，以及**事後**從嚴裁罰違規行為。」\n  - *實戰例（114 申論二(二)）*：`aligning the scope... with that of the EU` → 「使管制範圍與歐盟**接軌**」；`Export-Import Bank of ROC` → 固定譯「**中國輸出入銀行**」（切勿直譯成中華民國進出口銀行）。\n\n### 文體 2：經貿新聞與數據報導體（115 年二(二)）\n- **句型特徵**：分詞構句（`Following...`）、讓步子句（`While open to...`）、`with + N + 補語` 附帶結構。\n- **高分譯法**：\n  - `Following China\u0027s new trade measures, ...` → 「**繼中國祭出新貿易措施後**，……」\n  - `While open to resuming trade, Taiwan remains cautious, prioritizing...` → 「**雖然**對恢復貿易持開放態度，臺灣仍保持審慎，並優先推動……」\n  - `...with Japan now the top buyer of Taiwanese pineapples.` → 「……，**而日本現已成為**臺灣鳳梨的最大買家。」（把 `with` 拆成獨立短句，最順！）\n\n### 文體 3：基礎關務／國貿定義與對比說明體（113 年二(一)(二)）\n- **句型特徵**：連續非限定關係子句（`, which...`）＋對比連接詞（`on the other hand`、`The main difference is that...`）。\n- **高分譯法**：\n  - 碰到長定語或 `, which` 時**果斷切短句**，先譯主幹再補說明。\n  - 精準對照角色名詞：`Freight Forwarders`（**貨運承攬業／承攬人**）、`Customs Brokers`（**報關業／報關行**）、`shippers`（**託運人**）、`clearing goods through Customs`（**辦理貨物通關**）。\n\n---\n\n## 四、申論「中翻英（20 分）」考場檢查清單\n1. **優先套用《關務業務中英文詞彙對照表》官方譯名**（114、115 連兩年 100% 命中）。\n2. **有縮寫必寫全稱**：例如 `Free on Board (FOB) Value`、`Certificate of Origin (C/O)`、`Pro-forma Invoice`，絕不可只寫 `FOB`。\n3. **詞彙拼字與大小寫一致**：專有名詞每個實詞首字母大寫（如 `Trade Promotion Service Fee`、`Valuation before Examination`），卷面整齊度直接影響閱卷印象分。\n"},{"id":"02_關務法規概要_01_關稅法及施行細則","cat":"關務法規概要","title":"關稅法及施行細則","md":"# 01｜關稅法及施行細則【完整精讀版】\n\n\u003e **整合來源**：游邵予老師《關稅法講義（361 頁完整精華與口訣）》＋ 全國法規資料庫最新現行全文（§1–§103、施行細則 §1–§63）＋ **113–115 年考畢試題**。\n\u003e\n\u003e **🔥 命題權重**：全法七章中，**第二章通關程序（尤以 §29–§42 完稅價格）＋ 第三章稅款優待（免稅、保稅、沖退稅）＋ 第五章罰則** 佔了超過 80% 考點！\n\n---\n\n## 一、總則與適用基準日（§1～§15、細則 §2～§6）\n\n### 1. 法律位階與基礎定義\n- **法律位階**：《關稅法》與《海關進口稅則》（§3Ⅰ）皆經**立法院三讀**通過之「法律」；《關稅法施行細則》（§102）及各項管理辦法為財政部訂定之法規命令。\n- **關稅定義（§2）**：指對國外**進口貨物**所課徵之進口稅（不含出口、轉口、過境、貨物稅、營業稅）。\n- **納稅義務人（§6、細則 §3）**：收貨人、提貨單持有人（含受託而以**自己名義**申報之報關行）、貨物持有人（持有應稅未稅貨物者）。\n- **業者補稅責任（§7）** 🔥 113 Q1、114 Q1 連考：運輸工具／保稅運貨工具載運，或貨棧／貨櫃集散站／保稅倉庫／物流中心／免稅商店儲存貨物，因非法提運、遺失、遭竊短少 → **由業者補繳短少稅費**；單獨由海關登記之**承攬業**承攬運送短少 → **由承攬業者補繳**。\n- **清算人責任（§8）** 🔥 113 Q1：解散清算時，清算人於分配賸餘財產**前**（⚠️ 陷阱常改「後」），應按**關稅 → 滯納金 → 滯報費 → 利息 → 罰鍰 → 追繳貨價**順序繳清；違反者清算人負個人繳納義務。\n\n### 2. 適用法規／稅率基準日（細則 §2、§6）🔥 113 Q9/26、114 Q32 連考！\n| 貨物類型 | 適用稅率與法規基準日 | 考場必背陷阱 |\n| :--- | :--- | :--- |\n| **一般進口貨物** | **運輸工具進口日** | 細則 §6：**海運／空運須「實體抵達本國港口／機場 ＋ 已向海關遞送進口艙單」雙條件成立**！郵運＝寄發招領通知日或加蓋郵戳於發遞單日；轉運＝最初抵達本國卸載口岸遞送艙單日（非轉運目的地海關）。 |\n| **保稅倉庫貨物（§58）** | **申請出倉進口日** | 非進倉日！ |\n| **保稅工廠出廠貨物（§59Ⅱ）** | **報關日** | 非放行日、非進廠日！ |\n| **物流中心貨物（§60）** | **申請出物流中心進口日** | 非進儲日！ |\n| **出口貨物** | **海關放行日** | 非報關日！ |\n\n### 3. 徵收期間、擔保品與事後稽核\n- **徵收與執行期間（§9、細則 §4）** 🔥 113 Q2：\n  - **徵收期間**：自確定之**翌日**起 **5 年**內未經徵起不再徵收；分期／延期繳納者自各該期間屆滿之翌日起算。\n  - **執行期間**：徵收期間屆滿前已移送執行者，自徵收期間屆滿之翌日起 **5 年**內未執行不再執行；已開始執行者，自 5 年期間屆滿之日起逾 **5 年**未終結不得再執行（最長 5＋5＋5＝15 年）。\n- **擔保品 7 種類與游老師口訣（§11）**：\n  - 7 種：①現金 ②政府公債 ③銀行定期存單 ④信合社定期存單 ⑤信託投資公司 **1 年以上**普通信託憑證 ⑥授信機構之保證 ⑦其他財政部核准易變價保管且無產權糾紛財產（⚠️ **不含銀行信用狀、股票、個人支票、活存、未滿 1 年信託憑證**）。\n  - **游老師口訣**：「**有物設權，無物免設；二三四五七設權，一六不用**」（①現金、⑥授信保證免設質權／抵押權；其餘 5 種須設定抵押權或質權於海關）。\n- **事後稽核「6-2-3」三部曲（§13、§75）** 🔥 114 Q25、115 Q4：\n  - 放行翌日起 **6 個月內通知** → **2 年內實施**（⚠️ 陷阱常改 3 年！）→ **3 年內退補稅**。\n  - 對象含納稅義務人、輸出人及**關係人**（報關／運輸／承攬／倉儲／快遞／銀行／交易相對人）。\n  - 規避、妨礙、拒絕調查（§75）：處 **NT\\$3,000～30,000** 罰鍰，限期配合，屆期未配合**按次處罰**。\n\n---\n\n## 二、報關、補件、先行驗放與三大預先審核（§16～§28-1）\n\n1. **報關期限與補件（§16～§17、細則 §7）** 🔥 113 Q5：\n   - 進口：運輸工具進口日翌日起 **15 日內**；出口：結關或開駛前規定期限內（⚠️ 陷阱：出口非結關前 15 日）。\n   - 散裝、大宗、單一包裝免附裝箱單（細則 §7）。\n   - 裝箱單、輸出入許可證等得於**放行前**補附（⚠️ 非放行後）；海關通知翌日起 **2 個月內**未補送 → 限期退運出口或退關領回；放棄或逾期依／準用 §96。\n2. **先行徵稅驗放與押款驗放（§18、細則 §8～§9）**：\n   - §18Ⅰ 先行徵稅驗放：放行翌日起 **6 個月內**通知退補稅，逾期視為業經核定。\n   - §18Ⅱ 無法即時核定稅額：押相當應繳稅款保證金先行驗放，**6 個月內**核定。\n   - §18Ⅲ 欠證押款驗放：欠減免稅證明押「**全部應繳稅款**」；准許進口類欠輸入許可證押「**海關核定完稅價格**」；屆期未補辦**沒入保證金即結案**。\n   - §18Ⅳ 未押款先繳稅：得於放行前或**放行後 4 個月內**補附減免稅證明申請退稅。\n3. **優質企業 AEO（§19）** 🔥 113 Q4：優惠包含按月彙總繳稅、提供擔保或核准自行具結、特定報單先予放行，**不含「免予實施事後稽核」**！\n4. **查驗費用負擔（§23Ⅲ）** 🔥 113 Q6：進出口貨物由**納稅義務人或貨物輸出人**負擔；**轉口貨物**由負責申報之**運輸業者或承攬業者**負擔。\n5. **三大預先審核制度超級比較表（§21、§28、§36-1）** 🔥 113 Q6、114 Q26 必考！\n\n| 比較項目 | 稅則預審（§21） | 原產地預審（§28） | 完稅價格預審（§36-1） |\n| :--- | :--- | :--- | :--- |\n| **受理機關** | 各關區海關 | 各關區海關 | **財政部關務署** |\n| **進口前覆審機關** | 財政部關務署 | **原海關（⚠️ 陷阱：非關務署！）** | 財政部關務署 |\n| **答復期限** | 30 日（洽專家延至 120 日） | 2 個月（得延 2 個月） | 45 日（必要延至 90 日） |\n| **變更延長適用上限** | **90 日**（⚠️ 陷阱常改 30 日／2 月） | **90 日** | 收到通知翌日起 **90 日** |\n| **辦法訂定機關** | 財政部 | 認定標準：**財政部會同經濟部**\u003cbr\u003e預審辦法：財政部 | 財政部 |\n\n6. **自備封條四類業者（§28-1Ⅱ）** 🔥 114 Q3 超細考點：\n   - ① 海關登記之**船舶**運輸業／承攬業（所載海運貨櫃）。\n   - ② 自主管理且位於**機場管制區外**之航空貨物集散站業（**自有**之保稅運貨工具 — ⚠️ 114 Q3 漏「自有」兩字即錯！）。\n   - ③ 自主管理之**物流中心業**（運出之海運貨櫃、保稅運貨工具或核准運貨工具）。\n   - ④ 海關登記之**內陸貨櫃集散站業**（進儲或轉運出站之海運轉口貨櫃）。\n\n---\n\n## 三、完稅價格估價（§29～§42）🔥 113、115 年申論大題超級熱點！\n\n```mermaid\n%% diagram:law-valuation\nflowchart TD\n    M1[\"1. 交易價格法 (關§29)\u003cbr/\u003e實付或應付價格 + §29Ⅲ應加項目\"] --\u003e|不適用| M2[\"2. 同樣貨物交易價格 (關§31)\u003cbr/\u003e同國產製・同品質信譽\"]\n    M2 --\u003e|不適用| M3[\"3. 類似貨物交易價格 (關§32)\u003cbr/\u003e同國產製・可互換替代\"]\n    M3 --\u003e|不適用| M4[\"4. 國內銷售價格/倒扣法 (關§33)\u003cbr/\u003e⚠️ 與第5法唯二可依納稅人申請對調\"]\n    M4 \u003c--\u003e|申請對調| M5[\"5. 計算價格法 (關§34)\u003cbr/\u003e原料成本 + 加工費 + 利潤運保費\"]\n    M5 --\u003e|不適用| M6[\"6. 合理方法 (關§35)\u003cbr/\u003e禁止最低價/國內售價/隨意核定\"]\n```\n\n### 1. 交易價格公式與加減項（§29、細則 §11～§13）\n\u003e **完稅價格（DPV）＝ 實付或應付交易價格（FOB）＋ 國際運費（F）＋ 保險費（I）＋ 應加計項目（§29Ⅲ，須有客觀及可計量資料）**\n\n| 應加計項目（§29Ⅲ，6 大項） | 應扣除／不計入項目（細則 §11～§12） |\n| :--- | :--- |\n| 1. 買方負擔之**銷售佣金**、手續費、容器及包裝費\u003cbr\u003e2. 買方無償或減價提供之**協助費**（原料零件、工具鑄模模型、消耗材料、**國外**工程設計勞務）\u003cbr\u003e3. 依交易條件買方支付與貨物有關之**權利金及報酬**\u003cbr\u003e4. 買方轉售／使用收益歸賣方部分\u003cbr\u003e5. 運至輸入口岸之**國際運費、裝卸費、搬運費**\u003cbr\u003e6. **保險費**（海上／航空保費） | 1. **採購佣金（Buying Commission）**（獨立代理商替買方在國外採購之報酬）\u003cbr\u003e2. 進口後之**國內運輸費**（內陸陸運）\u003cbr\u003e3. 進口後之建築、設置、裝配、維護或技術協助費\u003cbr\u003e4. 取得於**國內複製**進口貨物之權利金\u003cbr\u003e5. 附延期付款條件之延期付款利息\u003cbr\u003e6. 進口關稅及其他稅捐 |\n\n\u003e 🔥 **115 年申論第 2 題（25 分）實戰計算**：FOB 發票貨價 10,000（已預付 2,000 屬實付價格**不可扣**）＋ 無償鑄模 3,000 ＋ 國際海運 900 ＋ 海上保費 400 ＝ **14,300 元**（排除：國外採購報酬 500、國內陸運 300、國內複製權 700）。\n\n### 2. 排除適用交易價格與「特殊關係」（§30、細則 §14）\n- 排除 4 情形：使用處分受限、交易附條件致價格無法核定、轉售收益歸賣方但金額不明、**特殊關係（8 款，核心數字：持股 ≥ 5% 表決權、配偶或三親等內親屬）且影響交易價格**。\n- 測試價格：出口日或進口日**前後 30 日內**無特殊關係之同樣／類似交易價、國內銷售價或計算價格。\n\n### 3. 六大估價法定優先順序（§29、§31～§35）🔥 113 申論二(二) 必考！\n1. **交易價格（§29）**\n2. **同樣貨物交易價格（§31）**：同生產國別、物理特性、品質、商譽；出口日前後 **30 日內**；有 2 種以上時依序選：同一廠商 → 交易型態與數量相當 → **最低者**（細則 §15）。\n3. **類似貨物交易價格（§32）**：同生產國別、功能相同、組成相似、可互為替代；前後 **30 日內**。\n4. **國內銷售價格／倒扣法（§33）**：進口前後 30 日內無銷售可延至翌日起 **90 日內**；以最大銷售數量單價，扣除利潤費用佣金、關稅稅捐、進口後運保費。\n5. **計算價格／加法（§34）**：生產成本＋正常利潤一般費用＋至口岸運裝搬保費；跨國查證須**廠商同意＋該國政府未反對**（細則 §18）。\n   - 💡 **必考規則**：**僅第 4 順位（§33）與第 5 順位（§34）得依納稅義務人請求對調順序**！\n6. **合理方法（§35、細則 §19）**—**七大禁止事項**：不得按①國產貨國內售價 ②兩種以上從高核估 ③輸出國國內售價 ④§34 以外生產成本 ⑤輸往第三國價格 ⑥海關訂最低完稅價格 ⑦任意或臆測價格。\n\n### 4. 特殊貨物估價與游老師「十分之一」口訣（§37～§41）\n\u003e 💡 **游老師黃金口訣**：「**租不低於十分之一，修不出示十分之一**」\n- **運往國外修理／裝配／加工復運進口（§37、細則 §20）** 🔥 113 Q27、114 Q4：\n  - 修理／裝配：按修理裝配費課稅（**不含運費與保險費**！⚠️ 114 Q4 陷阱）；免費修理提出原約／發票／往來函電證明者**免稅**；提不出證件者按**貨物本身完稅價格 × 1/10** 計課！\n  - 加工：復運進口完稅價格 － 原貨出口時同樣／類似貨物進口完稅價格（無則減原出口 FOB）。\n  - 期限：出口放行翌日起 **1 年內**復運進口，期滿前書面申請延長 **6 個月**（⚠️ 114 Q4 陷阱改延長 1 年！），逾期**全額課稅**。\n- **租賃貨物（§38、細則 §21～§24）**：限專利／製造秘密不能轉讓或財政部專案核准；DPV＝租賃費 **＋ 運費 ＋ 保險費**；重估租金每年不得低於本身完稅價格之 **1/10**；逾期未出口或租期內出售，按**逾限或出售當時折舊價值**補徵關稅。\n- **統一稅則（§40）vs 組合貨物（§41）** 🔥 114 Q5：\n  - §40（整套機器設備拆散）：須於**第一批進口放行前**檢附型錄藍圖、合約、機器設備表事前申請。\n  - §41（非機器組合貨物）：免申請由海關職權認定按整體歸類；細則 §27 認定三要件：①同一提貨單 ②數量適合整體所需 ③數量不足但**每套價值超過整體貨物價值 50%**！\n- **外幣匯率（§39）**：財政部關務署參考即期匯率**每旬（上／中／下旬）**定期公告。\n\n---\n\n## 四、繳稅、行政救濟與保全限境（§43～§48）\n\n```mermaid\n%% diagram:law-timeline\nflowchart LR\n    A[\"運輸工具進口日\"] --\u003e|15日內報關 §16| B[\"第16日起滯報費\u003cbr/\u003eNT$200/日 × 20日 §73\"]\n    B --\u003e|屆滿20日 第36日| C[\"變賣/拍賣貨物 §73\"]\n    D[\"稅單送達翌日\"] --\u003e|14日內繳稅 §43| E[\"第15日起滯納金\u003cbr/\u003e萬分之5/日 × 30日 §74\"]\n    E --\u003e|逾30日未繳| F[\"移送強制執行 §74\"]\n    D --\u003e|不服30日內 §45| G[\"復查 (2月+2月) → 訴願30日 → 行政訴訟2月\"]\n```\n\n- **黃金 14 日（§43）** 🔥 113 Q7/25、114 Q28：關稅、罰鍰／追繳貨價、變賣／銷毀費，均自送達翌日起 **14 日內**繳納。\n- **救濟三部曲（§45～§47）** 🔥 113 Q7：收到稅款繳納證翌日起 **30 日內**申請復查 → 海關收到申請書翌日起 **2 個月內**決定（延長 1 次最長 **2 個月**）→ 決定翌日起 **15 日內**送達正本 → 訴願 → 行政訴訟。確定退補稅於確定翌日起 **10 日內**退還或填發補繳通知，按**郵政儲金 1 年期定期儲金固定利率**按日計息。\n- **限制出境門檻（§48）**：假扣押**免提供擔保**；限境最長 **5 年**；欠稅達門檻：\n  - **已確定**：個人 **100 萬** ／ 法人 **200 萬**。\n  - **未確定（救濟中）**：個人 **150 萬** ／ 法人 **300 萬**。\n\n---\n\n## 五、稅款優待：免稅、損壞賠償、保稅與退補稅（§49～§66）\n\n### 1. 損壞／賠償／退稅三條文超級對照（§50 vs §51 vs §64）🔥 114 Q6/29/30 連考 3 題！\n| 條文 | 時點與要件 | 結果與必背期限 | 陷阱提醒 |\n| :--- | :--- | :--- | :--- |\n| **§50 損失免稅** | 國外運輸／起卸時、起卸後驗放前（天災不可抗力）、查驗破漏、放行前退運、驗放前自然短少（**未繳稅**） | **免徵關稅** | 細則 §39 **不得免稅**：放行未提領損壞、查驗**失竊**、包裝不善、開箱不慎、鮮貨延不報關腐爛、免驗提領後損壞 |\n| **§51 賠償調換** | **已課稅放行後**損壞或規格不符原約，國外賠償／調換 | **新貨免稅**。申請：原貨進口翌日起 **1 個月內**（**機器設備**：安裝就緒試車翌日起 **3 個月內**）；核准翌日起 **6 個月內**進口（可延 6 月） | 國外放棄舊貨仍須查驗，尚有價值須重行估價徵稅（細則 §42） |\n| **§64 特殊退稅** | **已繳稅**進口：①1 年內法令禁止銷售使用 ②**提領前**天災不可抗力致無價值 ③**提領前**申請退運或存保稅倉 | **退還原繳關稅**。法令禁止者須於禁止翌日起 **6 個月內**復運出口或監視銷毀 | 細則 §53：貨物**已逾有效期限**不能使用者，**不予退稅**！ |\n\n### 2. 原貨復運、外銷退運與保稅四業（§52～§65）\n- **原貨復運免稅（§52–§54）** 🔥 113 Q8：§52 復運**出口**限進口翌日起 **6 個月內**（非消耗品、須押金）；§53 復運**進口**限出口翌日起 **1 年內**；§54 暫准通關證（ATA Carnet）效期內免稅免報單免押金。\n- **減免稅變更用途補稅（§55、§76）**：翌日起 **30 日內**補稅；未補繳處補稅＋**應補稅額 1 倍**罰鍰。\n- **外銷三條文期限（§56、§57、§63）** 🔥 114 Q7：\n  - §56 未加工原料退運出口：進口放行翌日起 **1 年內**經財政部核准復運出口 → 出口翌日起 **6 個月內**辦免稅。\n  - §63 外銷品沖退原料稅：進口放行翌日起 **1 年 6 個月內**申請（不可抗力向財政部延 1 年）。\n  - §57 外銷品退貨復運進口：出口放行翌日起 **3 年內**免成品關稅（須補已退原料稅）；押金於進口翌日起 **6 個月內**整修再出口免補（不可抗力 1 年）。\n- **保稅四業（§58～§61）** 🔥 113 Q22、114 Q27：保稅倉庫（§58，僅**重整**）；物流中心（§60，重整＋**簡單加工**，非高層次加工）；保稅工廠（§59，製造加工外銷，免稅自用機器設備**輸入後 5 年內**內銷須補稅；擅自出廠內銷依 §78 論私運！）；免稅商店（§61）。\n- **報關前誤裝溢卸（§62）**：進口翌日起 **15 日內**申請、**90 日內**退運出口。\n- **短溢徵／短溢退（§65、細則 §54）**：期限 **1 年**（完納／退稅通知翌日），按郵儲 1 年定存固定利率計息；海關追補「**短徵／溢退**」限於「**顯然錯誤**」，納稅人申請「溢徵／短退」不受限！\n\n---\n\n## 六、特別關稅五大體系（§67～§72）🔥 113 Q23、114 Q31\n\n| 種類 | 條文 | 觸發原因 | 核定機關 | 關鍵上限與規則 |\n| :--- | :---: | :--- | :--- | :--- |\n| **平衡稅** | §67, §69 | 外國政府**補貼**＋損害產業 | 財政部會商公告 | 不逾**補貼金額**（財政部查補貼、經濟部查損害） |\n| **反傾銷稅** | §68, §69 | 低於**正常價格**傾銷＋損害產業 | 財政部會商公告 | 不逾**傾銷差額** |\n| **報復關稅** | §70 | 他國對我**歧視／差別待遇** | 報**行政院核定** | 採證：運輸團體事證、駐外經商報告 |\n| **機動關稅** | §71 | 國內外經濟特殊情況 | 報**行政院核定** | 一般 **±50%**、大宗物資 **±100%**；最長 **1 年** |\n| **特別防衛措施** | §72 | 進口救濟／國際協定防衛 | 報**行政院核定** | 提高關稅、關稅配額、**額外關稅（SSG）**（量超基準與價低基準二者從高） |\n\n---\n\n## 七、罰則階梯表、執行與「五大 5 年」口訣（§73～§99）\n\n### 1. 滯報費 vs 滯納金 vs 變賣費用扣繳次序（§73、§74、細則 §56）🔥 114 Q8\n- **滯報費（§73）**：逾 15 日未報關，按日 **NT\\$200**，徵滿 **20 日**變賣（第 36 天），餘款保管 **5 年**發還（逾期繳國庫）。\n- **滯納金（§74）**：逾 14 日未繳稅，按日欠稅額 **萬分之五（0.05%）**，徵滿 **30 日**（上限 1.5%）變賣或執行；機器分期（§77）與原料記帳逾期（§79）滯納金上限拉高至 **15%**（§79 期滿後 6 個月內出口免徵）。\n- **變賣必要費用扣繳順序（細則 §56Ⅱ）** 🔥 114 Q8：**①處理變賣貨物所需費用 → ②倉租、裝卸費 → ③滯報費、滯納金**。\n- **不得進口貨物（§96、細則 §60–61）** 🔥 113 Q37、114 Q9：責令 **2 個月內**退運（必要延長 **1 個月**）；變賣餘款**悉數繳歸國庫**（不可 5 年領回！）；已放行貨物追繳貨價須於**放行翌日起 1 年內**為之（不服追繳貨價依 §95 **免復查，逕提訴願**）。\n\n### 2. 全書罰鍰階梯總表（游老師衝刺表）\n| 罰鍰級距 | 適用條次與對象 | 必背重點 |\n| :--- | :--- | :--- |\n| **NT\\$2,000～5,000** | §84Ⅲ **專責報關人員** | 全書最低；按次、3 次未改停審核 6 月或廢登記 |\n| **NT\\$3,000～30,000** | §75 規避妨礙拒絕調查（§13, §42） | 按次處罰 |\n| **NT\\$6,000～30,000** | §81 連線、§83 運輸、§83-1 承攬、§84Ⅰ 報關業、§85 保稅運貨工具、§87 快遞、§88–91 保稅四業 | 三振條款（3 次未改停業 6 月或廢照）；§84Ⅱ 主動更正免罰 |\n| **NT\\$6,000～300,000** | §86-1 **自主管理業者** | 上限 30 萬 |\n| **NT\\$100,000～500,000** | §82 **通關網路業者**（如關貿） | 裁處機關為「**財政部**」（非海關！） |\n| **NT\\$6,000～3,000,000** | §86 **貨棧、貨櫃集散站** | 全書最高（300 萬） |\n| **無罰鍰（特權剝奪）** | §87-1 自備封條（停 1 年）、§92 沖退稅（停記帳 6 月）、§93 擔保不足（停 6 月或廢登記） | 常考「何者無罰鍰」 |\n\n### 3. 游老師「關稅法五大 5 年」口訣 ＋ 微額免徵（§99）\n- **五大 5 年**：「**追錢**（§9 徵收期確定翌日）、**查帳**（§98 文件保存放行翌日）、**解禁**（§59 保稅廠自用設備輸入後）、**防逃**（§48 限制出境最長 5 年）、**領錢**（§73 變賣餘款發還）」\n- **微額免徵（§99）**：補徵關稅 **≤ 200 元**；營業稅／貨物稅／菸酒稅／特銷稅 **≤ 300 元**；推貿費 **≤ 100 元**。\n"},{"id":"02_關務法規概要_02_海關緝私條例","cat":"關務法規概要","title":"海關緝私條例","md":"# 02｜海關緝私條例【完整精讀版】\n\n\u003e **整合來源**：游邵予講師《海關緝私條例、懲治走私條例（175 頁完整精華與記憶口訣）》＋ 全國法規資料庫全文（§1–§54）＋ **113–115 年考畢試題**。\n\u003e\n\u003e **🔥 命題規律**：幾乎**年年必考 1 題申論（20–25 分）＋ 6–10 題選擇**！113 年申論考 §39-1 智財權＆§43 不正當減免退稅；114 年申論考香菇低報數量價格（進口人 vs 報關業違規）；115 年申論考虛報管制物品＋5 年累犯 3 次以上！\n\n---\n\n## 一、基本定義、查緝權限與扣押處置（§2～§22）\n\n1. **核心定義（§2～§5）**：\n   - **通商口岸（§2）**：經政府開放對外貿易並設有海關之港口、機場或商埠。\n   - **私運貨物（§3）**：**規避檢查、偷漏關稅或逃避管制**，未經向海關申報而運輸貨物進出國境（但書：船舶清倉廢品報關完稅者除外）。\n   - **貨價計算基準（§5）**：**進口＝完稅價格（CIF）**；**出口＝離岸價格（FOB）**。\n2. **查緝水域、武力與搜索見證人（§6～§16-1）** 🔥 113 Q29：\n   - **查緝水域（§6）**：通商口岸、沿海 **24 海里**（領海 12＋鄰接區 12）以內水域及其他法律得查緝場所。\n   - **武器使用辦法（§7）**：由**行政院**定之（⚠️ 非財政部／海巡署）；抗命停駛回航降落者得**射擊之**（§8，僅以阻止繼續行駛為目的）。\n   - **勘驗搜索見證人（§10）**：一般場所＝占有人／同居人／僱用人／鄰人**並當地警察**；運輸工具＝**管理人**（⚠️ 陷阱：**不須港警**！）；政府機關／公營事業＝會同**指定人員**。\n   - **人身搜索（§11）**：關員 **2 人以上** 或關員以外**第三人**在場；搜婦女須**女性關員**。\n   - **夜間限制（§13）**：不得於**日沒後日出前**為之（例外：日沒前已開始有繼續必要、違反行為正在進行）。\n   - **軍警權限（§16）**：通商口岸軍警須經請求「協助查緝」；**非通商口岸**軍警得「**逕行查緝**」，但須將查緝結果連同私貨**移送海關處理**（不得自行處分）。\n3. **扣押與變賣毀棄（§17～§22）** 🔥 113 Q10、114 Q10：\n   - 違反貨物「**應**」扣押（§17）；運輸工具內查獲情節重大為繼續勘驗搜索「**得**」扣押（§17）；應受／得受沒入之運輸工具「**得**」扣押（§18）。\n   - 解送困難或保管不易 → 查封交所有人／管領人／持有人**具結保管**或當地公務機關保管（§19）。\n   - 不能依 §19 處理或有**腐敗、毀損之虞** → 得於**案件確定前**（⚠️ 陷阱常改確定後！）公告變賣保管價金或逕送有關機關處理並通知；**易生危險**者得**毀棄之**（§20）。\n   - 得提供相當保證金或其他擔保申請**撤銷扣押**（§21）。\n\n---\n\n## 二、罰則全體系總表與游老師秒記口訣（§23～§43）🔥 申論＋選擇雙重核心！\n\n```mermaid\n%% diagram:law-smuggling\nflowchart TD\n    Q[\"違章 / 走私行為\"] --\u003e T1[\"虛報・逃漏稅 (緝私§37)\u003cbr/\u003e漏稅額 5 倍以下罰鍰＋得沒入\"]\n    Q --\u003e T2[\"私運貨物進出 (緝私§36)\u003cbr/\u003e貨價 3 倍以下罰鍰＋沒入貨物\"]\n    Q --\u003e T3[\"私運管制物品逾公告數額 (走私§2)\u003cbr/\u003e刑事 7 年以下徒刑＋得併科 300 萬罰金\"]\n```\n\n### 1. 「貨價倍數＋沒入」族群\n| 條文 | 違章行為 | 罰鍰與沒入 | 記憶口訣／歷屆考點 |\n| :---: | :--- | :--- | :--- |\n| **§28** | 未達正當卸貨地點擅行起卸（管領人、轉載放置收受幫同者） | **貨價 2 倍以下**＋得沒入貨 | 口訣「**28 → 2 倍**」 |\n| **§36Ⅰ,Ⅲ** | 私運或經營私運貨物進出口 | **貨價 3 倍以下**＋**應沒入貨** | 私運基礎條文（未申報） |\n| **§37Ⅲ** | 報運進出口虛報而涉及**逃避管制**（轉據 §36Ⅰ、Ⅲ） | **貨價 3 倍以下**＋**應沒入貨** | 🔥 **115 申論第 1 題！**（虛報非管制貨名闖關，不再用漏稅 5 倍！） |\n| **§39Ⅰ** | 旅客攜帶應稅／管制物品匿不申報或規避檢查 | **應沒入**，並**得**處貨價 3 倍以下 | 不隨身行李改依 §37 |\n| **§39-1** | 報運進出口非屬真品平行輸入之**侵害專利、商標或著作權** | **貨價 3 倍以下**＋**沒入貨**（他法有特別規定從其規定） | 🔥 **113 申論三(一)** |\n| **§31** | 貨物未列艙口單／載貨清單且無運送契約文件（轉 §36Ⅰ、Ⅲ） | 罰**運輸業者**貨價 3 倍以下＋沒入（責任歸貨主罰貨主） | 🔥 114 Q38 |\n\n### 2. 「所漏稅額／溢沖退稅額 5 倍以下＋沒入」族群\n| 條文 | 違章行為 | 罰鍰與沒入 | 考場陷阱提醒 |\n| :---: | :--- | :--- | :--- |\n| **§37Ⅰ** | 報運**進口**虛報：①名稱／數量／重量 ②品質／價值／規格 ③繳驗偽變造或不實發票憑證 ④其他違法行為 | **所漏進口稅額 5 倍以下**，或沒入或併沒入貨 | ⚠️ **「虛報稅則號別」不屬 §37Ⅰ 態樣**（115 Q13）！口訣「37＝生氣 5 倍」 |\n| **§37Ⅳ** | 加工外銷沖退稅報運出口虛報 | **溢沖退稅額 5 倍以下**＋得沒入貨 | 針對沖退稅出口案件 |\n| **§43** | 以不正當方法請求免稅、減稅或退稅 | **所漏或溢沖退稅額 5 倍以下**＋得沒入貨 | 🔥 **113 申論三(二)** |\n\n### 3. 「定額罰鍰與單純沒入」族群（游老師口訣速記！）\n| 條文 | 違章行為 | 處罰內容 | 游老師口訣／歷屆出處 |\n| :---: | :--- | :--- | :--- |\n| **§23** | 運輸工具抗受查緝 | 管領人 **6 萬～12 萬**（專載私貨併沒入運輸工具） | 「抗命不停留」 |\n| **§24** | 擅駛入非通商口岸 | **沒入運輸工具**（不可抗力函報除外） | 單純沒入 |\n| **§25** | 24 海里內或追緝中毀壞拋棄貨物文件 | 管領人及行為人**各 3 萬～15 萬**，得沒入船舶 | 「閃查緝」 |\n| **§26** | 發遞走私信號 | **3 萬以下** | 「鏡子閃閃」🔥 113 Q30 |\n| **§27** | 利用運輸工具私運進口、出口、起岸、搬移 | 管領人 **5 萬～50 萬**（⚠️ 非貨價 3 倍！）；運送業包庇得停 **30 天以內**結關出口；載運**槍砲彈藥毒品**為主要目的→**沒入之** | 🔥 113 Q12、115 Q33 |\n| **§31-1** | 貨物與艙單／運送契約不符 | **沒入貨物**（證明確屬誤裝除外） | 🔥 113 Q11 |\n| **§35** | 海關監管／加封擅行改裝移動拆封開鎖 | **6 千～6 萬**，按次、情節重大加倍 | 「鑰匙對應」🔥 113 Q11 |\n| **§36Ⅱ** | 起卸／裝運／收受／藏匿／收買／代銷私運貨 | **9 萬以下**＋沒入（§36Ⅳ 不知情免罰） | 「酒＝9 萬」🔥 113 Q11（陷阱改 3 倍！） |\n| **§37Ⅱ** | 報運**出口**虛報（無涉管制與沖退稅） | **300 萬以下**＋得沒入貨 | 🔥 114 Q39 |\n| **§38** | 郵包未正確載明涉走私／逃避管制 | **得沒入**並通知收／寄件人 | 郵包專條 |\n| **§40** | 預留國外廠商簽字空白進口發票 | 持有人 **3 萬以下**＋沒入文件 | 「空白聯想鏡子＝3 萬」 |\n| **§41** | 報關業者不實記載報單 | 處所漏或溢沖退稅額 **5 倍以下**（或定額），得停業 1–6 月／廢照；因貨主提供不實文件或無故意過失免罰報關業 | 🔥 **114 申論第 1 題核心！** |\n| **§41-1** | 報關業／貨主使運輸／倉儲業不實登載證明 | 雙方分別處 **6 千～6 萬** | 「大順報關」🔥 113 Q11 |\n| **§42** | 拒絕送驗帳冊單據或意圖湮滅證據 | **6 萬以下** | 「一溜煙＝6 萬」 |\n\n---\n\n## 三、時效、累犯、主動更正免罰、沒入處理費與救濟執行（§44～§53）\n\n1. **追徵與裁處時效（§44）**：情事發生已滿 **5 年**不得再追徵或處罰。\n2. **累犯加重（§45）** 🔥 114 Q40、115 申論一＆選擇 Q33：\n   - 追徵或處分確定後 **5 年內**再犯本條例**同一規定（同條項）**：\n     - 再犯（第 2 次）：罰鍰得加重 **1/2**。\n     - 犯 **3 次以上**：罰鍰得加重 **1 倍**。\n   - **115 申論第 1 題實戰**：完稅價 50 萬管制物品虛報闖關（§37Ⅲ 轉 §36Ⅰ、Ⅲ 貨價 3 倍＝150 萬＋沒入）＋ 5 年內同違法處分確定 3 次以上（§45 加重 1 倍）→ 罰鍰上限提高至貨價 **6 倍（300 萬元）**，並沒入貨物！\n3. **沒入物不以屬受處分人所有為限（§45-2）**。\n4. **主動申請更正／陳報免罰（§45-3）** 🔥 114 Q34、歷年申論超級熱點！：\n   - 適用對象：報單申報錯誤涉 **§37 或 §39Ⅱ**（⚠️ 不含 §36 未申報私運！）。\n   - 前提：於海關、稅捐稽徵機關或其他協助查緝機關（含檢警調）**接獲檢舉、進行調查前**主動申請更正並經核准。\n   - 兩大時點條件：\n     - **放行前**：免驗貨物（C1/C2）；或應驗貨物（C3）**未涉及逃避管制**且於**補送報單及文件前**提出（須於接獲連線核定通知**翌日辦公時間終了前**補送）。\n     - **放行後**：**未經海關通知實施事後稽核**（🔥 114 Q34 正解！）。\n   - 應補稅款須按**郵政儲金 1 年期定存固定利率按日加計利息**一併繳納，始得免罰。\n5. **沒入物處理費（§45-4）** 🔥 115 Q12：處理費用逾財政部公告 **NT\\$5,000** 者，命受處分人負擔**全額費用**（支付日起 5 年內處分）。\n6. **處分書、復查、執行與備款購回（§46～§53）** 🔥 114 Q11、115 Q14：\n   - §46：所有人不明之沒入物**仍須製作處分書**，以公告或刊登公報／新聞紙代替送達。\n   - §47～§48：處分書送達翌日起 **30 日內**向原處分海關申請復查 → **2 個月內**決定（得延 1 次最長 **2 個月**）→ 決定翌日起 **15 日內**送達正本 → 訴願 → 行政訴訟（確定退稅 10 日內加計郵儲利息）。\n   - §50～§51 執行：處分確定收到通知翌日起 **30 日內**（⚠️ 區別關稅法 §43 是 14 日！）未繳稅罰 → 擔保品或扣押物**拍賣**（拍賣 **5 日前**通知）→ 不足強制執行，並得**停止在任何口岸報運進出口至繳清之日止**。\n   - §53 沒入物備款購回：准許進出口者無金額限制；**管制進出口者貨價 NT\\$45 萬元以下**（體積過巨、易損壞變質或不易拍賣者不受 45 萬限制）；**違禁品或禁止進出口貨物不得購回**。\n\n---\n\n## 四、申論三段論法示範（114 年申論第 1 題，25 分）\n\u003e **題旨**：A 進口越南乾香菇，委託 B 報關行申報 30,000 kg／1,300 萬，查驗實到與**報關發票皆為 40,000 kg／1,500 萬**，問進口人 A 與報關業 B 分別觸犯何法及處罰？\n- **進口人 A**：\n  - 依《海關緝私條例》§37Ⅰ①②，報運進口虛報數量、價值 → 處**所漏進口稅額 5 倍以下**罰鍰，或沒入或併沒入貨物，並依 §44 追徵所漏稅款（惟因發票所載與實到相符，非屬 A 提供不實發票，如係 B 擅自低報，應視 A 有無故意過失依行政罰法審認責任）。\n- **報關業者 B**：\n  - ① 依《海關緝私條例》§41Ⅰ：報關業者向海關遞送報單對於數量、價值為不實記載（與客戶發票明顯不符，不得主張免責！）→ 處**所漏進口稅額 5 倍以下**罰鍰，並得停止營業 1–6 月；情節重大者廢止報關業務證照。\n  - ② 依《報關業設置管理辦法》§13（電腦申報資料與報關有關文件不一致）轉據 §35 及《關稅法》§84Ⅰ：處警告或 **NT\\$6,000～30,000** 罰鍰，限期改正、按次處罰、3 次未改或情節重大停業 6 月以下或廢照；另 B 所屬**專責報關人員**未切實審核簽證違反 §20、§21，依 §37／§38 處警告或 **NT\\$2,000～5,000** 罰鍰！\n"},{"id":"02_關務法規概要_03_懲治走私條例","cat":"關務法規概要","title":"懲治走私條例","md":"# 03｜懲治走私條例【完整精讀版】\n\n\u003e **整合來源**：游邵予講師《海關緝私條例、懲治走私條例》刑度口訣表 ＋ 全國法規資料庫最新全文（§1–§13）＋ 行政院《管制物品管制品項及管制方式》＋ **113–115 年考畢試題**。\n\u003e\n\u003e **🔥 考場投報率之王**：全文僅 13 條，但**每年穩定必考 2～3 題選擇題**（113 Q13/31/32、114 Q35/36/37、115 Q11/15），背完這兩張表直接全拿！\n\n---\n\n## 一、各條刑度、罰金與游老師必背口訣（§2～§12）\n\n| 條次 | 犯罪構成要件 | 自由刑 | 罰金（新臺幣） | 未遂犯 | 游老師記憶口訣／真題 |\n| :---: | :--- | :--- | :--- | :---: | :--- |\n| **§2** | 私運**管制物品**進口、出口 | **7 年以下** | 得併科 **300 萬以下** | **罰！** | **「妻子（7）唐詩 300」**🔥 113 Q31、114 Q35、115 Q11 |\n| **§3** | 運送、銷售或藏匿 §2 走私物品 | **5 年以下**、拘役 | 或科或併科 **150 萬以下** | **罰！** | **「150cc 重機（5）」** |\n| **§4** | 犯走私罪而**持械拒捕／拒檢**\u003cbr\u003e① 傷害人致死\u003cbr\u003e② 致重傷 | ① **死刑、無期或 10 年以上**\u003cbr\u003e② **無期或 10 年以上** | ① **1,000 萬以下**\u003cbr\u003e② **800 萬以下** | — | **「死棒狀（1000）、八眉毛（800）」** |\n| **§5** | 公然**為首**聚眾持械拒捕或威脅關員 | **無期或 7 年以上** | 得併科 **500 萬以下** | — | **「無七（500）」** |\n| **§6** | 持械傷人未致重傷；公然聚眾威脅關員**在場助勢** | **3 年以上 10 年以下** | 得併科 **500 萬以下** | — | **「三十、500」**🔥 113 Q13 正解！ |\n| **§7** | 鐵路、公路、航空、水運等**公眾運輸工具人員**明知走私不通報 | **3 年以下**、拘役 | **或科 150 萬以下**（⚠️ **不得併科！**） | — | **「山線（3）交通工具 150」** |\n| **§9** | 稽徵關員或依法負責檢查人員，明知走私而**放行、銷售或藏匿** | **7 年以上** | 無罰金 | **罰！** | **「G＝7」**🔥 113 Q32 正解！ |\n| **§10** | 公務員、軍人**包庇走私** | **無期或 7 年以上** | 無罰金 | **罰！** | **「關到無妻（無期／7）」** |\n| **§11** | 補充適用 | 走私處罰，海關緝私條例及本條例無規定者，適用**刑法或其他有關法律** | — | — | 🔥 115 Q11 |\n| **§12** | 兩岸準用 | 自**大陸地區**私運物品進入臺灣，或自臺灣私運前往大陸，**以私運物品進口、出口論** | — | — | 🔥 115 Q11 |\n\n---\n\n## 二、行政院公告《管制物品管制品項及管制方式》（§2Ⅲ）🔥 年年必考！\n\n\u003e 💡 **立法目的口訣（§2Ⅲ）**：「**農民犯金條**」（農業發展、國民健康、防止犯罪、金融秩序、國際條約協定），由**行政院**公告。\n\n### 1. 管制進出口物品（無金額、無重量門檻，私運即觸刑責！）\n1. **槍械、子彈、事業用爆炸物**（⚠️ 115 Q15 陷阱改成「事業用**廢棄物**」→ 錯！是**爆炸物**！）\n2. **偽造或變造之各種幣券、有價證券**（⚠️ 115 Q15 陷阱「印製偽幣印模」非本項所列！）\n3. **毒品危害防制條例所列毒品及其製劑、罌粟種子、古柯種子及大麻種子**。\n\n\u003e ⚠️ **萬年陷阱題（114 Q36、115 Q15 連考）**：「**侵害專利權、商標權及著作權之物品**」屬《關稅法》§15 不得進口物品及《海關緝私條例》§39-1 行政罰範疇，**不是**《懲治走私條例》附表管制物品！\n\n### 2. 管制進口物品（大陸地區農漁產品「10 萬元 OR 1,000 公斤」雙門檻！）\n- **適用範圍**：一次私運**原產地為大陸地區**而未經主管機關公告准許輸入之：\n  - 海關進口稅則 **第 1 章至第 8 章**所列物品（活動物、肉類、魚類、乳蛋、動植物產品、蔬菜、水果），**以及**\n  - **稻米、稻米粉、花生、茶葉、種子（球）**。\n  *(⚠️ 排除常見混淆品：花生油〔第 15 章〕、牛仔褲、磁磚不在此限額內，僅屬行政罰管制！)*\n- **構成刑責門檻（符合任一項即構成犯罪！）** 🔥 114 Q37、115 Q11：\n  - 完稅價格總額**超過新臺幣 10 萬元**，**或**\n  - 重量**超過 1,000 公斤**。\n  *(例：私運未准輸入大陸稻米 1,100 公斤、完稅價 9 萬元 → 重量逾 1,000 公斤，仍屬管制進口物品！)*\n\n---\n\n## 三、《懲治走私條例》vs《海關緝私條例》終極對照\n\n| 比較項目 | 懲治走私條例 | 海關緝私條例 |\n| :--- | :--- | :--- |\n| **法律性質** | **行政刑罰（刑事特別法）** | **行政秩序罰** |\n| **偵審與處分機關** | 檢察官偵查 → 法院刑事審判 | **海關**製作處分書 |\n| **處罰種類** | 死刑、無期徒刑、有期徒刑、拘役、罰金、沒收 | 罰鍰、沒入貨物／運輸工具、停止結關等 |\n| **未遂犯** | **處罰未遂犯**（§2、§3、§9、§10） | 原則處罰既遂（報運虛報經查獲即成立） |\n| **救濟途徑** | 刑事上訴程序 | 復查（30 日）→ 訴願 → 行政訴訟 |\n| **競合原則** | 依《行政罰法》§26 採**刑事優先**（罰鍰不併罰，但沒入等其他種類行政罰仍得併處；刑事不起訴／無罪／緩起訴確定後仍得由海關補處罰鍰） | 同左 |\n"},{"id":"02_關務法規概要_04_報關業設置管理辦法","cat":"關務法規概要","title":"報關業設置管理辦法","md":"# 04｜報關業設置管理辦法【完整精讀版】\n\n\u003e **整合來源**：邱淑卿老師《關務法規(業者管理)（82 頁）》、《103–114 年歷屆試題附解答（37 頁）》＋ 全國法規資料庫 **115/02/23 最新修正全文（44 條）** ＋ **113–115 年考畢試題**。\n\u003e\n\u003e **🔥 命題密集度**：《關務法規概要》每回固定考 **6–8 題選擇題**（113 申論第 1 題更直接考「報關業受委任報關應注意事項」10 分！）。\n\n---\n\n## 一、設置資格、四步驟程序、跨區連線與規費（§2～§10、§9-1、§41）\n\n1. **資本額與人員門檻（§2、§3、§7）** 🔥 113 Q33/38、114 Q13：\n   - **定義**：報關業員工**包括報關業負責人**（§2）。\n   - **資本額**：臺灣本島 **NT\\$500 萬元以上**；離島地區（澎湖、金門、連江）**NT\\$100 萬元以上**（離島業欲於本島設處所須符合本島條件並經海關核准）。\n   - **人員**：員工應有 **1 人以上**具專責報關人員資格（⚠️ 114 Q13 陷阱改 2 人）；負責人或授權掌理報關業務之經理人應具 **3 年以上**報關實務經驗且不得在他報關業兼職。\n   - **營業處所與候單箱（§5）**：每一縣市以 **1 處**為限（報准可增設），每處指定接洽公務人員，應向海關借用候單箱。\n2. **設置四步驟（關稅法 §22Ⅱ、辦法 §3～§4）**：\n   - ① 申辦公司／商業登記**前**向所在地關區／分關申請審查許可（**已成立公司商號申請增加報關業營業項目者亦同**！⚠️ 114 Q13 陷阱）→ ② 辦公司／商業登記 → ③ 檢附申請書、股東／合夥人名冊、專責名冊證書、**所在地報關商業同業公會會員證**（無公會者檢具同關區他縣市贊助會員證）請領報關業務證照 → ④ 執業。\n3. **跨關區連線（§6）**：原則須於他關區另領證照；但得向原發照關區申請**跨區連線**並指定他關區報關業接洽公務，專責人員即得跨關區執業（目前公告適用：**自由貿易港區報單 F1、F3、F4、F5**）。\n4. **公開資訊（§9-1，112.05.26 增訂）** 🔥 114 Q13 正解：海關得於機關網頁公開報關業名稱、統編、地址、電話、負責人／經理人姓名供任何人查閱。\n5. **證照規費（§41、規費規則 §14）**：新發證照／AEO 證書 **NT\\$2,000**；補發／換發 **NT\\$1,000**；僅辦理校正代換照者**免徵**。\n\n---\n\n## 二、三類人員消極資格與繳銷年限超級對照（§8、§10、§18、§24）🔥 陷阱重災區！\n\n| 對象 | 必背消極資格年限（112.05.26 修嚴後現行版） | 處理期限與罰則 |\n| :--- | :--- | :--- |\n| **負責人／授權經理人（§8）** | • 破產未復權、逃漏稅捐處分未結案、觸犯關務法規情節重大、無／限制行為能力或輔助宣告\u003cbr\u003e• 重大喪失債信未了結或了結未逾 **2 年**（⚠️ 114 Q16 改 5 年）\u003cbr\u003e• 偽造文書／詐欺／背信／侵占／違反工商管理判刑 **1 年以上**確定，執行完畢／緩刑滿／赦免後未逾 **2 年**（🔥 113 Q15）\u003cbr\u003e• 公務員受**免除職務**確定未滿 **5 年**或撤職停止任用期未滿（🔥 114 Q16 正解）\u003cbr\u003e• 前負責／掌理報關業違規**廢照未逾 5 年**（112 年由 2 年修嚴為 5 年！）\u003cbr\u003e• 槍砲／走私／毒品／組織犯罪有罪確定後未逾 **5 年** | 申請不予許可；已發照者限 **10 日內變更**，逾期廢止證照 |\n| **專責報關人員（§18）** | • 有 §8 各款、公職人員及公營事業人員、在他報關業兼職、偽變造不實文件取得登記\u003cbr\u003e• 經海關**廢止執業登記未滿 3 年**\u003cbr\u003e• 因海關職務有關行為對海關員工施以**強暴／脅迫／恐嚇／公然侮辱**危害人身財產安全未滿 **5 年**（⚠️ 114 Q33 陷阱改 3 年！） | 廢止執業登記，通知所屬報關業限 **45 日內變更登記**（⚠️ 113 Q3 改 30 日），並命 **3 日內繳銷報關證**（⚠️ 115 Q18 改 5 日、113 Q3 改 10 日） |\n| **報關業員工（§24）** | • 涉犯槍砲／走私／毒品／組織犯罪有罪確定未逾 **5 年**（🔥 115 Q19 正解）\u003cbr\u003e• 對海關員工施暴／脅迫／恐嚇／公然侮辱未滿 **5 年** | 不予核發報關證；已發者命 **3 日內繳銷**（5 年內不得請領） |\n\n\u003e 📌 **「廢照／註銷禁業年數」一眼秒記**：報關業證照廢止重設禁期（§10）＝**5 年**（含同一公司、商號及分支機構名稱）；專責登記廢止＝**3 年**（對關員施暴＝**5 年**）；員工報關證註銷＝**5 年**。\n\n---\n\n## 三、校正、變更、離職、停業與文件保管天數總表\n\n| 事項 | 條文 | 精準期限與要件 | 歷屆真題 |\n| :--- | :---: | :--- | :---: |\n| **證照定期校正** | §9 | **每 5 年**校正 1 次（須有**當地報關公會**校正簽章或文件） | 113 Q14 |\n| **重大變更（事前許可）** | §11Ⅰ | 變更**負責人、組織合夥人、遷移地址、增減資本額、名稱**（5 項）→ **事前書面報經海關許可** → 完成他機關變更登記翌日起 **30 日內**向海關換照 | 113 Q17、115 Q16 |\n| **事後報備（免事前許可）** | §11Ⅱ | **授權掌理報關業務之經理人變更**、**負責人或經理人死亡**（2 項）→ 事實發生翌日起 **30 日內**書面報備 | 113 Q17 |\n| **員工／專責人員離職** | §24Ⅰ | 離職翌日起 **1 個工作日內**書面或線上申報，並於 **7 日內**繳銷報關證（⚠️ 陷阱改 3 工作日） | 114 Q18、115 Q19 |\n| **解散／自行停業／廢照停業** | §31Ⅰ | 均須於事實發生日起 **5 日內**繳銷報關業務證照 | 113 Q35、114 Q15、115 Q40 |\n| **暫停營業／連續無營業** | §31Ⅱ,Ⅲ | 停業前書面報備（復業同；停業期復報關**視為已復業**）；最長 **6 個月**，情形特殊核准展延 **1 次**（以 **6 個月**為限） | 114 Q15、115 Q40 |\n| **文件保管：1 年 vs 5 年** | §15 | **1 年**（放行翌日）：C1 或未通知補件即放行之 C2/C3，「受託連線申報所依據之報關有關文件」。\u003cbr\u003e**5 年**（放行翌日）：書面報單、自有報關文件、電腦檔案，以及海關通知補件之 C2/C3 全部文件。 | 108/109/110 連考 |\n\n---\n\n## 四、委任書、員工責任、專責職責、錯單率與獎勵罰則\n\n1. **委任書（§12）** 🔥 114 Q14：\n   - 固定進出口人長期委任經海關登錄後，於報單填載**登錄字號**即可（免逐件附影本）。\n   - 由**報關業**自行妥為保存（非進出口人）；得以電子簽章法電子文件或線上電子訊息傳輸辦理委任。\n2. **員工佩證與免責但書（§24-1）** 🔥 115 Q19 陷阱：\n   - 員工辦理報關納稅業務視為代表報關業，報關業負全部責任；**但報關業選任員工及監督其職務之執行已盡相當之注意者，得免除其責任**！\n3. **專責報關人員職責、禁止與拒絕簽證（§20～§22）** 🔥 113 Q3：\n   - 職責 4 項（審核遞送文件、審核簽證報單、審核申請文件、提供海關相關資料）；**連線申報者免於進出口報單上簽章**；發票／裝箱單等附件**得授權員工上傳**；進修講習無正當理由不得缺席。\n   - **禁止行為 8 款（§21）**：出借名義／憑證密碼、不實簽證、收受不正當酬金、不正當招攬、明知不實不更正、**空白報單預先簽章**、洩漏工商秘密等。\n   - **應拒絕簽證並報告海關 3 款（§22）**：委任人或報關業意圖使作不實簽證、故意不提供真實必要資料、隱瞞欺騙致無法正確審核。\n4. **獎勵措施（§32、§33）** 🔥 113 Q36：\n   - **專責人員表揚（§32）**：執行業務滿 **3 年以上**（前一年簽證 500 份以上、年錯單率未逾 **千分之一**、無處分、薪資不低於基本工資）。\n   - **報關業降低抽驗比率（§33）**（每年 2 月底申請、4/1～翌年 3/31 生效；取消資格 **2 年內**不得重申請）：\n     - **AEO 報關業**：降 **51%～75%**（每 3 年校正）\n     - **第一類**：降 **26%～50%**（設立 3 年＋年錯單率 ≤ 千分之三＋12 項全符）\n     - **第二類**：降 **0%～25%**\n5. **罰鍰三級距總表與「停業／廢照認定原則」（§34～§39）** 🔥 113 Q16、114 Q12/17、115 Q20：\n   | 違規主體與情形 | 條文 | 罰鍰級距與最重處分 |\n   | :--- | :---: | :--- |\n   | **專責人員違規／月錯單超標** | §37, §38 | 警告或 **NT\\$2,000～5,000**（按次、3 次未改停審核 6 月；§37 有廢止登記、§38 錯單**無廢止登記**）。\u003cbr\u003e🔥 §38 處罰門檻：當月錯單 **6 次以上且錯單率達 1%（百分之一）**！ |\n   | **報關業一般違規／串通舞弊／出借名義** | §34–§36 | 警告或 **NT\\$6,000～30,000**（按次、3 次未改或情節重大停業 **6 個月以下**或廢照）。\u003cbr\u003e⚠️ §35 負責人或經理人因串通舞弊／出借名義受有期徒刑 **1 年以上**宣告確定 → **逕廢照，不受處罰 3 次限制**！ |\n   | **報關業冒用名義／偽變造委任書／詐欺** | §39Ⅱ | 警告或 **NT\\$10,000～30,000**（按次、3 次未改或情節重大停業 6 月以下或廢照）；以不實文件騙取證照（§39Ⅰ）→ **直接廢照**！ |\n   | **情節重大停業／廢照認定原則** | 關 §84Ⅰ | 例：不能提示委任書（§12）或冒用名義（§39Ⅱ）於最近 1 年內報運**非洲豬瘟疫區豬肉製品達 3 次以上**、或報運毒品／槍械等重大違規，直接依關稅法 §84Ⅰ 裁處停業或廢照（不服處分依《訴願法》**直接提訴願**，非復查！）。 |\n"},{"id":"02_關務法規概要_05_貨物通關自動化實施辦法","cat":"關務法規概要","title":"貨物通關自動化實施辦法","md":"# 05｜貨物通關自動化實施辦法【完整精讀版】\n\n\u003e **整合來源**：邱淑卿老師《103–114 年歷屆試題附解答（p.22–37 全解析）》＋ 全國法規資料庫最新現行全文（§1–§27）＋ **113–115 年考畢試題**。\n\u003e\n\u003e **🔥 高投資報酬率**：全辦法僅 27 條（民國 **81 年 9 月 8 日**訂定實施），但每回《關務法規概要》固定命題 **5～6 題選擇題**，且歷年重複度高達 80%！\n\n---\n\n## 一、名詞定義與主管機關公告事項（§2、§4～§6、§26）\n\n1. **12 項名詞定義核心陷阱（§2）** 🔥 113 Q20、114 Q19、115 Q22：\n   - **電腦連線**：以電腦主機／PC／端末機，透過**網際網路**與**單一窗口**連線傳輸（包含**個人**！⚠️ 陷阱常說不包括個人）。\n   - **電子資料傳輸**：利用電腦或連線設備，**經由通關網路**透過單一窗口相互傳輸。\n   - **連線機關**：主管進出口簽審、檢疫、檢驗、關務、航港、外匯等貿易管理之行政機關（含環保署、貿易署等；⚠️ **不含縣市政府**）。\n   - **連線業者**：報關、承攬、運輸、倉儲、貨櫃集散站、進出口業、**個人**或其他業者／代理人（⚠️ **不含政府機關如國際貿易署**）。\n   - **連線申報**：兼含「電腦連線」**或**「電子資料傳輸」兩種方式（⚠️ 115 Q22 只寫電子資料傳輸即錯！）。\n   - **連線核定**：稅費繳納證／准單核發補正、貨物查驗／放行通知、其他依法准駁決定（⚠️ **不含「警告或限期改正之處分」**）。\n   - **線上扣繳**：於報單「**繳稅方式**」之「**線上扣繳**」欄填記，自指定連線金融機構帳戶直接扣繳國庫。\n2. **財政部關務署公告事項（§5、§6、§26）** 🔥 112 Q39：\n   - 關務署公告：① 實施通關自動化之關區名稱、連線項目及範圍（§5）② 10 類電子資料標準格式（§6，⚠️ **不含貨物遺失通知單、復查申請書**）③ 本辦法之作業程序及報關手冊（§26）。\n   - *《中華民國輸出入貨品分類表》屬經濟部國際貿易署主管，非關務署公告事項。*\n\n---\n\n## 二、申請連線、禁止兼營與「視為 vs 推定」鐵律（§7～§9）🔥 幾乎年年必考！\n\n1. **申請程序（§7）** 🔥 113 Q19、114 Q19：\n   - **電腦連線（§7Ⅰ）**：先於**單一窗口**以憑證提出註冊申請，經核准後開始作業。\n   - **電子資料傳輸（§7Ⅱ）**：先向經營**通關網路之事業**申請訂約 → 轉送地區海關登記 → 單一窗口憑證註冊。**但申請者如屬「報關業者」，訂約前應先向該地區海關報備並取得電子郵箱號碼**！\n2. **禁止兼營（§8、§18）** 🔥 110、111、114、113 連考！：\n   - **連線轉接服務業**不得兼營「**報關業務**」。\n   - 違反者依《關稅法》§81 處 **NT\\$6,000～30,000** 罰鍰並命限期改正，按次處罰，處罰 **3 次**仍未改正得停止 **6 個月以下**連線轉接服務。\n3. **到達時點鐵律（§9）** 🔥 106、111、113、114、115 年必考表格！：\n\n| 傳輸方式 | 資料**到達海關**之時點 | 海關**連線核定到達應受通知人**之時點 |\n| :--- | :--- | :--- |\n| **電腦連線（§7Ⅰ）** | 輸入**單一窗口**電腦記錄有案時 → **視為**已到達海關 | 依**通關資料庫記錄核定時點** → **推定**已到達應受通知之人 |\n| **電子資料傳輸（§7Ⅱ）** | 輸入**通關網路**經電腦檔案記錄時 → **視為**已到達海關 | 輸入**單一窗口**電腦記錄有案時 → **推定**已到達應受通知之人 |\n\n\u003e 💡 **秒殺記憶法**：**報關人傳給海關＝一律「視為」**；**海關核定通知傳給人＝一律「推定」**！\n\u003e - **基準日有利原則（§9Ⅱ）**：連線申報適用關稅法規基準日與未連線業者發生差異時，適用**最有利於連線業者**之基準日。\n\u003e - **傳輸證明（§9Ⅲ）**：電子資料傳輸之時間及內容，當事人得向通關網路事業申請證明，**不得拒絕**。\n\n---\n\n## 三、連線通關程序、繳稅四方式與檔案保存（§10～§17）\n\n1. **預先申報進口（§10）** 🔥 114 Q20、115 Q23：\n   - 104 年已刪除「國外最後裝卸貨機場起飛後／駛離最後卸貨港口後」限制！現行條文：**飛機抵達本國機場前／船舶抵達本國港口前**，已電子傳輸「**艙單**」（⚠️ 非提單！）者，即可預先連線申報進口。\n2. **申報依據（§11、§19）**：依據**原始真實發票、提單**或其他有關資料文件製作報單；連線業者（**除個人及進出口業者外**）違反者，處警告或 **NT\\$6,000～30,000** 罰鍰並限期改正、按次處罰。\n3. **三種通關方式與補件期限（§13、§14、§21）** 🔥 113 Q21、114 Q20、115 Q34/35：\n   - **C1 免審免驗通關**：完成繳稅後連線傳送放行通知至報關人及貨棧／集散站；海關通知補送資料者，應於接到通知後 **3 日內**補送（⚠️ 陷阱常改 7 日！）。\n   - **C2 文件審核 / C3 貨物查驗**：應於接獲連線核定通知之**翌日辦公時間終了前**補送書面報單及文件；但經海關公告得傳送電子檔者，得以**連線申報方式取代書面補件**；備供查核文件採連線申報並經海關電腦核銷比對相符者，准免補送書面。\n   - **違反 §14 罰則（§21）**：電腦連線報關人違反 §14，處警告或 **定額 NT\\$6,000** 罰鍰（⚠️ 注意不是 6 千～3 萬，是定額 6 千！），並限期改正、按次處罰。\n4. **連線繳稅 4 種方式（§15）** 🔥 113 Q39、114 Q21：\n   - ① **線上扣繳** ② **先放後稅**（提供擔保） ③ 匯款（透過連線金融機構匯入國庫／海關專戶） ④ 現金（向駐海關代庫銀行收稅處繳納）*（⚠️ 支票、公債、郵局匯票向稅捐處繳納均不行！）*。\n   - **限制或變更權限（§15Ⅱ）**：海關僅得就 **① 線上扣繳** 與 **② 先放後稅** 之適用對象與啟用日期視需要予以限制或變更！\n5. **未連線代輸規費與過渡媒體（§16）** 🔥 114 Q22、115 Q24：\n   - 未連線業者書面報單由海關代輸 → 徵收規費；連線業者除有正當理由經海關核准外，遞送書面由海關代輸者亦徵收規費。\n   - 報關業尚未完成連線期間，得暫准以「**提供媒體方式**」代替輸入，以 **6 個月**為限，**必要時得申請延長**。\n6. **電腦檔案保存期限（§17）** 🔥 113 Q40、114 Q23、115 Q36 連年必考！：\n   - **報單及其相關檔案**（通關網路或單一窗口）：自進出口貨物**放行之翌日起保存 5 年**，**期滿予以銷毀**。\n   - **艙單、出口裝船清表檔案**（通關網路）：自進出口貨物**放行之翌日起保存 5 年**，期滿**除另有約定外**予以銷毀。\n\n---\n\n## 四、終止契約停權通知與例外（§22、§25）\n\n- **違約或欠費通知海關天數（§22）** 🔥 103、106、111、112、113、115 年必考：\n  - **終止或解除契約**註銷連線登記：通關網路事業應於 **30 日前**通知海關。\n  - 情節輕微僅**暫時停止使用**而不終止契約：應於 **3 日前**通知海關（⚠️ 陷阱常改 10 日前！）。\n- **連線通關之例外（§25）** 🔥 112 Q35：專屬於進口貨物之特別規定，及機邊驗放之出口「**生鮮動、植物**」經海關核准得事後傳輸者，不在此限。\n"},{"id":"03_通關實務概要_01_出口貨物報關驗放辦法","cat":"通關實務概要","title":"出口貨物報關驗放辦法","md":"# 出口貨物報關驗放辦法【完整精讀版】\n\n\u003e **整合來源**：任冠儀講師《115 通關實務講 02、講 05》＋《出口貨物報關驗放辦法》（**民國 115 年 4 月 8 日最新修正全文**）＋《預報貨物通關報關手冊（出口篇）》＋113–115 年歷屆試題  \n\u003e **最新修法警訊（116 年必考！）**：民國 **115 年 4 月 8 日**修正第 17 條，將船機專用物料免附出口報單門檻由 10 萬元**調高至 20 萬元**、船舶免船邊查核門檻由 2 萬元**調高至 5 萬元**（115 年選擇 Q8 已立刻命題！）。\n\n---\n\n## 一、出口通關五步驟與報關基本規則\n\n### 1. 出口通關流程與選案前提（115 Q31 必考！）\n```text\n① 訂艙進倉（運輸業／貨棧傳輸進倉訊息）\n  → ② 報關人傳輸出口報單（N5203，結關或開駛前）\n  → ③ 海關系統「比對報單與進倉資料相符」→ 始進入【選案作業】核定 C1 / C2 / C3！\n  → ④ 查驗（C3M 人工／C3X 儀檢，2024 修法改放行前實施）或審核（C2）\n  → ⑤ 放行（N5204）→ 放行翌日起 30 日內裝船（機）出口（§20）\n```\n\u003e ⚠️ **115 Q31 考點**：出口報單進入「選案作業」核定通關方式之前提條件，**不是**完成報單傳輸即選案，而是必須「**報單資料經海關系統比對與進倉資料相符後**，始進入選案」！\n\n### 2. 報關期限、主體與併單原則（§4–§6、§9、§11–§12）\n| 法條 | 核心規定 | 113–115 年必考陷阱 |\n|---|---|---|\n| **申報時點（§4）** | 貨物輸出人完成訂艙並備齊單證，於運輸工具**結關或開駛前**向海關申報（無「15 日滯報費」規定！滯報費僅限進口） | 出口無滯報費，但須於結關／開駛前報關 |\n| **委任與簽證（§5）** | 得委託報關業者辦理；遞送之報單應經**專責報關人員審核簽證**（115 Q6） | 須由專責報關人員簽證 |\n| **檢附文件與免附例外（§6）**【114 申論一、115 Q2】 | 應填送出口報單並檢附裝貨單／託運單、發票、裝箱單等，但下列情形**免附**：\u003cbr\u003e① **免附貨物進倉證明**：海關核准**船（機）邊驗放**者、或貨棧已傳輸進倉訊息者\u003cbr\u003e② **免附裝箱單（Packing List）**：**僅一箱**或**種類單一且包裝劃一**、**散裝**或**裸裝**之貨物 | **115 Q2 經典考法**：船（機）邊驗放＝免附**進倉證明**；單一箱／劃一／散裸裝＝免附**裝箱單**！ |\n| **中英文不符認定（§6）**【114 申論一、115 Q1】 | 出口報單申報事項**同時以中文及英文表示**，兩者不符且經海關查明文件與實際情形後仍無法認定時 → **以中文表示為準！** | 114 申論＋115 Q1 連續兩年考！ |\n| **同報單異貨／免證與應證（§11）**【115 Q6】 | ① 同一報單數種貨品應**逐項分別列報**。\u003cbr\u003e② **免證貨品與應辦輸出許可證貨品，得（非不得！）以同一份報單申報**！ | ⚠️ **115 Q6 錯誤選項陷阱**：試題寫「不得以同一份報單申報」是錯的！現行規定**可以**同報單合併申報！ |\n| **單證併報限制（§12）** | **不得**將數張裝貨單（S/O）或託運單合併以一份出口報單申報；但**空運併裝出口貨物**得以數份出口報單共附同一託運單（主號）（115 Q6） | 數張 S/O 不可併一張報單；空運併裝可數報單共一主號 |\n\n---\n\n## 二、出口價格申報、復運與船機專用物料（§10、§13–§17）\n\n### 1. 離岸價格（FOB）申報原則（§10、報關手冊）【115 Q4、Q5】\n- **應證貨物**：依輸出許可證所載之離岸價格申報。\n- **免證貨物**：依商業發票所載實際離岸價格申報。\n- **禮物、贈品、樣品、掉換、賠償、廣告品等（115 Q5 必考！）**：\n  - 即使商業發票載明 **`NCV`（No Commercial Value）** 或 **`FOC`（Free of Charge）**，出口報單（N5203）之離岸價格欄位**仍應申報「其實際價格」**，**絕不可**申報 `0`、`NCV` 或 `FOC`！\n- **運往國外修理或裝配（§13、115 Q4）**：\n  - 出口報關時除詳列品名、規格、型號、序號外，必須額外敘明「**修理或裝配之損毀缺失情形**」（且統計方式填 `9M` 修理／`9N` 裝配；復運進口時課徵修理費／裝配費＋往返運費保險費之關稅）。\n- **委託國外加工復運進口（或受託加工復出口）**：\n  - 進口來料受託加工再出口時，申報 FOB 應包含「**原進口 CIF 價格＋國內加工費及利潤**」（依統計方式區分是否收費，如 `04` 免收貨價／`02` 加工出口）。\n\n### 2. 出境旅客攜帶行李以外貨物出口免報關門檻（§16、115 Q7）\n- 出境旅客攜帶自用行李以外之貨物出口，如**非屬**經濟部國貿署「限制輸出貨品及海關協助查核輸出貨品彙總表」貨品，且其**離岸價格在美幣 2 萬元（US$20,000）以下**者，**得免按一般貨物出口辦理報關手續**（超過 US$20,000 或屬限制輸出貨品者，仍須辦理一般出口報關）。\n\n### 3. 進（出）口船舶、飛機就地採購專用物料（§17）【🔥 115/04/08 最新修正！】\n| 項目 | 現行規定（**115 年 4 月 8 日修正生效**） | 舊法對照（刷舊題留意） |\n|---|---|---|\n| **一般船機專用物料** | 檢附船（機）長或運輸業申請書（報單已報明並簽章者免附）＋出口報單 → 准在**船（機）邊驗放** | 同左 |\n| **專用燃料（油）** | 均須辦理出口報關驗放；但**僅「飛機」專用燃料（油）**得申請**按月彙報**（船舶燃料油不可按月彙報！） | 同左 |\n| **免附出口報單門檻（§17Ⅲ）** | 品類量值合理、不涉沖退稅及輸出規定，整批 FOB 在 **新臺幣 20 萬元以下** → 檢附發票及物品清單申請簽發准單，由海關於船（機）邊查核無訛後裝運，免附出口報單 | 舊法為 **10 萬元**（115/04/08 調高為 20 萬！） |\n| **免船邊查核逕行裝船（§17Ⅳ）**【115 Q8】 | 符合前項之**船舶**專用物料，整批 FOB 在 **新臺幣 5 萬元以下**，經海關審查發票及物品清單無訛者 → **得免予船邊查核逕行裝船**；必要時海關得派員上船查核 | 舊法為 **2 萬元**（115/04/08 調高為 5 萬，115 Q8 直接考 5 萬！） |\n| **整批 FOB 認定（§17Ⅴ）** | 指同一輸出人、同一港口（機場）、同一航（班）次、同一運輸工具 | 同左 |\n\n---\n\n## 三、裝船期限、出口報單副本、更正與退關（§20–§23）\n\n| 事項 | 法定期限與規定 | 必考陷阱 |\n|---|---|---|\n| **裝船（機）期限（§20）** | 海關**放行之翌日起 30 日內**裝船（機）出口；逾期由貨物輸出人辦理**退關**手續 | 30 日（放行翌日算） |\n| **簽發出口報單副本期限（§21）** | ① **一般出口**：運輸工具駛離前申請者 → 駛離之翌日起 **15 日內**；駛離後申請者 → 收到申請書翌日起 **15 日內**。\u003cbr\u003e② **輸往科技產業園區、科學園區、農業科技園區**：駐區海關放行前申請者 → 放行翌日起 **10 日內**；放行後申請者 → 收到申請書翌日起 **10 日內**。 | 一般 **15 日** vs 園區 **10 日**！ |\n| **退關提回（§23）** | 出口貨物因故退關，申請提回時**應先經海關核准**（查驗規定見查驗準則 §31：原封條完整得免再開驗） | 須先經海關核准 |\n| **報單更正期限（報單更正作業辦法）** | 出口報單放行後申請更正，原則應於**海關放行之翌日起 6 個月內**為之 | 6 個月（實務常考） |\n| **進口未經使用退運退營業稅（115 Q18）** | 貨物**進口翌日起 3 個月內**未經使用退運出口不再復運進口，得於出口報單（N5203）其他申報事項欄填報申請退還已納營業稅 | **3 個月**（115 Q18 正解！） |\n\n---\n\n## 四、出口報單特殊欄位、輸美反洗產地與出口統計方式\n\n### 1. 輸往美國貨品原產地聲明書與 `YT`/`NT`【🔥 114/04/24 新制，115 Q17、Q29 連考 2 題！】\n- **適用報單類別**：`G5`（國貨出口）、`G3`（外貨復出口）、**`D5`（保稅倉貨物出口）**、`B8`、`B9`、`F5`（115 Q29 正解為 **`D5`**，注意 `D1`/`B2`/`D7` 皆為區內交易非出口！）。\n- **填報方式**：申報輸往美國貨品應檢附「輸美國貨品原產地聲明書」，並於「**主管機關指定代號**」欄逐項填報：\n  - 屬我國產製者：填 **`YT`**\n  - 非屬我國產製者：填 **`NT`**\n- **漏填後果（115 Q17）**：海關系統發送 **`C86`「不予受理報關」**錯單訊息，通知報關人補正！\n\n### 2. 其他必考出口報單欄位規則\n- **商標（牌名）欄（115 Q26）**：貨品本身及內、外包裝均未標示商標者，應填報 **`NO BRAND`**（不可空白，亦非 `NIL` 或 `NONE`！）。\n- **保稅工廠等外銷未開放大陸物品製成品（115 Q24）**：保稅工廠、科技產業園區或科學園區事業進儲未開放大陸物品經製成產品外銷出口，於 `B9` 報單「保稅貨物註記」欄填報 **`CN`**。\n- **反傾銷／防洗產地品項（工具機 8456–8463、電動輔助自行車 8711.60、自行車 8712）**：貨物名稱前 3 字須填明「**供外銷**」或「**供內銷**」。\n- **確實不諳申報避罰機制**：於「申請審驗方式」欄填報 **`8`**（申請文件審查），主動配合查核。\n\n### 3. 出口報單統計方式代碼高頻精選表\n| 代碼 | 意義 | 代碼 | 意義 |\n|---|---|---|---|\n| **`01`** | 須結匯出口（一般買賣） | **`81` / `82`** | 國貨退回修理後再出口（81 免費／82 收費） |\n| **`02`** | 一般外銷（免結匯／一般出口） | **`8A`–`8D`** | 租賃／展示／復運出口等特定案件 |\n| **`04`** | 贈送、樣品、賠償（免收貨價） | **`9L` / `9M` / `9N`** | 運往國外加工（9L）／**修理（9M）**／**裝配（9N）** |\n| **`05` / `06`** | 委外加工出口／特定出口 | **`9P` / `9S`** | 國外退貨／原貨復出口不再復運進口（如賠償換貨） |\n| **`1A`** | 特定專案／線上統計出口 | **`90`** | **三角貿易**出口（搭配進口 `90` 或合一報單 `TA`） |\n| **`53`** | 國貨復運出口（原進口保稅或退運） | **`91` / `92`** | 轉口／保稅貨物退運出口（91 退回國外／92 轉售第三國） |\n| **`7M`** | 貨棧／快遞低價簡易申報統計 | **`95`** | 復運出口（原進口已繳稅申請退稅等） |\n\n---\n\n## 五、邊境智慧財產權保護、SHTC 與暫准通關證（ATA Carnet）\n\n### 1. 海關執行商標權保護措施（必背時限表！）\n| 程序階段 | 空運出口 | 空運進口／海運進出口 |\n|---|---|---|\n| **海關通知商標權人後，權利人到場認定侵權時限** | **4 小時內** | **24 小時內** |\n| **權利人提出侵權鑑定事證期限** | **3 個工作日**（必要時得延長 **3 個工作日**，共 6 個工作日） | **3 個工作日**（得延長 **3 個工作日**） |\n| **權利人申請海關「查扣」應繳保證金** | 相當於查扣貨物完稅價格（或出口離岸價格）之 **1 倍** | **1 倍** |\n| **被查扣人申請「廢止查扣」應繳反擔保金** | **2 倍** | **2 倍** |\n| **查扣後權利人提起訴訟期限** | 海關通知受理查扣之翌日起 **12 日內**（必要時得延長 **12 日**，共 24 日） | **12 日內**（得延長 **12 日**） |\n\n### 2. 戰略性高科技貨品（SHTC）與光碟（IFPI）與 ATA Carnet\n- **SHTC**：出口至管制地區或屬瓦聖納協定列管貨品（輸入／輸出規定 `S01`/`S02`），須取得經濟部國貿署核發之「戰略性高科技貨品輸出許可證」；**即使辦理三角貿易或保稅區復出口，亦不得免證**（115 Q22 正解！）。\n- **ATA Carnet（暫准通關證）**：適用展覽品、專業器材、商業樣品等短期免稅進出口，無須另繳押款（由全國工業總會／對外貿易發展協會等擔保機構保證），期限通常為 **1 年**內須復運出口（或復運進口）。\n\n---\n\n## 六、考前極速自檢清單\n- [ ] 牢記 **115/04/08 §17 最新數字**：專用物料免報單 **20 萬元**（舊 10 萬）、船舶免船邊查核 **5 萬元**（舊 2 萬）、僅**飛機**燃料油可按月彙報？\n- [ ] 牢記 **114/04/24 輸美新制**：`G5`/`G3`/`D5`/`B8`/`B9`/`F5` 輸美須填 **`YT`/`NT`**，漏填發送 **`C86`** 錯單？\n- [ ] 區分：**免附裝箱單**（一箱／劃一／散裸裝）vs **免附進倉證明**（船機邊驗放）；中英文不符以**中文**為準；無商標填 **`NO BRAND`**；發票載 `NCV` 仍報**實際價格**？\n- [ ] 背熟期限：裝船 **30 日**、報單副本 **15 日／園區 10 日**、報單更正 **6 個月**、未經使用退運退營業稅 **3 個月**、商標保護 **4h/24h、3+3 工作日、1 倍/2 倍押金、12+12 日提訴**？\n"},{"id":"03_通關實務概要_02_進出口貨物查驗準則","cat":"通關實務概要","title":"進出口貨物查驗準則","md":"# 進出口貨物查驗準則【完整精讀版】\n\n\u003e **整合來源**：劉兆富講師《115 進出口貨物查驗準則講義》＋《進出口貨物查驗準則》（**民國 113 年 11 月 27 日最新修正全文**）＋113–115 年專責報關人員歷屆試題  \n\u003e **考試定位**：法條僅 36 條，但**每年穩定佔《通關實務概要》15–25 分**（113 申論三考 §5、114 申論二考 §13-1、115 選擇 Q3, Q9–Q16 連出 9 題！），屬於「條文短、命中率破表」的必搶滿分章節！\n\n---\n\n## 一、查驗方式、抽驗比例與「免會同 3 款」（§2–§5-1、§16）\n\n### 1. 人工查驗 vs. 儀器查驗（§3、§4、§5-1、§16、§33-1）\n| 比較項目 | **人工查驗（C3M）** | **儀器查驗（C3X／儀檢）** |\n|---|---|---|\n| **決定層級（§16）** | 電腦系統或派驗報單主管決定**簡易／一般／詳細查驗**，及指櫃、指位或查驗件數 | 電腦系統或派驗報單主管決定**指櫃查驗**（115 Q10 正解！） |\n| **抽驗件數實務標準（劉老師補充）** | • **簡易查驗**：原則抽驗 **1 件**\u003cbr\u003e• **一般查驗**：原則 **≦ 5%**\u003cbr\u003e• **詳細查驗**：原則 **≦ 10%**（滿 **20 件**免續驗）\u003cbr\u003e• ⚠️ **特殊全數清櫃**：亞洲地區進口**大蒜、香菇**原則全數清櫃查驗！ | 整櫃通過 X 光大型貨櫃掃描儀判讀影像 |\n| **驗放方式（§5-1）** | 依核定方式辦理（C3 應補單／免補單依規定） | 無論應補或免補書面報單，**均採「驗放」方式辦理**（115 Q3 正解！）；一報單多櫃者，儀檢櫃**逐櫃無異狀逐櫃放行**，未核定儀檢之其餘貨櫃須俟所有儀檢櫃全數無異狀後始得放行 |\n| **出口儀檢時點（§33-1，113 年修法！）** | 放行前 | **除有必要外，應於「放行前」為之**（舊法曾於放行後實施，務必記住已改為放行前！） |\n| **申請查驗期限（§26、§26-1、§33-2）**【115 Q11、Q14】 | • 一般進出口貨物：自**報關之翌日起 10 日內**\u003cbr\u003e• 快遞貨物：自**報關之翌日起 3 日內**\u003cbr\u003e逾期未申請或未展延 → 海關書面通知倉庫管理人會同查驗並副知報關人／納稅人 | 自海關電腦**發送儀器查驗訊息通知之翌日起 10 日內**申請查驗（115 Q11 正解！逾期通知倉庫管理人移運受檢） |\n\n### 2. 「免會同報關人」之 3 款情形（§5）【113 申論三、115 Q13 必考！】\n- **原則**：關員辦理進出口貨物查驗時，**應會同報關人為之**。\n- **例外（得免會同報關人之 3 款情形，必背！）**：\n  1. **出口貨物**經海關核准**船（機）邊驗放**者。（⚠️ **115 Q13 超級陷阱**：**「進口」**貨物船（機）邊驗放**不在免會同之列，仍應會同報關人**！）\n  2. 貨櫃（物）經核定以**儀器查驗**者。\n  3. 前款儀器查驗貨櫃（物）**經發現影像異常須辦理人工查驗**者。\n- **報關人故意拖延／未到場處理（§5Ⅱ）**：貨物全部未到、未到齊或報關人故意拖延不會同查驗 → 註明報單報請派驗主管處理，必要時海關得**會同倉庫或貨櫃集散站業主逕行查驗**。\n\n---\n\n## 二、查驗變更、改全驗與「破壞性查驗」（§11–§13-1）\n\n### 1. 查驗方式變更與改全驗（§11、§13）\n- **變更權限（§11）**：抽中人工／儀檢得改查驗方式或免驗；抽中免驗得改應驗 → 均由海關**驗貨、分類估價、儀檢單位主管或其指定人員**決定。\n- **發現虛報改「全部查驗」（§13Ⅰ）**：人工查驗發現虛報名稱、數量、品質、規格或違法情事 → 以**全部查驗為原則**（但已查驗部分足以推斷整批真實內容者，得免續驗）；人工查驗並得經派驗主管核定以儀檢輔助之（§13Ⅱ）。\n- **儀檢影像異常改人工查驗（§13Ⅲ、115 Q11）**：儀器查驗過程中判讀影像異常者 → 得由**「儀檢單位主管或其指定人員」**改為人工查驗！（⚠️ 115 Q11 陷阱：是**儀檢主管**，不是驗貨主管！）\n\n### 2. 破壞性查驗與損失補償（§13-1）【114 申論二、115 Q12 連考兩年！】\n| 要件 | 法條明文規定（§13-1） | 考點陷阱 |\n|---|---|---|\n| **發動事由（4 情形）** | 遇有 ① **密、通報案件** ② **儀檢異常** ③ **緝毒犬嗅聞異常** ④ **依現況研析確屬可疑**，且以實施破壞性查驗為**必要手段**時 | 不須事前徵得納稅人書面同意（115 Q12 D 錯！） |\n| **核可層級** | 經報請**一級單位主管核可**後實施 | 是一級單位主管，非驗貨關員自行決定 |\n| **程序記載** | 實施後應於報單或相關文件**註明破壞貨物之事實** | 須留存書面紀錄 |\n| **補償條件（115 Q12 正解！）** | 經實施破壞性查驗，**結果與進、出口人原申報內容「相符」者**，納稅義務人或貨物輸出人得向海關請求補償 | 若發現申報不符、虛報或溢裝，**不得**請求補償！ |\n\n---\n\n## 三、船（機）邊驗放與船邊免驗提櫃／裝船（§9、§14、§30、§33）\n\n### 1. 船邊免驗提櫃／裝船 6 要件與 AEOS 特權（§9）\n- **適用對象**：生產事業、與海關簽訂策略聯盟之廠商、或優質企業（一般 AEO）進出口業者，就其**進口自用及出口自製之整裝貨櫃貨物**，須同時具備 **6 要件**（書面申請核准）：\n  1. 成立 **5 年**以上。\n  2. 具經濟部國貿署進出口廠商資格，且**最近 3 年每年進出口實績總額達 500 萬美元**以上。\n  3. **最近 3 年無違規情事**。\n  4. 使用**防止冒用優良廠商報關查對系統**。\n  5. 以**連線方式**報關。\n  6. 委託報關時應採**長期委任**，且受託報關業者應符合**《報關業設置管理辦法》第 33 條**規定（優良報關業減抽資格）。\n- **🌟 安全認證優質企業（AEOS）獨享特權（§9Ⅱ）**：**不受前項 6 款條件之限制**！\n- **例外**：經核准船邊免驗之廠商，若該筆報單仍經電腦核定為「應審應驗（C3）」，仍須依 §8 規定進倉／至指定地點查驗。\n\n### 2. 得核准船（機）邊驗放貨品與出口未到處理（§14、§30、§33）\n- **得核准船（機）邊驗放（§14 進口／§30 出口）**：鮮貨、易腐物品、活動物、植物、危險品、散裝、大宗貨物等（進口另含：有時間性新聞資料、放射性元素、骨灰、屍體；出口另含：箱裝且體積龐大者）。\n- **出口船（機）邊驗放「貨物未到」處理（§33、115 Q9 必考！）**：\n  - **全部未到**：憑報關人申請，海關**「逕予註銷」**（非退關、非退倉！）。\n  - **部分未到**：應憑報關人於**「第 1 次派驗前」**之申請，按實際到達船（機）邊或機放倉庫之數量查驗無訛後，方准辦理退關或放行裝船（機）。\n\n---\n\n## 四、免驗貨物比較表：應予免驗 vs. 得予免驗（§17、§18、§27、§28）\n\n| 區分 | **進口（§17 應免驗 / §18 得免驗）** | **出口（§27 應免驗 / §28 得免驗）** |\n|---|---|---|\n| **應予免驗（僅 3 款！）** | 1. 總統、副總統應用物品\u003cbr\u003e2. **駐在中華民國**之各國使領館外交官、領事官及享有外交待遇機構人員公用／自用物品（外交部證明；必要時仍得會同查驗）\u003cbr\u003e3. 其他專案核准免驗物資\u003cbr\u003e⚠️ **必殺陷阱**：**我國駐外使節**返國物品**不屬**應免驗！ | 1. 總統、副總統運寄國外物品\u003cbr\u003e2. 駐在中華民國各國使領館外交／領事官等運寄國外物品（外交部證明）\u003cbr\u003e3. 其他經**財政部專案核准**免驗物資 |\n| **得予免驗** | ① 包裝重量相同／散裝大宗／笨重機器器材（單證無異狀）② 軍政機關 ③ 公營事業 ④ 緊急救難器材物品 ⑤ 國內公私立大學 ⑥ 私人餽贈零星郵包 ⑦ 靈柩或骨灰 ⑧ 其他核准廠商貨物 | ① 鮮果蔬菜 ② 動物、植物苗及樹木 ③ 包裝重量相同／散裝大宗貨物 ④ 軍政機關及公營事業 ⑤ 政府／公益慈善團體救濟物資 ⑥ **不申請沖退稅之外銷品** ⑦ **危險品** ⑧ 靈柩或骨灰 ⑨ 其他核准廠商貨物 |\n\n---\n\n## 五、誤裝錯運、短溢裝處理、退關再驗與貨樣提取（§19–§25、§31–§35）\n\n### 1. 誤裝錯運免罰要件（§19、115 Q15 必考！）\n- 進口貨物有溢裝、實到不符或夾雜其他物品情事，若同時符合：\n  1. 出於**同一發貨人發貨兩批以上且互相誤裝錯運**（115 Q15 正解！）\n  2. 經舉證證明並經海關查明屬實  \n  → **免依關稅法及海關緝私條例論處**！（⚠️ 務必在貨物「提領出倉前」或依規定程序舉證，非出倉後始得申請）\n\n### 2. 短裝／溢裝補運免稅與登帳時限總比較（§20–§22）\n| 適用對象 | 情境與處理期限 | 核准效果 |\n|---|---|---|\n| **一般進口（§20）** | • **已查驗**未發現短裝 → 須於**提領出倉前**申請複驗。\u003cbr\u003e• **未查驗**出倉後發現短裝 → 提領出倉翌日起 **1 個月內**檢具公證報告／發貨人證明申請；**機器設備**得於安裝就緒、**試車之翌日起 3 個月內**申請 | 查明屬實者，對補運進口之短裝部分**免徵關稅** |\n| **一般電子工廠外銷零件（§21）** | 零件細小點數困難，或具特殊用途國內無脫售可能 → 提領出倉翌日起 **1 個月內**申請 | 准予調整數量 |\n| **保稅工廠／園區／自貿港／保倉／物流中心（§22）** | • **溢裝**：不論進口地是否曾查驗，廠方自行發現向監管海關申請更正 → **核實登帳，免按緝私條例論處**！\u003cbr\u003e• **微量短裝**：短少 **≦ 5%** 且貨價 **≦ US$1,000** → 提領出倉翌日起 **1 個月內**書面報備監管海關，**自行依實到數量調整登帳**。\u003cbr\u003e• **超標短裝（\u003e 5% 或 \u003e US$1,000）**：1 個月內檢具公證報告等申請核辦 → 免稅補運或調整登帳 | 保稅區專屬寬容條款，幾乎年年必考！ |\n\n### 3. 其他高頻條文快記（§7、§23、§31–§32、§34–§35）\n- **未附單證（§7、115 Q16）**：未檢附裝箱單、型錄、說明書等 → 海關於必要時**通知報關人限期檢附**（非逕予退單或改全驗！）。\n- **原封危險／易污染品（§23）**：查驗前以書面說明特性；經認定開啟有危害／污染之虞且為**原製造廠原封**者，得免開啟查驗。\n- **退關／退運貨物再驗（§31–§32）**：已查驗者，原封條完整**得免再開驗**；非原封、海運非櫃裝、空運未加封者**應再查驗**；原核定免驗者得准免驗。已退關重報出口者，海關得重新核定應否查驗。\n- **提取貨樣（§34–§35）**：不能重複化驗鑑定之貨物，提取足夠供 **3 次**化驗鑑定之用量。貨樣保留期限（實務：進口 **2 個月**、出口 **10 日**）屆滿或解除專案保管 **逾 10 日**未領回者，公告並通知限期領回且副知報關公會。\n\n---\n\n## 六、考前極速自檢清單\n- [ ] 背出 §5「免會同 3 款」並能區分**出口船邊驗放免會同** vs **進口船邊驗放須會同**？\n- [ ] 背出 §13-1 破壞性查驗：4 事由、**一級單位主管核可**、**相符始得補償**？\n- [ ] 背出申請查驗期限：**一般 10 日、快遞 3 日、儀檢 10 日（通知翌日算）**，以及儀檢異常由**儀檢單位主管**改人工？\n- [ ] 背出船邊免驗 **6 要件**（5 年／500 萬美／3 年無違規／防冒用／連線／長期委任 §33 報關業）與 **AEOS 不受限制**？\n- [ ] 背出船邊驗放出口未到：**全部未到＝逕予註銷**；**部分未到＝第 1 次派驗前申請**？\n- [ ] 背出保稅工廠短裝 **≦ 5% 且 ≦ US$1,000（1 個月內書面報備）**、一般短裝 **1 個月（機器試車 3 個月）**？\n"},{"id":"03_通關實務概要_03_預報貨物通關報關手冊","cat":"通關實務概要","title":"預報貨物通關報關手冊","md":"# 預報貨物通關報關手冊（進出口全集）【完整精讀版】\n\n\u003e **整合來源**：劉兆富講師《115 報關手冊（進口篇）講義》＋任冠儀講師《115 通關實務講 05》＋財政部關務署《預報貨物通關報關手冊（進／出口篇全集）》＋《進口貨物原產地認定標準》＋113–115 年歷屆試題  \n\u003e **考試權重**：本篇是《通關實務概要》最龐雜也最貼近報關實務的核心（115 選擇 Q19–Q30＋申論二全部出自本篇！）。有報關實務背景的你，重點放在「**精確代碼、錯單分類、補單天數、原產地規則與稅費計算基數**」。\n\n---\n\n## 一、報單編號、關別、通關方式與錯單代碼\n\n### 1. 報單號碼 14 碼結構與四大關區代碼\n```text\n  AA   /   15   /   001   /   12345  （共 14 碼：收單關別 2 + 轉自關別 2 + 年度 2 + 箱號 3 + 流水號 5）\n```\n- **四大關區首碼**：**`A` 基隆關**、**`B` 高雄關**、**`C` 臺北關**、**`D` 臺中關**（第二碼代表分關／業務組，如 `AA` 基隆關、`CA` 臺北關、`BC` 高雄關小港分關等）。\n\n### 2. 通關方式（C1 / C2 / C3M / C3X）與補單期限（115 Q27 必考！）\n\n```mermaid\n%% diagram:prac-channel\nflowchart TD\n    S[\"連線傳輸報單 (出口須先比對進倉相符)\"] --\u003e C1[\"C1 免審免驗\u003cbr/\u003e原則免補單 (通知3日內補)\"]\n    S --\u003e C2[\"C2 文件審核\u003cbr/\u003e翌日辦公時間終了前補單\"]\n    S --\u003e C3M[\"C3M 人工查驗\u003cbr/\u003e翌日補單 + 10日內申驗 (快遞3日)\"]\n    S --\u003e C3X[\"C3X 儀器查驗 (一律採驗放)\u003cbr/\u003e10日內受檢 (免補單通知3日補)\"]\n```\n| 通關方式 | 意義 | 書面報單補送規定 |\n|---|---|---|\n| **`C1`** | 免審免驗通關 | 原則免補送書面報單；**海關必要時通知補送者，應於接到通知後「3 日內」補送**（115 Q27 正解！） |\n| **`C2`** | 文件審核通關 | 須於**翌日辦公時間終了以前**補送書面報單及有關文件（或線上無紙化上傳） |\n| **`C3M`** | 人工查驗通關 | 須於**翌日辦公時間終了以前**補送書面報單及單證，並自報關翌日起 **10 日內**（快遞 3 日）申請查驗 |\n| **`C3X`** | 儀器查驗通關 | 分「應補單」與「免補單」；免補單者比照 C1，海關通知補送時應於**接到通知後 3 日內**補送（115 Q27！） |\n\n### 3. 錯單代碼分類總表（進口 vs. 出口）\n| 代碼首字 | 適用方向 | 意義與補送／處理效果 |\n|---|---|---|\n| **`A`** | 進口 | 嚴重邏輯錯誤，**不受理報關（不可補更正，須重傳）** |\n| **`B`** | 進口 | 輕微錯誤或待查核，先收單並通知報關人於 **3 日內**補正 |\n| **`C` / `D`** | 出口 | 嚴重錯誤，**不受理報關（不可補，須重傳）**（例：**`C86`**＝輸美出口未填 `YT`/`NT`，115 Q17！） |\n| **`F`** | 出口 | 通知報關人於 **7 日內**補正 |\n\n---\n\n## 二、全套報單類別代碼與轉運申請書（115 Q20、Q30 必考！）\n\n### 1. 進口報單 10 類＋合一報單 `TA`\n| 代碼 | 名稱 | 代碼 | 名稱 |\n|---|---|---|---|\n| **`G1`** | 外貨進口（一般課稅區） | **`D8`** | **外貨進保稅倉**（含進物流中心／自用保倉） |\n| **`G2`** | 本地補稅案件（如保稅廠內銷補稅） | **`B6`** | 保稅廠輸入原料（國外直接進口） |\n| **`G7`** | 國貨復進口（外銷退回、國外修理復運等） | **`F1`** | 外貨進儲自由港區 |\n| **`D2`** | 保稅貨出保稅倉進口（內銷課稅區完稅） | **`F2`** | 自由港區貨物進口（銷往課稅區完稅） |\n| **`D7`** | **保稅倉相互轉儲或運往保稅廠**（115 Q30！） | **`F3`** | 自由港區區內事業間之交易 |\n| **`TA`** | **進出口合一報單**（用於特定**三角貿易**案件） | — | — |\n\n### 2. 出口報單 10 類＋`D9`\n| 代碼 | 名稱 | 代碼 | 名稱 |\n|---|---|---|---|\n| **`G3`** | 外貨復出口（退運、三角貿易出口等） | **`B8`** | 保稅廠進口原料復出口 |\n| **`G5`** | 國貨出口（一般外銷） | **`B9`** | 保稅廠產品出口（外銷成品；含大陸未開放料件註記 `CN`，115 Q24） |\n| **`D1`** | 課稅區售與或退回保稅倉 | **`D9`** | 保稅貨物運往國內他保稅倉／特定轉儲 |\n| **`D5`** | 保稅倉貨物出口（銷往國外；輸美須填 `YT`/`NT`，115 Q29） | **`F4`** | 自由港區與他自由港區、課稅區間之交易 |\n| **`B1`** | 課稅區售與保稅廠 | **`F5`** | 自由港區貨物出口（銷往國外） |\n| **`B2`** | **保稅廠相互交易或進儲保稅倉**（115 Q30！） | — | — |\n\n\u003e 🔥 **115 Q30 經典口訣**：「**倉轉倉／倉去廠＝`D7`**；**廠對廠／廠進倉＝`B2`**」（看「出發地」：D 開頭從保倉出、B 開頭從保廠出！）\n\n### 3. 轉運申請書（N5301）代碼表（115 Q20 必考！）\n| 代碼 | 意義與適用情形 |\n|---|---|\n| **`T1`** | **轉運國內其他關區**（如基隆港轉運至新竹科學園區／臺北關／臺中關等，**115 Q20 正解！**） |\n| **`T2`** | 轉口（國外運抵本國港口再轉運至國外他港） |\n| **`T3`** | 船用品轉口（供國際航線船舶使用） |\n| **`T4`** | 郵包轉運／轉口 |\n| **`T5`** | 貨櫃（物）空運轉海運或海運轉空運轉口（海空聯運） |\n| **`T6`** | 空運轉口貨物轉至其他國際機場出口（陸空聯運） |\n| **`T7`** | 境外航運中心轉口（歷史／特定轉口碼） |\n| **`L1`** | **轉運進儲物流中心**（特別注意：進儲物流中心外貨可用 `L1` 或 `D8`，詳見第 6 講保稅區比較！） |\n\n---\n\n## 三、納稅辦法代碼與特殊申報欄位（115 Q19、Q21、Q28）\n\n### 1. 進口納稅辦法代碼高頻精選表\n| 代碼 | 意義 | 代碼 | 意義 |\n|---|---|---|---|\n| **`31`** | 稅款繳現（含先放後稅、線上扣繳） | **`5M`** | 租賃貨物按租金課稅（關 §38） |\n| **`37`** | 內銷補稅（如保稅廠內銷） | **`5J`** | **貨主自備貨櫃（SOC）**免稅 |\n| **`39`** | 國外修理／裝配復運進口按加工費課稅（關 §37） | **`61` / `65` / `66`** | `61` 押款放行；**`65` 移轉訂價一次性調整（須搭配其他申報碼 `138`）**；`66` 專案押款 |\n| **`3F`** | 委託國外加工復運進口按加工費課稅 | **`71` / `73` / `74`** | `71` 依規免稅；`73` 復運進口免稅（外銷退回等）；`74` 專案免稅 |\n| **`41` / `42`** | 記帳（外銷品原料關稅記帳） | **`90`** | **三角貿易**進口（不課稅，配合出口 `90`） |\n| **`50`–`56`** | 各類法定免稅（關 §49 各款，如 `50` 政府機關、`51` 教育研究、`52` 廣告品貨樣、`55` 救濟物資、`56` 專供研究等） | **`92` / `94` / `99`** | `92` 退運；`94` 放棄／銷毀；**`99` 國貨復進口（關 §57 外銷退回 3 年內免稅）** |\n| **`5Y`** | 關稅法 §52 復運出口免稅（如展品、貨櫃等，原 6 個月內復運出口） | **`9A` / `9E` / `9F`** | 保稅區／自貿港區特殊免稅或移倉代碼 |\n\n### 2. 進口報單特殊欄位與避罰規則（115 Q19、Q21、Q28）\n| 欄位／情形 | 正確填報規定 | 考點提示 |\n|---|---|---|\n| **舊品（115 Q19）** | 貨物名稱欄填報 **`Used`**，並於「申請審驗方式」欄填 **`8`** | ⚠️ 不是 `Old` 或 `Second Hand`！ |\n| **CITES 瀕危物種** | 貨物名稱欄填報 **學名＋俗名**，並於「申請審驗方式」欄填 **`8`** | 缺一不可 |\n| **F01 / F02 食品查驗** | 商標欄**不得空白**；`F02` 須填報用途代碼（1 食品、2 添加物、3 器具容器、4 非供食品） | 避免卡關退單 |\n| **東南亞進口瓷磚** | 須報明製造商名稱及代號（如 `B1A` 相關查核機制，防中國瓷磚洗產地） | 反洗產地實務 |\n| **FTA／LDC 優惠關稅註記（115 Q28）** | 於「自由貿易協定優惠關稅註記」訊息欄（書面報單為號列附碼）填報 **`PT`** → 視為報明適用國定稅率**第 2 欄**稅率 | **115 Q28 正解：`PT`；第 2 欄！** |\n| **確實不諳號列避罰（115 Q21）** | 號列申報錯誤將由**「專責報關人員」**（或視違章態樣論處）受海關處分；確實不諳如何申報者，可申請**稅則預先審核**，或主動在「申請審驗方式」欄填報 **`8`（申請文件審查）**，則可免受處分 | ⚠️ **115 Q21 官方正解為 (A) 專責報關人員；稅則預審或填 `8`**！ |\n| **申請審驗方式代碼** | `2` 廠驗、`3` 船（機）邊驗放、`4` 貨櫃集中查驗區、`6` 倉庫驗放、`7` 申請免驗（附理由）、**`8` 申請文件審查**、`9` 申請查驗、`A` 申請儀器查驗 | 最常考 `8`（書面審查避罰） |\n\n### 3. 少量大陸工業產品免證進口規定（必背數字！）\n- 凡屬稅則 **第 25–97 章**（工業產品，排除農產品 Ch.1–24）且非禁止類（或依規可適用少量免證）之大陸物品：\n  - **起岸價格（CIF）≦ 新臺幣 32,000 元**，且 **單項數量 ≦ 24 件** 或 **重量 ≦ 40 公斤**（兩者符合其一即可）。\n  - ⚠️ **例外嚴格品項（石材、瓷磚）**：必須**「同時符合」**金額（≦ 32,000 元）、數量（≦ 24 件）**及**重量（≦ 40 公斤）三項條件始准免證！\n\n### 4. 不得申請倉庫驗放之貨物（13 類原則記憶）\n- 原則上凡屬**風險較高、須拆櫃詳驗、易涉走私或特殊管制**者（如：未開放大陸農產品、大蒜、香菇、密報案件、管制藥品、槍械彈藥、活動物植物需檢疫、洋菸酒、高稅率敏感農產、特定反傾銷稅貨品等共 13 類）不得申請倉庫驗放。\n\n---\n\n## 四、進口稅費計算公式與欠稅保全\n\n```mermaid\n%% diagram:prac-taxbase\nflowchart TD\n    DPV[\"完稅價格 DPV (CIF)\"] --\u003e DUTY[\"① 關稅 = DPV × 關稅稅率\"]\n    DPV --\u003e COM[\"② 貨物稅 = (DPV + 關稅) × 貨物稅率\"]\n    DUTY --\u003e COM\n    COM --\u003e VAT[\"③ 營業稅 5% = (DPV + 關稅 + 貨物稅 + 菸酒稅 + 健康捐) × 5%\"]\n    VAT --\u003e LUX[\"④ 奢侈稅 10% = (DPV + 關稅 + 貨物稅 + 營業稅) × 10%\"]\n    DPV -.-\u003e|⚠️ 不計入任何稅基!| TPF[\"推貿費 0.04% (\u003c NT$100 免徵)\"]\n```\n\n### 1. 五大稅費連環計算公式（考試禁止計算器，但必考「稅基包含哪些稅」！）\n1. **關稅（Import Duty）** ＝ $\\text{完稅價格（DPV = CIF）} \\times \\text{關稅稅率}$\n2. **推廣貿易服務費（推貿費）** ＝ $\\text{DPV} \\times 0.04\\%$（萬分之四；**未滿新臺幣 100 元者免徵**；⚠️ **極重要：推貿費不計入貨物稅、營業稅或奢侈稅之稅基！**）\n3. **貨物稅（Commodity Tax）** ＝ $(\\text{DPV} + \\text{關稅}) \\times \\text{貨物稅率}$\n4. **營業稅（VAT, 5%）** ＝ $(\\text{DPV} + \\text{關稅} + \\text{貨物稅} + \\text{菸酒稅} + \\text{菸品健康福利捐}) \\times 5\\%$\n5. **特種貨物及勞務稅（奢侈稅, 10%）** ＝ $(\\text{DPV} + \\text{關稅} + \\text{貨物稅} + \\text{營業稅}) \\times 10\\%$（門檻如小客車完稅＋稅費 ≧ 300 萬元）\n\n### 2. 欠稅保全門檻\n- 納稅義務人欠繳應繳關稅、滯納金或罰鍰達一定金額（個人 **50 萬元**以上／營利事業依關 §48 規定門檻，實務保全限制出境個人 100 萬、營利事業 200 萬；假扣押／禁止財產處分得依關 §48 辦理）。\n\n---\n\n## 五、進口貨物原產地認定標準與三角貿易【115 申論二、Q22、Q23、Q25！】\n\n### 1. 一般貨物與農產品原產地認定（115 Q23 必考！）\n- **完全生產（§6）**：在該國完全取得或生產（採收、飼養、開採等）。\n- **實質轉型（§7）**（涉及二個以上國家加工時）：符合下列之一即發生實質轉型：\n  1. **稅則號別改變**：加工後貨品與原材料之 **HS 前 6 碼**相異。\n  2. **附加價值率 \u003e 35%**：$(\\text{出口 FOB} - \\text{直間接進口原料 CIF}) \\div \\text{出口 FOB} \u003e 35\\%$。\n  3. **特定貨品重要製程**：經經濟部與財政部會同公告之重要製程。\n- **⚠️ 簡單加工不生實質轉型**：乾燥、冷藏、簡單混合、分裝、貼標等均不認定為實質轉型。\n- **🔥 九大敏感農產品「排除實質轉型（一律以採收地為原產地）」清單（115 Q23 正解！）**：\n  \u003e **大蒜、茶葉、香菇、竹筍、稻米、花生、梅、李、金針**（口訣：「**蒜茶菇筍米，花梅李金針**」——⚠️ **不含紅豆**！）  \n  \u003e 📌 **115 Q23 實例**：中國大陸採收之香菇、竹筍、梅、李、金針，即使運到韓國乾燥、再運到日本調製加工至 **HS 前 6 碼改變且附加價值超過 35%**，依《進口貨物原產地認定標準》§7 特別排除條款，**其原產地仍認定為「中國大陸」**！\n- **瓷磚**：僅限**稅則前 6 碼改變**認定實質轉型（不適用附加價值率 35%）。\n\n### 2. 低度開發國家（LDC）原產貨物認定與直接運輸規定【🔥 115 申論第 2 題，20 分！】\n\u003e **115 申論第 2 題標準高分架構（《進口貨物原產地認定標準》§9、§10）**：\n\n- **(一) 認定為低度開發國家原產貨物之規定（10 分）**：\n  1. **完全取得或完全生產**於該低度開發國家之貨物；或\n  2. 雖非完全生產，但於該低度開發國家加工製造，其**原產地附加價值率（或原料及加工成本）達 50% 以上**（即非原產材料價值不超過離岸價格 50%），並完成最終實質製程者。\n  3. （附記：簡單包裝、分裝、組合、貼標、乾燥保存等非實質加工不予計入。）\n- **(二) 申請優惠關稅之「運輸規定」（直接運輸原則，10 分）**：\n  - 進口時應檢具該國官方或授權機構簽發之有效**原產地證明書**（報單填 `PT`），並符合下列運輸規定之一：\n    1. **直接運輸**：自該低度開發國家**直接運至我國**，未經過第三國（地區）。\n    2. **經第三國轉運之例外容許條件**：因地理因素或運輸需要經過第三國（地區）轉運者，須同時符合：\n       - 貨物在第三國**僅進行卸貨、重裝或維持貨物良好狀態所必要之處理**（不得進行加工或商業交易進入該國市場）；\n       - 貨物在第三國停留期間**始終處於該第三國海關監管之下**；\n       - 進口時檢附**聯運提單**（全程提單）或**第三國海關核發之未再加工證明文件**（或海關認可之證明文件）。\n\n### 3. ECFA 早收產證必背數字\n- 每份 ECFA 原產地證明書限載 **≦ 20 項**貨品；**一份產證對應一份進口報單**；若進口時未及檢附，應於**貨物放行後 4 個月內**補送；經第三地轉運停留不得逾 **60 天**。\n\n### 4. 三角貿易通關作業規定（115 Q22、Q25 必考！）\n- **報單申報**：以 `G1`（納稅辦法 `90`）＋ `G3`（統計方式 `90`）同時申報，或使用進出口合一報單 **`TA`**。\n- **放行先後順序（115 Q25 正解！）**：**先經進口單位辦理「進口放行」後，再由出口單位辦理「出口放行」**！\n- **簽審規定（115 Q22 正解！）**：三角貿易因貨物僅暫存未進入國內市場，**無論是否列屬限制輸出／入貨品，原則上均免繳驗出、進口許可證**；⚠️ **但屬「戰略性高科技貨品（SHTC）」或菸品等特定法令管制者，仍應取得輸出許可證！**\n\n---\n\n## 六、考前極速自檢清單\n- [ ] 能秒答報單代碼：**`D7`**（倉轉倉／倉去廠）vs **`B2`**（廠對廠／廠進倉）、**`T1`**（轉運國內他關區／科學園區）、**`TA`**（三角貿易合一報單）？\n- [ ] 能秒答補單天數：**C1 / C3X 免補單通知補送＝3 日內**；**C2 / C3M＝翌日辦公時間終了前**？\n- [ ] 能背出九大「採收地原則」農產品（**蒜茶菇筍米、花梅李金針**，不含紅豆）及 **LDC 50%＋直接運輸 3 要件**？\n- [ ] 能背出報單填報關鍵碼：舊品 **`Used`**、FTA/LDC **`PT`（第 2 欄）**、確實不諳避罰 **`8`**、三角貿易順序「**先進口放行、後出口放行**」？\n"},{"id":"03_通關實務概要_04_海運快遞貨物通關辦法","cat":"通關實務概要","title":"海運快遞貨物通關辦法","md":"# 海運快遞貨物通關辦法【完整精讀版】\n\n\u003e **整合來源**：劉兆富講師《115 海空運快遞講義》＋《海運快遞貨物通關辦法》（**民國 115 年 2 月 23 日最新修正全文**）＋113–115 年歷屆試題  \n\u003e **考試權重**：海／空運快遞近年幾乎是**每年必出 1 題申論（20 分）＋ 8–10 題選擇**！**115 年申論第 3 題**直接考海快 §12（20 分），**115 年選擇 Q32–Q36** 連出 5 題海快！\n\n---\n\n## 一、不得於海運快遞專區通關之貨物與專區設立（§3–§9）\n\n### 1. 不得在海運快遞專區辦理通關之 3 大類（§3Ⅱ）\n1. 屬關稅法規定**不得進口之物品**、**管制品**、**侵害智慧財產權物品**、**進口生鮮農漁畜產品**、**活動植物**、**保育類野生動植物及其產製品**。\n   \u003e ⚠️ **海快 vs. 空快微妙字眼差異**：海快 §3 寫「**進口**生鮮農漁畜產品」，空快 §6 寫「生鮮農漁畜產品」（含進出口）。\n2. **每件（袋）毛重逾 70 公斤**之貨物。\n3. **以非密閉式貨櫃**裝運進口之貨物（⚠️ 海快專屬條款！必須為**密閉式貨櫃**）。\n- **全面 X 光儀檢（§3Ⅲ）**：進出口海運快遞貨物**均應通過 X 光儀器檢查**（性質不適照射 X 光經海關核准者除外）。\n\n### 2. 海運快遞專區設立、總量公告與拆櫃時限（§4、§7、§8、§8-1、§13）\n| 項目 | 現行法規規定（含 113–115 年修法重點） | 必考數字 |\n|---|---|---|\n| **設置地點（§4）** | 國際通商港口之管制區內，封閉型場所（設圍牆等實體隔離＋警衛哨所＋10 大分區含緝毒犬／檢疫犬勤務區） | 須設於國際商港管制區內 |\n| **總量管制公告（§7Ⅰ，113 修法！）** | 專區所在地海關應於**每年 10 月底前**公告次年度得受理申請設立或擴增貨物通關線之港區、線數、申請條件及申請期間 | **每年 10 月底前**公告 |\n| **資本淨額（§7Ⅱ）** | 專區業者資本淨額應在 **新臺幣 5,000 萬元以上**（不足者應提供擔保） | **5,000 萬元** |\n| **審查與建置期限（§7Ⅴ、§8）** | 審查小組審查：**60 日內**（得延長 **30 日**）；審查通過後建置期限：通知送達翌日起 **6 個月內**（得展延 **3 個月**） | 審 60+30 日；建 **6 個月＋展延 3 個月** |\n| **拆櫃進倉期限（§8-1）** | 裝運海運快遞貨物之貨櫃，應於進儲貨櫃暫存區翌日起 **3 個工作日內**拆櫃進倉 | **3 個工作日** |\n| **報關時限（§17Ⅰ、115 Q35）** | 運輸業傳輸進口艙單後始得傳輸進口報單，**至遲應於「拆櫃完畢之翌日起算 1 日內」完成報單申報**！ | **1 日內**（115 Q35 正解！） |\n| **辦公時間（§13）** | 專區所在地海關**辦公時間內**辦理（不同於空運快遞原則 24 小時！） | 海快＝**辦公時間內** |\n\n---\n\n## 二、快遞貨物 7 大分類與應以「一般報單」通關 10 款（§11、§12）\n\n```mermaid\n%% diagram:prac-express\nflowchart TD\n    G1[\"第一關：能進快遞專區嗎？(§3/§6)\u003cbr/\u003e禁運品/生鮮/智財/保育 / 毛重\u003e70kg / 海運非密閉櫃\"] --\u003e|任一符合| NO1[\"❌ 不得於專區通關！\"]\n    G1 --\u003e|全未觸犯| G2[\"第二關：能用簡易申報單嗎？(§12 十款)\u003cbr/\u003e逾5萬 / 涉輸出入規定 / 沖退保稅 / 復運 / 減免稅(非個人貨樣≤3000除外)\u003cbr/\u003e非G1G5F5 / 貨物奢稅 / 反傾銷 / 救濟防衛 / 配額\"]\n    G2 --\u003e|任一符合| GEN[\"📋 須改用「一般進出口報單」(G1/G5/F5)\"]\n    G2 --\u003e|皆未觸犯| SIM[\"⚡ 可用「簡易申報單」(X1-X3 / X6-X7)\"]\n```\n\n### 1. 海運快遞貨物 7 大分類與報單代碼（§11Ⅱ）\n| 類別 | 金額標準 | 報單類型 |\n|---|---|---|\n| **進口快遞文件（`X1`）** | 無商業價值文件 | 簡易申報單（**可併袋**） |\n| **進口低價免稅（`X2`）** | **完稅價格（CIF）NT$2,000 以下** | 簡易申報單（**不可併袋**） |\n| **進口低價應稅（`X3`）** | **完稅價格 NT$2,001 ～ NT$50,000** | 簡易申報單（**不可併袋**） |\n| **進口高價（`X4`）** | **完稅價格超過 NT$50,000** | **一般進口報單（`G1` 等）**（115 Q33：查驗實到超過 5 萬元改一般報單！） |\n| **出口快遞文件（`X6`）** | 文件類 | 簡易申報單（**可併袋**） |\n| **出口低價（`X7`）** | **離岸價格（FOB）NT$50,000 以下** | 簡易申報單（**不可併袋**） |\n| **出口高價（`X8`）** | **離岸價格超過 NT$50,000** | **一般出口報單（`G5` 等）** |\n\n### 2. 應以「一般進出口報單」辦理通關之 10 款情形（§12Ⅰ）【🔥 115 申論第 3 題，20 分！】\n\u003e **記憶口訣：「高、簽、退、復、減、非G1G5F5、貨奢、平反報、救防、配額」**（共 **10 款**，與空運快遞 §12 幾乎完全一致！）\n\n1. **高價快遞貨物**：進口完稅價格超過 NT$50,000（`X4`）或出口離岸價格超過 NT$50,000（`X8`）。\n2. **涉及輸出入規定**：但有特殊情形經海關公告者，得以簡易申報單辦理。（📌 115 Q40：網路購買醫療器材 2.5 萬元涉輸入規定 → 須用 **`G1`** 一般報單！）\n3. **需申請沖退稅或保稅用報單副本**。\n4. **復運進出口案件需調閱原出、進口報單**。\n5. **依關稅法、相關法規及稅則增註規定減免稅貨物**：\n   - ⚠️ **必考但書**：以**非個人名義**進口屬關稅法 §49Ⅰ⑨ **免稅貨樣**，整份報單完稅價格在 **新臺幣 3,000 元以下**者，**得以簡易申報單辦理通關**！（注意是 3,000 元，非 2,000 元！）\n6. **適用進口 `G1`、出口 `G5` 或 `F5`（自由港區出口）以外之報單類別貨物**。\n7. **依貨物稅條例或特種貨物及勞務稅（奢侈稅）條例規定應課稅貨物**。\n8. **財政部公告應課徵平衡稅、反傾銷稅或報復關稅貨物**。\n9. **經濟部依貿易法採取進口救濟或屬財政部公告實施特別防衛措施（SSG）貨物**。\n10. **屬關稅配額貨物**。\n\n---\n\n## 三、併單／併袋限制、嚴禁拆分、實名委任與無法委任退運（§14–§20）\n\n### 1. 合併申報 vs. 併袋通關（§14、115 Q32 必考！）\n- **合併申報（同報單號）**：辦理文件類或低價貨物簡易申報時，**得**將不同納稅義務人／輸出人之**同一主號且同類別**貨物，以同一簡易申報單號碼合併申報（海關將各收貨人列為納稅義務人核發稅單；填報實名認證行動門號者，免報身分證／居留證／護照號碼）。\n- **併袋通關（實體裝同一袋）**：**海運快遞除文件類（`X1` 及 `X6`）外，一律「不得併袋通關」**！（115 Q32 正解：**僅 `X1` 及 `X6` 可併袋**！）\n\n### 2. 「三同」同批貨物嚴禁分開申報（§15、§30、115 Q36 必考！）\n- **同批貨物定義（三同）**：**同一發貨人**、以**同一航次運輸工具**、發送給**同一收貨人**之快遞貨物。\n- **海運快遞鐵律（§15）**：**無但書！一律嚴禁分開申報！**（⚠️ 對照空快 §14：空快有「合計未逾 2,000 元或主動申報繳稅」之但書，**海快沒有！**）\n- **違反效果（§30、115 Q36 正解！）**：除處罰鍰（6,000–30,000 元）外，海關應**合併計算完稅價格**課徵進口稅；如涉申報不實須依緝私條例處罰者，**應以合併計算之漏稅額或貨價為基準裁處罰鍰**！\n\n### 3. 報關委任三方式、115/03/01 新制與無法委任退運（§18、§18-1、115 Q34）\n- **委任 3 方式（§18Ⅰ）**：\n  1. **書面個案或長期委任**：採書面「個案」委任者，應由報關業者於連線申報時先予「**具結**」報關，後依海關要求配合提示委任書（115 Q34 正解！放行前得以簽認影本先行代替原本）。\n  2. 經由**關港貿單一窗口**辦理線上個案或長期委任。\n  3. 經由通關網路業者建置之**實名認證平臺（EZ WAY 易利委）**辦理線上個案委任。\n- **🔥 115 年 2 月 23 日修正（115 年 3 月 1 日施行）§18Ⅱ**：未依前項各款方式之一完成報關委任，並於海關通關資訊系統記錄有案者，**海關得不受理報關**！\n- **報關業兜底違章責任（§18Ⅳ）**：涉虛報或違反緝私條例，如報關業者無法證明受委任、亦無法證明確有實際貨主者，**由報關業者負違章責任**。\n- **無法委任更正退運（§18-1）**：進口簡易申報貨物未放行出倉前，確認無法完成委任，且無違反緝私條例（或得免罰）及無移送他機關裁罰情事者 → 得於貨物**進倉或報關之翌日起 7 個工作日內**，由海運快遞業者申請更正為納稅義務人後退運出口。\n\n---\n\n## 四、罰則體系與 112 年重大修法「累進停業／廢照條款」（§24–§31-2）\n\n| 處罰層級 | 法條依據 | 處罰內容與關鍵門檻 |\n|---|---|---|\n| **一般違規罰則** | §24–§31（依關稅法 §87） | 警告或處 **NT$6,000 ～ NT$30,000** 罰鍰，並命限期改正；屆期未改正**按次處罰**；處罰 **3 次**仍未改正或情節重大 → 停業 6 個月以下或廢止登記 |\n| **同一年度累計停業** | **§31-1Ⅰ（112 年修法！）** | 同一年度內裁處罰鍰金額**合計達 NT$20 萬元** → 屬違規情節重大，**應停止 6 個月以下**海運快遞通關業務 |\n| **同一年度累計廢照** | **§31-1Ⅰ（112 年修法！）** | 同一年度內裁處罰鍰金額**合計達 NT$50 萬元** → **應廢止其登記** |\n| **廢止登記後禁業期** | **§31-2（112 年修法！）** | 自廢止之日起 **5 年內**不得以同一名義再行申請登記（**同一名義包含所屬同一公司及其分公司之名稱**！） |\n\n---\n\n## 五、考前極速自檢清單\n- [ ] 背出 §12 應以一般報單通關 **10 款**（含第 5 款但書：**非個人免稅貨樣 ≦ 3,000 元**可簡易）？\n- [ ] 背出海快關鍵數字：**毛重 70 kg、密閉櫃、資本淨額 5,000 萬、10 月底前公告、建置 6+3 月、拆櫃 3 工作日、申報 1 日內、無法委任 7 工作日退運**？\n- [ ] 牢記：**僅 `X1`、`X6` 可併袋**；**三同嚴禁拆分（海快無但書）**；書面個案委任採**先具結後提示**？\n- [ ] 背熟 112 年罰則：**6 千～3 萬、年累 20 萬停業 6 月以下、50 萬廢照、5 年禁重申（含分公司）**？\n"},{"id":"03_通關實務概要_05_空運快遞貨物通關辦法","cat":"通關實務概要","title":"空運快遞貨物通關辦法","md":"# 空運快遞貨物通關辦法【完整精讀版】\n\n\u003e **整合來源**：劉兆富講師《115 海空運快遞講義》＋《空運快遞貨物通關辦法》（**民國 115 年 2 月 23 日最新修正全文**）＋113–115 年歷屆試題  \n\u003e **考試關鍵**：空運與海運快遞條文高度相似，但考官**最愛考兩者的微妙差異**（例如：115 Q38–Q40 連考 3 題，其中 Q39 專門拿「專倉廢止 1 年 vs 廢止登記 5 年」設局！）。本篇直接整理**空運獨有規定＋海空快遞終極比較表**！\n\n---\n\n## 一、113–115 年最新修法重點與空運獨有制度\n\n### 1. 重大修法動態（刷 112 年以前舊題務必避雷！）\n- **🔥 113 年 8 月 8 日修正**：\n  - **全面刪除「空運快遞專差（快遞專差）」制度**（原 §7、§8、§13、§24、§27 均刪除！）。若刷舊題看到「專差攜帶 60 件／32 公斤／2 萬美元」皆為**已刪除舊制**，現行法已無快遞專差！\n  - 新增 **§3-1、§3-2**：明定空運快遞專區／航空貨物轉運中心設立與變更審查（**30 日＋延長 30 日**，建置 **6 個月＋展延 3 個月**）。\n- **🔥 115 年 2 月 23 日修正（115 年 3 月 1 日施行）**：\n  - 修正 **§17Ⅱ**：未完成報關委任並於海關通關資訊系統記錄有案者，**海關得不受理報關**（與海快 §18Ⅱ 同步）。\n\n### 2. 空運獨有「專倉通關資格」與廢止禁業期（§8-1、§8-2）【🔥 115 Q39 大陷阱！】\n| 項目 | 法條規定（§8-1、§8-2） | 超級對照陷阱（115 Q39！） |\n|---|---|---|\n| **專倉通關 3 要件（§8-1）** | 快遞業者與專區貨棧業者檢具管理計畫書聯名申請，須同時符合：\u003cbr\u003e1. 同時具備**航空運輸業或專用機隊**、**承攬業**及**報關業**三種資格。\u003cbr\u003e2. 登記滿 **3 年**以上，且最近 3 年內無私運紀錄，亦未經海關依本辦法裁處罰鍰合計達 **NT$30 萬元**。\u003cbr\u003e3. 承攬之貨物未依 §12-1Ⅱ 但書申請併袋通關。 | 如 DHL / FedEx / UPS 等自有機隊大型整合商 |\n| **廢止「專倉通關資格」禁申期（§8-2）** | 自廢止之日起 **「1 年內」**不得以同一名義（含公司及分公司）再行申請專倉通關 | ⚠️ **115 Q39 故意把 1 年寫成 5 年、把廢止登記 5 年寫成 1 年**，兩個互換設局！ |\n| **廢止「空運快遞業者登記」禁申期（§28-2）** | 自廢止之日起 **「5 年內」**不得以同一名義（含公司及分公司）再行申請登記 | 廢專倉＝**1 年**；廢業者登記＝**5 年**！ |\n\n---\n\n## 二、空運快遞通關實務重點（§6、§9–§28-2）\n\n### 1. 不得於空運專區／轉運中心通關之貨物（§6、115 Q38）\n1. 屬關稅法規定不得進口之物品、管制品、侵害智慧財產權物品、**生鮮農漁畜產品**（115 Q38 正解！）、活動植物、保育類野生動植物及其產製品。\n2. 每件（袋）**毛重逾 70 公斤**之貨物（換言之，毛重 60 公斤**可以**通關！）。\n\u003e ⚠️ **115 Q38 常見混淆**：**「需課徵反傾銷稅的中國大陸製毛巾」**只是**不得使用簡易申報單**（須改用一般報單 `G1`），**但仍可**在空運快遞專區辦理通關！（切勿把「§6 不得在專區通關」與「§12 不得用簡易申報單」搞混！）\n\n### 2. 發票黏貼、整盤進倉、併袋與拆袋（§10、§11Ⅲ、§12-1、§12-2）\n- **免貼發票特例（§10Ⅱ）**：空運快遞業者於現場備有**發票儲存系統設備**供海關查詢或列印者，**得免黏貼發票於貨物上**（海快無此免貼條款）。\n- **整盤（櫃）進倉（§11Ⅲ）**：同一貨主之出口快遞貨物得整盤（櫃）進倉；但應驗／抽驗貨物仍須拆盤（櫃）供查驗。\n- **合併申報與併袋通關（§12-1、§12-2）**：\n  - **合併申報**：得將不同納稅人／輸出人之同一主號且同類別貨物，以同一簡易申報單號碼合併申報（115 Q39 正解！）。\n  - **併袋限制（111/04/01 起收緊）**：除**進口文件類（`X1`）及出口貨物（`X6`、`X7`）**外，**進口貨物原則不得併袋通關**（僅情況特殊經海關公告者例外，例如經核准之特定電商／少件例外）。\n  - **拆袋（§12-2）**：合法併袋貨物因部分無法通過收單檢核，得申請海關核准後**派員監視拆袋**。\n\n### 3. 「三同」分開申報之但書（§14）與罰則特例（§23、§26–§28-2）\n- **三同定義（§14Ⅱ）**：同一發貨人、同一航（班）次、發送給同一收貨人。\n- **空快獨有但書（§14Ⅰ）**：原則不得分開申報；**但完稅價格合計未超過免稅限額（NT$2,000），或雖超過限額而主動申報繳納進口稅費者，不在此限**（海快 §15 無此但書！）。\n- **報關業兜底責任（§17Ⅳ、115 Q37）**：代理空運快遞報關涉虛報或違反緝私條例，無法證明受委任亦無法證明確有實際貨主 → 由 **報關業者** 負違章責任（115 Q37 正解！）。\n- **罰鍰細節注意（§23 vs §23-1～§28）**：\n  - **專區或轉運中心經營業者**違規（§23）：警告或處 **NT$20,000 ～ NT$30,000** 罰鍰！（下限是 2 萬元，非 6 千元！）\n  - **空運快遞業者**違規（§23-1、§25、§26、§28）：處 **NT$6,000 ～ NT$30,000**（⚠️ 注意 §26Ⅰ 非文件誤報文件類、§28Ⅰ 違反禁分開申報，**無「警告」選項，直接罰鍰**！）。\n  - **同一年度累進處分（§28-1、§28-2）**：年累計達 **20 萬元** → 停業 6 個月以下；年累計達 **50 萬元** → 廢止登記（**5 年內**不得以同一名義〔含分公司〕再申請登記）。\n\n---\n\n## 三、海運快遞 vs. 空運快遞「必考差異」終極對照表\n\n| 比較項目 | **海運快遞貨物通關辦法** | **空運快遞貨物通關辦法** |\n|---|---|---|\n| **通關場所** | 海運快遞貨物專區（國際商港管制區內） | 空運快遞貨物專區、航空貨物轉運中心 |\n| **海關辦公時間** | 所在地海關**辦公時間內**（§13） | **24 小時**（夜間禁航機場配合調整，§9） |\n| **專區資本額／總量** | 資本淨額 **5,000 萬元以上**；**每年 10 月底前**公告次年度線數（§7） | 無明定 5,000 萬資本額與每年 10 月底總量公告 |\n| **設立審查／建置** | 審查 **60 日（+30 日）**；建置 **6 月（+3 月）** | 審查 **30 日（+30 日）**；建置 **6 月（+3 月）** |\n| **專倉通關制度** | 無 | 有（§8-1：機隊＋承攬＋報關、3 年無私運＆罰鍰 \u003c 30 萬；廢專倉 **1 年**禁申） |\n| **禁運專區條件** | 禁運品（寫「進口」生鮮）＋毛重 \u003e 70 kg ＋ **非密閉式貨櫃** | 禁運品（含進出口生鮮）＋毛重 \u003e 70 kg（無密閉櫃條款） |\n| **發票黏貼** | 須黏貼發票或價值聲明（無免貼系統條款） | 現場備有**發票儲存系統設備**者得免黏貼（§10Ⅱ） |\n| **報關／拆櫃期限** | 進儲貨櫃暫存區翌日起 **3 工作日**拆櫃；拆櫃完畢翌日起 **1 日內**完成報關 | 得於進口前預先申報（無 3 工作日拆櫃／1 日報關條文） |\n| **應以一般報單（§12）** | 10 款完全對稱（非個人免稅貨樣 **≦ 3,000 元**可簡易） | 10 款完全對稱（非個人免稅貨樣 **≦ 3,000 元**可簡易） |\n| **併袋通關許可** | 僅 **文件類（`X1`、`X6`）** 可併袋，其餘均不可（§14Ⅴ） | **進口文件類（`X1`）及出口貨物（`X6`、`X7`）** 可併袋；進口貨物原則不可（海關公告例外，§12-1Ⅱ） |\n| **三同分開申報** | **嚴禁拆分（無但書！）**（§15） | 原則禁止，**但合計未逾 2,000 元免稅額或主動申報繳稅者除外**（§14） |\n| **無法委任退運** | 進倉或報關翌日起 **7 個工作日內**更正納稅人退運（§18-1） | 進倉或報關翌日起 **7 個工作日內**更正納稅人退運（§17-1） |\n| **專區業者罰鍰下限** | NT$6,000 ～ NT$30,000 | **NT$20,000 ～ NT$30,000**（§23！） |\n| **年度累計停業／廢照** | **20 萬停業 ≦ 6 月／50 萬廢照／5 年禁重申（含分公司）** | **20 萬停業 ≦ 6 月／50 萬廢照／5 年禁重申（含分公司）** |\n\n---\n\n## 四、考前極速自檢清單\n- [ ] 絕不再混淆「**不得於專區通關（§6：生鮮蔬果、\u003e70kg）**」與「**不得簡易申報（§12：醫療器材涉輸入規定、反傾銷稅、\u003e5 萬）**」？\n- [ ] 牢記空快 **1 年 vs 5 年**：廢止**專倉通關資格＝1 年內**禁重申；廢止**快遞業者登記＝5 年內**禁重申？\n- [ ] 牢記海空快 **5 大差異**：辦公時間（辦公 vs 24h）、審查期（60 vs 30 日）、併袋（X1/X6 vs X1/出口）、三同但書（海無 vs 空有）、專區業者罰鍰下限（6 千 vs 2 萬）？\n"},{"id":"03_通關實務概要_06_運輸工具旅客規費與保稅區實務","cat":"通關實務概要","title":"運輸工具旅客規費與保稅區實務","md":"# 運輸工具、旅客免稅、海關規費與保稅五區實務【完整精讀版】\n\n\u003e **整合來源**：任冠儀講師《115 通關實務講 01（運輸工具與轉運）、講 03（旅客行李與洗錢防制）、講 04（海關徵收規費規則）、講 06（保稅區實務）》＋113–115 年最新修法（含 **113/07 旅客免稅 3.5 萬、114/01 酒 1.5L、鍵輸費 350 元新制**）  \n\u003e **為什麼必讀這份補充精讀版？**：這 4 個模組雖非單一獨立辦法名稱，但每年在《通關實務概要》與《關務法規概要》合計出題 **10–15 題選擇＋偶發申論**，且近年修法極密集（旅客免稅額、酒量、鍵輸費全部剛調高！），讀熟這篇能輕鬆多拿 15 分以上！\n\n---\n\n## 一、運輸工具進出口通關、艙單、結關與轉口（講 01）\n\n### 1. 進口艙單預報時限與更正期限\n| 運輸工具 | 進口艙單「預報」時限 | 連線更正期限 | 非連線更正期限 |\n|---|---|---|---|\n| **海運（船舶）** | 船舶抵達我國港口前 **5 小時**（以船舶**繫泊**時間為準） | 傳輸後 **72 小時**內（未依限預報者縮減為 **48 小時**內） | **24 小時**內 |\n| **空運（飛機）** | 航程 \u003e 4 小時者：抵達前 **2 小時**；航程 ≦ 4 小時者：起飛前（或抵達前依規定） | 連線傳輸後 **72 小時**（未預報 **48 小時**） | **24 小時**內 |\n\n### 2. 出口清表、結關與短溢卸報告\n- **出口裝船清表**：應於運輸工具**結關前**向海關申報；**出口貨櫃清單**得於結關後 **48 小時內**補送。\n- **結關與開航**：運輸工具辦妥結關手續後，應於 **48 小時內**開航（逾期須重辦或展延）。\n- **免辦結關特例**：船舶／飛機進港（場）後 **24 小時內**開航，且**未上下旅客及裝卸貨物**者，**免辦結關**。\n- **短卸／溢卸報告提出期限（必背！）**：\n  | 貨物型態 | 提出短／溢卸報告期限 |\n  |---|---|\n  | **整裝貨櫃（CY）** | 卸船完畢翌日起 **1 日內** |\n  | **併裝貨櫃（CFS）** | 拆櫃完畢翌日起 **3 日內** |\n  | **非櫃裝貨物（散雜貨）** | 卸船完畢翌日起 **7 日內** |\n  | **快遞貨物** | 進倉（或拆櫃）完畢翌日起 **1 日內** |\n- **轉口貨物期限**：轉口貨物應於進儲翌日起 **60 日內**轉運出口；有正當理由得申請延長 **1 次**，以 **30 日**為限（共 90 日）。\n\n---\n\n## 二、入境旅客行李免稅規定與洗錢防制申報門檻（講 03）【🔥 113–114 最新修法！】\n\n### 1. 旅客行李報關與免稅額度（含最新調高數字！）\n- **不隨身行李**：**一律辦理一般進口報關**（且須於入境時先申報，並於入境翌日起 **6 個月內**運抵進口始享免稅額度）。\n- **隨身非自用／非限制貨物**：出境或入境攜帶非自用、非限制輸出入貨物，價格在 **US$20,000 以下**得免辦一般報關（§16 等規定）。\n- **🔥 入境旅客自用行李免稅額與菸酒免稅額（113–114 年雙雙調高！）**：\n  | 項目 | **現行最新規定（116 年必考！）** | 舊制對照（刷舊題留意） |\n  |---|---|---|\n  | **一般自用行李免稅額** | **新臺幣 35,000 元**（113 年 7 月起調高！） | 舊制 20,000 元 |\n  | **酒類免稅量（滿 18 歲）** | **1.5 公升**（不限瓶數，114 年 1 月起調高！） | 舊制 1 公升 |\n  | **捲菸免稅量（滿 20 歲）** | **捲菸 200 支**（或雪茄 25 支、菸絲 1 磅） | 同左（注意年齡：**酒 18 歲、菸 20 歲**！） |\n  | **超額未申報菸酒罰則** | 依《菸酒管理法》§45Ⅳ：**沒入**超額部分，並按每條捲菸／每公升酒處 **NT$500 ～ NT$5,000** 罰鍰（200 支捲菸罰 1,000 元等基準） | 依菸酒管理法處罰，非僅補稅 |\n\n### 2. 入出境洗錢防制申報門檻與「未申報法律效果」6 大表（超級必考！）\n\n```mermaid\n%% diagram:prac-aml\nflowchart LR\n    AML[\"入出境洗錢防制申報\"] --\u003e CASH[\"🔴 現金類：未申報 → 超額「沒入」\u003cbr/\u003e• 新臺幣 \u003e NT$10 萬 (限帶)\u003cbr/\u003e• 人民幣 \u003e RMB 2 萬 (超額封存)\u003cbr/\u003e• 外幣 \u003e 等值 US$1 萬 (申報不限)\"]\n    AML --\u003e ASSET[\"🟠 非現金類：未申報 → 處「罰鍰」(不沒入)\u003cbr/\u003e• 無記名有價證券 \u003e US$1 萬\u003cbr/\u003e• 黃金 \u003e US$2 萬\u003cbr/\u003e• 超自用鑽石寶石白金 \u003e NT$50 萬\"]\n```\n\u003e ⚠️ **記憶鐵律**：**現金類（臺幣／人民幣／外幣）＝沒入**；**非現金資產類（有價證券／黃金／鑽石寶石白金）＝處罰鍰（不沒入！）**\n\n| 物品類別 | 申報門檻（每人每次） | 未申報／申報不實之處分 | 特殊備註 |\n|---|---|---|---|\n| **新臺幣現鈔** | **超過 NT$100,000** | 超額部分 **沒入** | 即使申報亦**限帶 10 萬元**（超額須先經央行許可，未許可者封存退運） |\n| **人民幣現鈔** | **超過 RMB 20,000** | 超額部分 **沒入** | 超過 2 萬經申報者由海關**封存**退運 |\n| **外幣現鈔（含港幣、澳門幣）** | **等值超過 US$10,000** | 超額部分 **沒入** | 經申報者**不限攜帶金額** |\n| **無記名有價證券**（旅行支票、匯票、本票等） | **等值超過 US$10,000** | 處相當於未申報金額之 **罰鍰**（不沒入） | 僅指「無記名」票據 |\n| **黃金** | **等值超過 US$20,000** | 處相當於未申報價額之 **罰鍰**（不沒入） | 逾 2 萬美元且須另辦經濟部國貿署輸入／輸出許可 |\n| **超越自用目的之鑽石、寶石及白金** | **總價值超過 NT$500,000** | 處相當於未申報價額之 **罰鍰**（不沒入） | 限「超越自用目的」者 |\n\n---\n\n## 三、海關徵收規費規則完整收費表（講 04）【🔥 鍵輸費新舊制必看！】\n\n### 1. 各項規費標準總表\n| 規費項目 | 收費標準（新臺幣） | 必考細節與例外 |\n|---|---|---|\n| **特別驗貨費** | **1,300 元／份**（每份報單） | 例假日、夜間或海關核准於非指定地點查驗時徵收 |\n| **特別監視費** | • 船舶／飛機：**2,000 元／班（次）**\u003cbr\u003e• 貨櫃集散站／貨棧／保稅倉庫：**1,000 元／班**\u003cbr\u003e• 保稅運貨工具：**450 元／班** | 依不同對象分三級收費 |\n| **加封費** | • **一般封條**：**100 元／只**（業者自封 **50 元**）\u003cbr\u003e• **被動式電子封條**：**250 元／只**（業者自封 **200 元**） | ⚠️ **加封費不適用 §9 免徵及 §10 減半規定！**\u003cbr\u003e有 4 款法定免徵加封費情形（如郵包、轉口海關自封特定案件等） |\n| **押運費** | • 同區（或短程）：**600 元**\u003cbr\u003e• 跨區 **\u003c 150 km**：**1,700 元**\u003cbr\u003e• 跨區 **150 ～ 250 km**：**3,700 元**\u003cbr\u003e• 跨區 **≧ 250 km**：**4,600 元** | 每次押運以 **3 輛車（或 3 櫃）** 為限 |\n| **鍵輸費（未連線書面遞單）** | • **報單**：現行 **350 元／份**（⚠️ 114 年以前舊題多考舊制 **200 元**！）\u003cbr\u003e• **艙單**：**200 元／份**\u003cbr\u003e• **其他（如申請書）**：**100 元／份** | 連線報關免徵；書面人工代鍵始徵收 |\n| **快速通關處理費** | 按財政部公告費率徵收，**每 6 個月檢討一次** | 適用於海／空運快遞貨物 |\n| **海關倉庫貯存費** | • **旅客行李**：存倉前 3 日免費，**第 4 日起 30 元／件／日**，上限為完稅價格 **20%**\u003cbr\u003e• **一般進出口貨物**：上限為完稅價格 **50%** | 旅客 20% vs 一般 50%！ |\n| **核發證照費** | 核發新照 **2,000 元**；補發或換發 **1,000 元** | 如報關業證照、保稅證照等 |\n\n### 2. 規費免徵（§9）、減半（§10）與繳納期限\n- **免徵特別驗貨費／特別監視費／押運費（§9）**：① 旅客行李 ② 軍事機關進出口物品 ③ **科技產業園區／科學園區／農業科技園區**出口郵包 ④ 緊急救難物資 ⑤ 總重 **≦ 20 公斤**之進口書報刊物／教育文化新聞影片。\n- **減半徵收（§10）**：進出口貨物離岸／完稅價格在 **US$5,000 以下**者，特別驗貨費、特別監視費、押運費**減半徵收**（⚠️ **加封費不適用減半！**）。\n- **繳納期限與分期**：海關核發規費證翌日起 **14 日內**繳納；應繳規費合計達 **NT$50 萬元以上**確有困難者，得申請分期繳納。\n\n---\n\n## 四、保稅五區與「物流中心 `D8` vs. `L1`」終極比較表（講 06）\n\n```mermaid\n%% diagram:prac-bonded\nflowchart LR\n    EXT[\"國外貨物\"] --\u003e|D8 (一般保倉無C1)| BW[\"保稅倉庫 (2千萬/5千萬)\u003cbr/\u003e存2年不延\"]\n    EXT --\u003e|L1(汽機車/未開放陸貨)\u003cbr/\u003eD8(洋菸酒/露天櫃)| LC[\"物流中心 (1.5億)\u003cbr/\u003e24h通關・存期原則不限\"]\n    EXT --\u003e|B6| BF[\"保稅工廠 (5千萬)\u003cbr/\u003e原料2年+延1年\"]\n    EXT --\u003e|F1| FTZ[\"自由貿易港區 (交通部)\u003cbr/\u003e六海一空・存期不限\"]\n    BW --\u003e|D7轉廠 / D2內銷 / D5出口| OUT[\"課稅區 / 國外\"]\n    BF --\u003e|B2廠對廠或進倉 / G2內銷 / B9成品出口| OUT\n    FTZ --\u003e|F2內銷 / F3區內 / F4國內 / F5出口| OUT\n```\n\n### 1. 我國五大保稅營運體制對照表\n| 項目 | **一般保稅倉庫** | **自用保稅倉庫** | **物流中心** | **保稅工廠** | **自由貿易港區** |\n|---|---|---|---|---|---|\n| **主管機關** | 財政部（海關） | 財政部（海關） | 財政部（海關） | 財政部（海關） | **交通部**（六海一空：基隆、臺北、蘇澳、臺中、安平、高雄港＋桃園航空自由港區） |\n| **最低實收資本額** | **2,000 萬元** | **5,000 萬元** | **1.5 億元** | 5,000 萬元（公司組織） | 依港區事業規定 |\n| **進儲外貨報單** | **`D8`**（僅 **C2 / C3**，無 C1！） | **`D8`**（可有 **C1**） | **`L1` 或 `D8`**（**24 小時**通關） | **`B6`** | **`F1`** |\n| **存儲期限** | **2 年**（不得延長，特定除外） | **2 年**（不得延長） | **原則不限**（⚠️ 但來自**課稅區貨物及洋菸酒**仍限 **2 年**！） | 原料 **2 年**，得申請延長 **1 年** | 原則不限 |\n| **常用出區／交易報單** | `D2`（內銷）、`D5`（出口）、`D7`（轉他倉／保廠） | 同左 | 同左 | `B2`（廠對廠／進倉）、`B8`（料復出）、`B9`（成品出口）、`G2`（內銷補稅） | `F2`（銷課稅區）、`F3`（區內交易）、`F4`（與他港區／課稅區）、`F5`（出口） |\n| **可從事作業** | 檢驗、測試、整理、分類、分割、裝配、**重裝**（不得製造加工） | 同左（專供自用） | 倉儲、轉運、配送及**重整及簡單加工** | **製造、加工、裝配**外銷產品 | 倉儲、物流、組裝、重整、包裝、修理、裝配、加工、製造、檢驗、測試、展覽、技術服務 |\n\n### 2. 物流中心進儲外貨：`L1` vs. `D8` 必考區分！\n- **必須申報 `L1`（轉運申請書進儲）**：**汽機車**、**未開放進口之大陸物品**（限以 `L1` 進儲物流中心，不得用 `D8`）。\n- **必須申報 `
